<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f7a4b">
<title>Caliphate Tarbiya Academy Sokoto</title>

<style>
*{box-sizing:border-box}
:root{
 --green:#0f7a4b;
 --green2:#075c38;
 --light:#eef8f2;
 --lighter:#f7fbf8;
 --dark:#18352a;
 --muted:#66756e;
 --border:#d9e6df;
 --danger:#c62828;
 --warning:#e89b00;
 --white:#fff;
 --shadow:0 8px 25px rgba(0,0,0,.08);
}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f3f7f5;
 color:var(--dark);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#075c38,#13a866);
}
.login-card{
 width:100%;
 max-width:440px;
 background:#fff;
 border-radius:20px;
 padding:30px;
 box-shadow:0 20px 60px rgba(0,0,0,.2);
}
.logo{
 width:75px;height:75px;
 margin:auto;
 border-radius:50%;
 background:var(--green);
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:27px;
}
.login-card h1{text-align:center;margin:15px 0 5px;font-size:23px}
.login-card .sub{text-align:center;color:var(--muted);margin-bottom:25px}
.form-group{margin-bottom:15px}
.form-group label{
 display:block;
 font-weight:bold;
 margin-bottom:7px;
 font-size:14px;
}
input,select,textarea{
 width:100%;
 border:1px solid var(--border);
 border-radius:9px;
 padding:11px 12px;
 outline:none;
 background:white;
}
input:focus,select:focus,textarea:focus{
 border-color:var(--green);
 box-shadow:0 0 0 3px rgba(15,122,75,.1);
}
.btn{
 border:0;
 border-radius:8px;
 padding:10px 15px;
 background:var(--green);
 color:white;
 font-weight:bold;
}
.btn:hover{background:var(--green2)}
.btn.secondary{background:#e9f2ed;color:var(--green2)}
.btn.danger{background:var(--danger)}
.btn.warning{background:var(--warning)}
.btn.gray{background:#65716c}
.btn.small{padding:7px 10px;font-size:12px}
.login-demo{
 margin-top:18px;
 background:var(--light);
 border-radius:10px;
 padding:12px;
 font-size:12px;
 line-height:1.7;
}

/* APP */
#app{display:none;min-height:100vh}
.topbar{
 height:64px;
 background:var(--green);
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:fixed;
 top:0;left:0;right:0;
 z-index:100;
}
.brand{font-weight:bold;font-size:18px}
.user-area{display:flex;align-items:center;gap:10px;font-size:13px}
.menu-btn{
 display:none;
 background:none;
 color:white;
 border:0;
 font-size:25px;
}
.layout{display:flex;padding-top:64px}
.sidebar{
 width:255px;
 background:white;
 border-right:1px solid var(--border);
 min-height:calc(100vh - 64px);
 position:fixed;
 top:64px;left:0;bottom:0;
 overflow-y:auto;
 padding:15px 10px;
}
.sidebar h4{
 color:#84928c;
 font-size:11px;
 text-transform:uppercase;
 padding:12px 10px 5px;
 margin:0;
}
.nav-btn{
 width:100%;
 border:0;
 background:transparent;
 text-align:left;
 padding:11px 12px;
 border-radius:8px;
 margin:2px 0;
 color:#3d5148;
 font-weight:600;
}
.nav-btn:hover,.nav-btn.active{
 background:var(--light);
 color:var(--green2);
}
.main{
 margin-left:255px;
 width:calc(100% - 255px);
 padding:25px;
}
.page-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:20px;
 flex-wrap:wrap;
}
.page-title h2{margin:0;font-size:23px}
.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}

/* CARDS */
.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-bottom:20px;
}
.card{
 background:white;
 border:1px solid var(--border);
 border-radius:13px;
 padding:18px;
 box-shadow:0 3px 12px rgba(0,0,0,.03);
}
.stat-label{font-size:12px;color:var(--muted)}
.stat-number{font-size:28px;font-weight:bold;margin-top:7px;color:var(--green2)}
.panel{
 background:white;
 border:1px solid var(--border);
 border-radius:13px;
 padding:18px;
 margin-bottom:20px;
}
.panel h3{margin:0 0 15px;font-size:17px}
.toolbar{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 align-items:center;
 margin-bottom:15px;
}
.toolbar>*{width:auto}
.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}
.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
}

/* TABLE */
.table-wrap{
 width:100%;
 overflow:auto;
 border:1px solid var(--border);
 border-radius:9px;
}
table{
 width:100%;
 border-collapse:collapse;
 min-width:700px;
}
th,td{
 border-bottom:1px solid var(--border);
 padding:10px;
 text-align:left;
 font-size:13px;
 white-space:nowrap;
}
th{
 background:#f0f7f3;
 color:#355046;
 font-size:12px;
 position:sticky;
 top:0;
 z-index:2;
}
tr:hover td{background:#fafdfb}
.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
 background:#e8f2ed;
 color:var(--green2);
}
.badge.red{background:#fdeaea;color:#b11e1e}
.badge.yellow{background:#fff5dc;color:#946300}
.badge.blue{background:#e8f0ff;color:#315b9e}

/* REGISTER */
.register-controls{
 background:#edf8f2;
 border:1px solid #cfe6d9;
 padding:15px;
 border-radius:12px;
 margin-bottom:15px;
}
.register-controls .grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:10px;
}
.register-table{
 min-width:1200px;
}
.register-table th,
.register-table td{
 text-align:center;
 vertical-align:middle;
 padding:6px;
}
.register-table th.student-head,
.register-table td.student-cell{
 text-align:left;
 position:sticky;
 left:0;
 background:white;
 z-index:3;
 min-width:220px;
}
.register-table th.student-head{
 background:#e7f4ed;
 z-index:5;
}
.register-table th.date-head{
 min-width:48px;
}
.att-btn{
 width:34px;
 height:30px;
 border-radius:6px;
 border:1px solid #d3dfd9;
 background:white;
 font-size:11px;
 font-weight:bold;
}
.att-btn.P{background:#dff5e8;color:#08703e;border-color:#a8dbbc}
.att-btn.A{background:#ffe4e4;color:#b11d1d;border-color:#f3b2b2}
.att-btn.L{background:#fff0c9;color:#8a6200;border-color:#e9ce7d}
.att-btn.E{background:#e8eefc;color:#36589a;border-color:#b8c8eb}
.total-cell{font-weight:bold;background:#f7faf8}
.percent-good{color:#08703e;font-weight:bold}
.percent-mid{color:#a16b00;font-weight:bold}
.percent-low{color:#b11d1d;font-weight:bold}
.register-footer td{
 font-weight:bold;
 background:#edf8f2;
}

/* MODAL */
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.5);
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:500;
}
.modal.show{display:flex}
.modal-box{
 background:white;
 width:100%;
 max-width:600px;
 max-height:90vh;
 overflow:auto;
 border-radius:15px;
 padding:22px;
}
.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}
.modal-head h3{margin:0}
.close{
 background:#eee;
 border:0;
 width:32px;height:32px;
 border-radius:50%;
}
.modal-actions{
 display:flex;
 justify-content:flex-end;
 gap:8px;
 margin-top:18px;
}

/* PRINT */
@media print{
 .topbar,.sidebar,.no-print,.page-title button,.toolbar,.register-controls{display:none!important}
 .main{margin:0;width:100%;padding:0}
 .panel{border:0;box-shadow:none}
 .register-table{min-width:0;font-size:9px}
 th,td{font-size:9px;padding:4px}
}

/* RESPONSIVE */
@media(max-width:1050px){
 .cards{grid-template-columns:repeat(2,1fr)}
 .register-controls .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:800px){
 .menu-btn{display:block}
 .sidebar{
  transform:translateX(-100%);
  transition:.25s;
  z-index:200;
 }
 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0;width:100%;padding:15px}
 .grid2,.grid3{grid-template-columns:1fr}
 .cards{grid-template-columns:1fr 1fr}
 .brand{font-size:14px}
}
@media(max-width:550px){
 .cards{grid-template-columns:1fr}
 .register-controls .grid{grid-template-columns:1fr}
 .topbar{padding:0 12px}
 .user-area span{display:none}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen">
 <div class="login-card">
  <div class="logo">CTA</div>
  <h1>Caliphate Tarbiya Academy</h1>
  <div class="sub">Sokoto • Academic Management System</div>

  <div class="form-group">
   <label>Login Type</label>
   <select id="loginRole">
    <option value="admin">Administrator</option>
    <option value="teacher">Teacher</option>
    <option value="student">Student</option>
    <option value="parent">Parent</option>
   </select>
  </div>

  <div class="form-group">
   <label>Username</label>
   <input id="loginUsername" placeholder="Enter username">
  </div>

  <div class="form-group">
   <label>Password</label>
   <input id="loginPassword" type="password" placeholder="Enter password">
  </div>

  <button class="btn" style="width:100%" onclick="login()">Login</button>

  <div class="login-demo">
   <b>Administrator Demo</b><br>
   Username: <b>Admin</b><br>
   Password: <b>Admin@2026!</b>
  </div>
 </div>
</section>

<!-- APPLICATION -->
<div id="app">

 <header class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
   <button class="menu-btn" onclick="toggleSidebar()">☰</button>
   <div class="brand">Caliphate Tarbiya Academy</div>
  </div>

  <div class="user-area">
   <span id="topUser"></span>
   <button class="btn small" onclick="logout()">Logout</button>
  </div>
 </header>

 <div class="layout">

  <aside class="sidebar" id="sidebar">

   <h4>Main</h4>
   <button class="nav-btn" data-page="dashboard" onclick="go('dashboard')">🏠 Dashboard</button>

   <div id="adminNav">
    <h4>Administration</h4>
    <button class="nav-btn" data-page="accounts" onclick="go('accounts')">👤 User Accounts</button>
    <button class="nav-btn" data-page="teachers" onclick="go('teachers')">👨‍🏫 Teachers</button>
    <button class="nav-btn" data-page="students" onclick="go('students')">🎓 Students</button>
    <button class="nav-btn" data-page="parents" onclick="go('parents')">👪 Parents</button>
    <button class="nav-btn" data-page="classes" onclick="go('classes')">🏫 Classes & Subjects</button>
    <button class="nav-btn" data-page="hod" onclick="go('hod')">📚 HOD Assignment</button>
    <button class="nav-btn" data-page="examofficer" onclick="go('examofficer')">📝 Examination Officer</button>
   </div>

   <h4>Academic</h4>
   <button class="nav-btn" data-page="documents" onclick="go('documents')">📄 Documents</button>
   <button class="nav-btn" data-page="submissions" onclick="go('submissions')">📤 Submissions</button>
   <button class="nav-btn" data-page="approval" onclick="go('approval')">✅ Approval Centre</button>
   <button class="nav-btn" data-page="attendance" onclick="go('attendance')">📋 School Register</button>
   <button class="nav-btn" data-page="results" onclick="go('results')">📊 Results</button>
   <button class="nav-btn" data-page="assistant" onclick="go('assistant')">🤖 Teacher Assistant</button>

   <h4>Account</h4>
   <button class="nav-btn" data-page="settings" onclick="go('settings')">⚙️ Settings</button>
   <button class="nav-btn" data-page="profile" onclick="go('profile')">👤 My Profile</button>

  </aside>

  <main class="main" id="main"></main>
 </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
 <div class="modal-box" id="modalContent"></div>
</div>

<script>
/* =========================================================
   DATABASE
========================================================= */

const DB_KEY = "CTA_ACADEMY_REGISTER_UPGRADE_V1";
const SESSION_KEY = "CTA_ACADEMY_SESSION_UPGRADE_V1";

const DEFAULT_CLASSES = [
 "Nursery 1","Nursery 2","Nursery 3",
 "Basic 1","Basic 2","Basic 3","Basic 4","Basic 5","Basic 6",
 "JSS1","JSS2","JSS3","SS1","SS2","SS3"
];

const DEFAULT_SUBJECTS = [
 "Mathematics","English Language","Physics","Chemistry","Biology",
 "Economics","Hausa","Arabic","French","Computer Studies",
 "Basic Science","Basic Technology","Social Studies","Civic Education",
 "Agricultural Science","Geography","Government","Literature in English",
 "Islamic Religious Studies","Christian Religious Studies","Home Economics",
 "Commerce","Financial Accounting","Further Mathematics"
];

let db;
let session = null;
let currentPage = "dashboard";

function newDB(){
 return {
  accounts:[],
  students:[],
  parents:[],
  teachers:[],
  classes: DEFAULT_CLASSES.map((name,i)=>({
   id:"class-"+i,
   name,
   sections:["A","B"]
  })),
  subjects: DEFAULT_SUBJECTS.map((name,i)=>({
   id:"subject-"+i,
   name
  })),
  hodAssignments:[],
  examOfficers:[],
  documents:[],
  results:[],
  attendance:{},
  settings:{
   schoolName:"Caliphate Tarbiya Academy Sokoto",
   phone:"",
   address:"Sokoto State, Nigeria",
   session:"2026/2027",
   term:"First Term"
  }
 };
}

function loadDB(){
 try{
  db=JSON.parse(localStorage.getItem(DB_KEY)) || newDB();
 }catch(e){
  db=newDB();
 }
 normalizeDB();
 ensureAdmin();
 saveDB();
}

function normalizeDB(){
 if(!db || typeof db!=="object") db=newDB();

 const arrays=[
  "accounts","students","parents","teachers","classes","subjects",
  "hodAssignments","examOfficers","documents","results"
 ];

 arrays.forEach(k=>{
  if(!Array.isArray(db[k])) db[k]=[];
 });

 if(!db.attendance || typeof db.attendance!=="object") db.attendance={};

 if(!db.settings) db.settings={
  schoolName:"Caliphate Tarbiya Academy Sokoto",
  phone:"",
  address:"Sokoto State, Nigeria",
  session:"2026/2027",
  term:"First Term"
 };

 if(!db.classes.length){
  db.classes=DEFAULT_CLASSES.map((name,i)=>({
   id:"class-"+i,name,sections:["A","B"]
  }));
 }

 if(!db.subjects.length){
  db.subjects=DEFAULT_SUBJECTS.map((name,i)=>({
   id:"subject-"+i,name
  }));
 }
}

function saveDB(){
 localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function ensureAdmin(){
 let admin=db.accounts.find(a=>a.id==="admin-001");

 if(!admin){
  db.accounts.push({
   id:"admin-001",
   role:"admin",
   username:"Admin",
   password:"Admin@2026!",
   name:"Administrator",
   active:true
  });
 }else{
  admin.role="admin";
  admin.username="Admin";
  admin.password="Admin@2026!";
  admin.active=true;
 }
}

function uid(prefix){
 return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
}

function esc(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function currentUser(){
 if(!session) return null;
 return db.accounts.find(a=>a.id===session.accountId);
}

function isAdmin(){
 return currentUser()?.role==="admin";
}

function isTeacher(){
 return currentUser()?.role==="teacher";
}

function isStudent(){
 return currentUser()?.role==="student";
}

function isParent(){
 return currentUser()?.role==="parent";
}

/* =========================================================
   LOGIN
========================================================= */

function login(){
 const role=document.getElementById("loginRole").value;
 const username=document.getElementById("loginUsername").value.trim();
 const password=document.getElementById("loginPassword").value;

 const account=db.accounts.find(a=>
  a.role===role &&
  a.username.toLowerCase()===username.toLowerCase() &&
  a.password===password &&
  a.active!==false
 );

 if(!account){
  alert("Invalid login details.");
  return;
 }

 session={
  accountId:account.id,
  loginAt:new Date().toISOString()
 };

 localStorage.setItem(SESSION_KEY,JSON.stringify(session));
 showApp();
}

function logout(){
 localStorage.removeItem(SESSION_KEY);
 session=null;
 document.getElementById("app").style.display="none";
 document.getElementById("loginScreen").style.display="flex";
}

function restoreSession(){
 try{
  session=JSON.parse(localStorage.getItem(SESSION_KEY));
 }catch(e){
  session=null;
 }

 if(session && currentUser()){
  showApp();
 }else{
  session=null;
  document.getElementById("loginScreen").style.display="flex";
 }
}

function showApp(){
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("app").style.display="block";

 const u=currentUser();
 document.getElementById("topUser").textContent=
  `${u.name||u.username} • ${roleName(u.role)}`;

 document.getElementById("adminNav").style.display=isAdmin()?"block":"none";

 go("dashboard");
}

function roleName(role){
 return {
  admin:"Administrator",
  teacher:"Teacher",
  student:"Student",
  parent:"Parent"
 }[role]||role;
}

/* =========================================================
   NAVIGATION
========================================================= */

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("open");
}

function go(page){
 currentPage=page;

 document.querySelectorAll(".nav-btn").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===page);
 });

 document.getElementById("sidebar").classList.remove("open");

 const allowed={
  dashboard:true,
  accounts:isAdmin(),
  teachers:isAdmin(),
  students:isAdmin(),
  parents:isAdmin(),
  classes:isAdmin(),
  hod:isAdmin(),
  examofficer:isAdmin(),
  documents:isAdmin()||isTeacher(),
  submissions:isAdmin()||isTeacher(),
  approval:isAdmin()||isTeacher(),
  attendance:true,
  results:true,
  assistant:isAdmin()||isTeacher(),
  settings:isAdmin(),
  profile:true
 };

 if(!allowed[page]){
  alert("You do not have permission to access this page.");
  return go("dashboard");
 }

 const pages={
  dashboard:renderDashboard,
  accounts:renderAccounts,
  teachers:renderTeachers,
  students:renderStudents,
  parents:renderParents,
  classes:renderClasses,
  hod:renderHOD,
  examofficer:renderExamOfficers,
  documents:renderDocuments,
  submissions:renderSubmissions,
  approval:renderApproval,
  attendance:renderAttendance,
  results:renderResults,
  assistant:renderAssistant,
  settings:renderSettings,
  profile:renderProfile
 };

 pages[page]();
}

/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){
 const u=currentUser();

 let html=`
 <div class="page-title">
  <div>
   <h2>Dashboard</h2>
   <p>Welcome, ${esc(u.name||u.username)}</p>
  </div>
 </div>`;

 if(isAdmin()){
  html+=`
  <div class="cards">
   ${stat("👨‍🏫","Teachers",db.accounts.filter(a=>a.role==="teacher").length)}
   ${stat("🎓","Students",db.accounts.filter(a=>a.role==="student").length)}
   ${stat("👪","Parents",db.accounts.filter(a=>a.role==="parent").length)}
   ${stat("📋","Register Entries",Object.keys(db.attendance).length)}
  </div>

  <div class="panel">
   <h3>School Register</h3>
   <p>The attendance system is now designed as a complete electronic school register. Select a class, section, month and mark students as Present, Absent, Late or Excused.</p>
   <button class="btn" onclick="go('attendance')">Open School Register</button>
  </div>`;
 }else if(isTeacher()){
  html+=`
  <div class="cards">
   ${stat("📄","My Documents",db.documents.filter(d=>d.createdBy===u.id).length)}
   ${stat("📤","Submitted",db.documents.filter(d=>d.createdBy===u.id&&d.status==="submitted").length)}
   ${stat("📋","Register",Object.keys(db.attendance).length)}
   ${stat("📊","Results",db.results.filter(r=>r.createdBy===u.id).length)}
  </div>

  <div class="panel">
   <h3>Teacher Quick Actions</h3>
   <div class="toolbar">
    <button class="btn" onclick="go('attendance')">📋 School Register</button>
    <button class="btn secondary" onclick="go('results')">📊 Enter Results</button>
    <button class="btn secondary" onclick="go('documents')">📄 Create Document</button>
   </div>
  </div>`;
 }else{
  html+=`
  <div class="panel">
   <h3>Academic Overview</h3>
   <p>Your attendance and published academic information can be accessed from the Academic menu.</p>
  </div>`;
 }

 document.getElementById("main").innerHTML=html;
}

function stat(icon,label,value){
 return `
 <div class="card">
  <div class="stat-label">${icon} ${label}</div>
  <div class="stat-number">${value}</div>
 </div>`;
}

/* =========================================================
   ACCOUNTS
========================================================= */

function renderAccounts(){
 if(!isAdmin()) return;

 const rows=db.accounts.map(a=>`
 <tr>
  <td>${esc(a.name||"")}</td>
  <td>${esc(a.username)}</td>
  <td>${roleName(a.role)}</td>
  <td>${a.active!==false?'<span class="badge">Active</span>':'<span class="badge red">Inactive</span>'}</td>
  <td>
   <button class="btn small" onclick="editAccount('${a.id}')">Edit</button>
   ${a.id!=="admin-001"?`<button class="btn small danger" onclick="deleteAccount('${a.id}')">Delete</button>`:""}
  </td>
 </tr>`).join("");

 document.getElementById("main").innerHTML=`

function changeRegister(){
 registerState.session=document.getElementById("regSession").value;
 registerState.term=document.getElementById("regTerm").value;
 registerState.className=document.getElementById("regClass").value;
 registerState.section=document.getElementById("regSection").value;
 registerState.month=document.getElementById("regMonth").value;
 registerState.year=document.getElementById("regYear").value;

 renderAttendance();
}

function getRegisterStudents(){
 return db.students
  .filter(s=>
   s.className===registerState.className &&
   s.section===registerState.section
  )
  .sort((a,b)=>(a.name||"").localeCompare(b.name||""));
}

function getMonthDates(year,month){
 const dates=[];
 const d=new Date(year,month-1,1);

 while(d.getMonth()===month-1){
  dates.push(new Date(d));
  d.setDate(d.getDate()+1);
 }

 return dates;
}

function dayName(date){
 return date.toLocaleDateString("en-US",{weekday:"long"});
}

function dateKey(date){
 return [
  date.getFullYear(),
  String(date.getMonth()+1).padStart(2,"0"),
  String(date.getDate()).padStart(2,"0")
 ].join("-");
}

function attendanceKey(studentId,date){
 return `${studentId}_${dateKey(date)}_${registerState.session}_${registerState.term}`;
}

function getAttendance(studentId,date){
 return db.attendance[attendanceKey(studentId,date)] || "";
}

function setAttendance(studentId,date,value){
 if(!isAdmin()&&!isTeacher()){
  alert("Only Administrator and Teacher can record attendance.");
  return;
 }

 const key=attendanceKey(studentId,date);

 if(value){
  db.attendance[key]=value;
 }else{
  delete db.attendance[key];
 }

 saveDB();
 renderAttendance();
}

function registerStudentRow(student,dates){
 let P=0,A=0,L=0,E=0;

 const buttons=dates.map(d=>{
  const value=getAttendance(student.id,d);

  if(value==="P")P++;
  if(value==="A")A++;
  if(value==="L")L++;
  if(value==="E")E++;

  if(!isAdmin()&&!isTeacher()){
   return `<td><b>${value||"—"}</b></td>`;
  }

  return `
  <td>
   <button
    class="att-btn ${value}"
    onclick="cycleAttendance('${student.id}','${dateKey(d)}')">
    ${value||"—"}
   </button>
  </td>`;
 }).join("");

 const total=P+A+L+E;
 const percentage=total?((P/total)*100):0;

 return `
 <tr>
  <td class="student-cell">
   <b>${esc(student.name)}</b><br>
   <small>${esc(student.admissionNo||"")}</small>
  </td>

  ${buttons}

  <td class="total-cell">${total}</td>
  <td class="total-cell">${P}</td>
  <td class="total-cell">${A}</td>
  <td class="total-cell">${L}</td>
  <td class="total-cell">${E}</td>
  <td class="${percentage>=75?"percent-good":percentage>=50?"percent-mid":"percent-low"}">
   ${percentage.toFixed(1)}%
  </td>
 </tr>`;
}

function cycleAttendance(studentId,dateString){
 const date=new Date(dateString+"T00:00:00");
 const current=getAttendance(studentId,date);
 const order=["","P","A","L","E"];
 const next=order[(order.indexOf(current)+1)%order.length];

 setAttendance(studentId,date,next);
}

function markAllRegister(value){
 if(!isAdmin()&&!isTeacher())return;

 const students=getRegisterStudents();
 const dates=getMonthDates(
  Number(registerState.year),
  Number(registerState.month)
 );

 if(!confirm(`Mark all ${students.length} students Present for all ${dates.length} dates in this register?`))return;

 students.forEach(s=>{
  dates.forEach(d=>{
   db.attendance[attendanceKey(s.id,d)]=value;
  });
 });

 saveDB();
 renderAttendance();
}

function clearRegister(){
 if(!confirm("Clear all attendance markings for this register month?"))return;

 const students=getRegisterStudents();
 const dates=getMonthDates(
  Number(registerState.year),
  Number(registerState.month)
 );

 students.forEach(s=>{
  dates.forEach(d=>{
   delete db.attendance[attendanceKey(s.id,d)];
  });
 });

 saveDB();
 renderAttendance();
}

function registerSummaryRow(students,dates){
 let totalP=0,totalA=0,totalL=0,totalE=0;

 students.forEach(s=>{
  dates.forEach(d=>{
   const v=getAttendance(s.id,d);
   if(v==="P")totalP++;
   if(v==="A")totalA++;
   if(v==="L")totalL++;
   if(v==="E")totalE++;
  });
 });

 const total=totalP+totalA+totalL+totalE;

 return `
 <tr class="register-footer">
  <td class="student-cell">CLASS TOTAL</td>
  ${dates.map(()=>"<td>—</td>").join("")}
  <td>${total}</td>
  <td>${totalP}</td>
  <td>${totalA}</td>
  <td>${totalL}</td>
  <td>${totalE}</td>
  <td>${total?((totalP/total)*100).toFixed(1):"0.0"}%</td>
 </tr>`;
}

function registerSummaryCards(students,dates){
 let P=0,A=0,L=0,E=0;

 students.forEach(s=>{
  dates.forEach(d=>{
   const v=getAttendance(s.id,d);
   if(v==="P")P++;
   if(v==="A")A++;
   if(v==="L")L++;
   if(v==="E")E++;
  });
 });

 const total=P+A+L+E;
 const percentage=total?(P/total)*100:0;

 return `
 <div class="cards" style="margin:0">
  ${stat("👨‍🎓","Students",students.length)}
  ${stat("✅","Present",P)}
  ${stat("❌","Absent",A)}
  ${stat("⏰","Late",L)}
 </div>

 <div style="margin-top:15px;padding:15px;background:var(--light);border-radius:10px">
  <b>Overall Class Attendance:</b>
  ${percentage.toFixed(1)}%
  &nbsp; | &nbsp;
  <b>Excused:</b> ${E}
  &nbsp; | &nbsp;
  <b>Recorded Entries:</b> ${total}
 </div>`;
}

function loadResultEntry(){
 const className=document.getElementById("resultClass")?.value;
 const section=document.getElementById("resultSection")?.value;
 const subject=document.getElementById("resultSubject")?.value;

 if(!className||!subject)return;

 const students=db.students.filter(s=>
  s.className===className &&
  s.section===section
 );

 const sessionName=document.getElementById("resultSession")?.value||db.settings.session;
 const term=document.getElementById("resultTerm")?.value||db.settings.term;

 const rows=students.map(s=>{
  const r=findResult(s.id,subject,sessionName,term);

  return `
  <tr>
   <td>${esc(s.name)}</td>
   <td>

     id="ca1_${s.id}" oninput="previewTotal('${s.id}')">

    <input type="number" min="0" max="70" value="${r?.exam??""}"

   <td id="grade_${s.id}">${r?.grade??"F"}</td>

 }).join("");

 document.getElementById("resultEntryTable").innerHTML=`

     <th>CA2 / 15</th>
     <th>Exam / 70</th>
     <th>Total / 100</th>
     <th>Grade</th>
     <th>Status</th>
    </tr>
   </thead>
   <tbody>${rows||emptyRow(7)}</tbody>
  </table>
 </div>

 <div style="margin-top:15px" class="toolbar">
  <button class="btn" onclick="saveResults('draft')">Save Draft</button>
  <button class="btn secondary" onclick="saveResults('submitted')">Submit Results</button>
 </div>`;
}

function previewTotal(studentId){
 const ca1=Number(document.getElementById("ca1_"+studentId)?.value||0);
 const ca2=Number(document.getElementById("ca2_"+studentId)?.value||0);
 const exam=Number(document.getElementById("exam_"+studentId)?.value||0);

 const total=ca1+ca2+exam;
 const grade=getGrade(total);

 document.getElementById("total_"+studentId).textContent=total;
 document.getElementById("grade_"+studentId).textContent=grade;
}

function getGrade(total){
 if(total>=75)return"A";
 if(total>=65)return"B";
 if(total>=55)return"C";
 if(total>=45)return"D";
 if(total>=40)return"E";
 return"F";
}

function findResult(studentId,subject,sessionName,term){
 return db.results.find(r=>
  r.studentId===studentId &&
  r.subject===subject &&
  r.session===sessionName &&
  r.term===term
 );
}

function saveResults(status){
 if(!isAdmin()&&!isTeacher())return;

 const className=document.getElementById("resultClass").value;
 const section=document.getElementById("resultSection").value;
 const subject=document.getElementById("resultSubject").value;
 const sessionName=document.getElementById("resultSession").value;
 const term=document.getElementById("resultTerm").value;

 const students=db.students.filter(s=>
  s.className===className&&s.section===section
 );

 students.forEach(s=>{
  const ca1=Number(document.getElementById("ca1_"+s.id)?.value||0);
  const ca2=Number(document.getElementById("ca2_"+s.id)?.value||0);
  const exam=Number(document.getElementById("exam_"+s.id)?.value||0);

  if(ca1>15||ca2>15||exam>70){
   alert(`Invalid mark entered for ${s.name}.`);
   throw new Error("Invalid mark");
  }

  const total=ca1+ca2+exam;
  let r=findResult(s.id,subject,sessionName,term);

  if(!r){
   r={
    id:uid("result"),
    studentId:s.id,
    className,
    section,
    subject,
    session:sessionName,
    term,
    createdBy:currentUser().id,
    history:[]
   };
   db.results.push(r);
  }

  r.ca1=ca1;
  r.ca2=ca2;
  r.exam=exam;
  r.total=total;
  r.grade=getGrade(total);
  r.status=status;

  r.history=r.history||[];
  r.history.push({
   action:status,
   by:currentUser().name||currentUser().username,
   date:new Date().toISOString()
  });
 });

 saveDB();

 alert(status==="submitted"?"Results submitted for review.":"Results saved as draft.");
 loadResultEntry();
}

function resultStatus(status){
 if(status==="published")return'<span class="badge">Published</span>';
 if(status==="exam-approved")return'<span class="badge">Exam Approved</span>';
 if(status==="hod-approved")return'<span class="badge">HOD Approved</span>';
 if(status==="submitted")return'<span class="badge yellow">Submitted</span>';
 if(status==="rejected")return'<span class="badge red">Rejected</span>';
 return'<span class="badge blue">Draft</span>';
}

function renderApproval(){

 if(isTeacher()){
  const assigned=db.hodAssignments
   .filter(x=>x.teacherId===currentUser().id)
   .map(x=>x.subject);

  docs=docs.filter(d=>assigned.includes(d.subject));
 }

 const rows=docs.map(d=>`
 <tr>
  <td>${esc(d.title)}</td>
  <td>${esc(d.subject)}</td>
  <td>${esc(d.type)}</td>
  <td>${esc(db.accounts.find(a=>a.id===d.createdBy)?.name||"")}</td>
  <td>
   <button class="btn small" onclick="approveDoc('${d.id}')">Approve</button>
   <button class="btn small danger" onclick="rejectDoc('${d.id}')">Reject</button>
  </td>
 </tr>`).join("");

 document.getElementById("main").innerHTML=`

  <div><h2>Approval Centre</h2><p>Review submitted academic documents.</p></div>
 </div>

 <div class="panel">
  <div class="table-wrap">
   <table>
    <thead><tr>
     <th>Document</th><th>Subject</th><th>Type</th><th>Teacher</th><th>Action</th>
    </tr></thead>
    <tbody>${rows||emptyRow(5)}</tbody>
   </table>
  </div>
 </div>`;
}

function approveDoc(id){
 const d=db.documents.find(x=>x.id===id);
 if(!d)return;

 if(!isAdmin()){
  const allowed=db.hodAssignments.some(x=>
   x.teacherId===currentUser().id &&
   x.subject===d.subject
  );

  if(!allowed){
   alert("You are not the HOD for this subject.");
   return;
  }
 }

 const comment=prompt("Approval comment (optional):","Approved");

 d.status="approved";
 d.comment=comment||"Approved";
 d.history=d.history||[];
 d.history.push({
  action:"approved",
  by:currentUser().name||currentUser().username,
  date:new Date().toISOString(),
  comment:d.comment
 });

 saveDB();
 renderApproval();
}

function rejectDoc(id){
 const d=db.documents.find(x=>x.id===id);
 if(!d)return;

 if(!isAdmin()){
  const allowed=db.hodAssignments.some(x=>
   x.teacherId===currentUser().id &&
   x.subject===d.subject
  );

  if(!allowed){
   alert("You are not the HOD for this subject.");
   return;
  }
 }

 const comment=prompt("Reason for rejection:");

 if(comment===null)return;

 d.status="rejected";
 d.comment=comment;
 d.history=d.history||[];
 d.history.push({
  action:"rejected",

function assistantReply(){
 const input=document.getElementById("assistantInput");
 const q=input.value.trim();

 if(!q)return;

 const box=document.getElementById("chatBox");

 box.innerHTML+=`
 <div style="margin-top:12px"><b>You:</b> ${esc(q)}</div>`;

 let answer="";

 const lower=q.toLowerCase();

 if(lower.includes("lesson plan")){
  answer=`Lesson Plan structure: Topic, Class, Date, Duration, Entry Behaviour, Objectives, Materials, References, Set Induction, Presentation, Teacher Activities, Learners Activities, Evaluation, Conclusion and Assignment.`;
 }else if(lower.includes("lesson note")){
  answer=`Lesson Note structure: Topic, Previous Knowledge, Objectives, Instructional Materials, References, Introduction, Presentation, Teacher Activities, Learners Activities, Evaluation, Summary, Conclusion and Assignment.`;
 }else if(lower.includes("scheme")){
  answer=`A professional scheme should contain Week, Topic, Sub-topic, Objectives, Content, Activities, Instructional Materials, References and Evaluation.`;
 }else{
  answer=`I can help structure lesson plans, lesson notes, schemes of work, classroom activities and assessment questions.`;
 }

 box.innerHTML+=`
 <div style="margin-top:12px;background:var(--light);padding:10px;border-radius:8px">
  <b>Assistant:</b> ${esc(answer)}
 </div>`;

 input.value="";
 box.scrollTop=box.scrollHeight;
}

/* =========================================================
   STUDENT / PARENT ATTENDANCE VIEW
========================================================= */

function renderAttendanceForStudent(){
 const s=db.students.find(x=>x.accountId===currentUser().id);
 return renderAttendanceSummaryForStudents([s].filter(Boolean));
}

function renderAttendanceSummaryForStudents(students){
 let html=`
 <div class="page-title">
  <div><h2>My Attendance</h2><p>Attendance is automatically calculated from the school register.</p></div>
 </div>`;

 students.forEach(s=>{
  let P=0,A=0,L=0,E=0;

  Object.keys(db.attendance).forEach(key=>{
   if(key.startsWith(s.id+"_")){
    const v=db.attendance[key];
    if(v==="P")P++;
    if(v==="A")A++;
    if(v==="L")L++;
    if(v==="E")E++;
   }
  });

  const total=P+A+L+E;
  const pct=total?(P/total)*100:0;

  html+=`
  <div class="panel">
   <h3>${esc(s.name)} — ${esc(s.className)} ${esc(s.section)}</h3>

   <div class="cards">
    ${stat("📅","Total Recorded",total)}
    ${stat("✅","Present",P)}
    ${stat("❌","Absent",A)}
    ${stat("📊","Attendance",pct.toFixed(1)+"%")}
   </div>
  </div>`;
 });

 document.getElementById("main").innerHTML=html;
}

/* Override attendance page for student/parent */
const originalRenderAttendance=renderAttendance;

function renderAttendancePage(){
 if(isStudent()){
  renderAttendanceForStudent();
  return;
 }

 if(isParent()){
  const p=db.parents.find(x=>x.accountId===currentUser().id);
  const children=db.students.filter(s=>(p?.children||[]).includes(s.id));
  renderAttendanceSummaryForStudents(children);
  return;
 }

 originalRenderAttendance();
}
