<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Global Kids Academy Sokoto | Academic Management System</title>

<style>
:root{
  --primary:#0f766e;
  --primary-dark:#115e59;
  --primary-light:#ccfbf1;
  --secondary:#16a34a;
  --bg:#f4f7f7;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --danger:#dc2626;
  --warning:#d97706;
  --success:#15803d;
  --info:#2563eb;
  --shadow:0 8px 30px rgba(15,23,42,.07);
  --radius:14px;
  --sidebar:270px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{overflow-x:hidden}

button,input,select,textarea{
  font:inherit;
}

button{cursor:pointer}

.hidden{display:none!important}

.app{
  min-height:100vh;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:var(--sidebar);
  background:#ffffff;
  border-right:1px solid var(--border);
  z-index:1000;
  display:flex;
  flex-direction:column;
  transition:.25s ease;
}

.brand{
  height:78px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:17px;
  box-shadow:0 6px 16px rgba(15,118,110,.25);
}

.brand-text{
  min-width:0;
}

.brand-text strong{
  display:block;
  font-size:14px;
  line-height:1.2;
}

.brand-text span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.nav{
  flex:1;
  overflow-y:auto;
  padding:12px 10px 18px;
}

.nav-section{
  padding:12px 10px 6px;
  color:#94a3b8;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.09em;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#475569;
  min-height:42px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 12px;
  margin:2px 0;
  text-align:left;
  font-size:13px;
  transition:.18s ease;
}

.nav-item:hover{
  background:#f1f5f9;
  color:var(--primary-dark);
}

.nav-item.active{
  background:var(--primary-light);
  color:var(--primary-dark);
  font-weight:750;
}

.nav-icon{
  width:20px;
  min-width:20px;
  text-align:center;
  font-size:16px;
}

.sidebar-footer{
  border-top:1px solid var(--border);
  padding:12px;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:10px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
}

.user-mini div:last-child{
  min-width:0;
}

.user-mini strong{
  display:block;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-mini span{
  color:var(--muted);
  font-size:10px;
}

/* ================= MAIN ================= */

.main{
  margin-left:var(--sidebar);
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:900;
  height:70px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.top-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.page-title{
  font-size:18px;
  font-weight:800;
}

.page-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.menu-btn{
  display:none;
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:#475569;
}

.content{
  padding:24px;
  max-width:1700px;
  margin:auto;
}

/* ================= COMPONENTS ================= */

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card-header{
  padding:17px 19px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.card-title{
  font-size:14px;
  font-weight:800;
}

.card-subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.card-body{
  padding:19px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  margin-bottom:20px;
}

.stat{
  padding:18px;
  position:relative;
  overflow:hidden;
}

.stat::after{
  content:"";
  position:absolute;
  width:80px;
  height:80px;
  right:-25px;
  bottom:-30px;
  border-radius:50%;
  background:var(--primary-light);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  z-index:2;
}

.stat-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--primary-light);
  color:var(--primary-dark);
  font-size:18px;
}

.stat-value{
  font-size:26px;
  font-weight:850;
  margin-top:13px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
}

.stat-note{
  font-size:10px;
  color:var(--success);
  margin-top:5px;
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  align-items:end;
  margin-bottom:16px;
}

.field{
  flex:1;
  min-width:150px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:#475569;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  border:1px solid #d8e0e8;
  border-radius:9px;
  background:#fff;
  color:var(--text);
  padding:10px 11px;
  outline:none;
  transition:.15s;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(15,118,110,.09);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.btn{
  border:1px solid transparent;
  border-radius:9px;
  padding:10px 13px;
  min-height:39px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:700;
  font-size:12px;
  transition:.15s;
}

.btn:hover{transform:translateY(-1px)}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{background:var(--primary-dark)}

.btn-success{
  background:#15803d;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-warning{
  background:#d97706;
  color:#fff;
}

.btn-light{
  background:#fff;
  color:#475569;
  border-color:var(--border);
}

.btn-info{
  background:#2563eb;
  color:#fff;
}

.btn-sm{
  padding:7px 9px;
  min-height:32px;
  font-size:11px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.badge-draft{background:#f1f5f9;color:#475569}
.badge-submitted{background:#dbeafe;color:#1d4ed8}
.badge-approved{background:#dcfce7;color:#166534}
.badge-published{background:#ccfbf1;color:#115e59}
.badge-rejected{background:#fee2e2;color:#991b1b}
.badge-pending{background:#fef3c7;color:#92400e}

.table-wrap{
  overflow:auto;
  border:1px solid var(--border);
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:10px;
  text-align:left;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

td{
  padding:10px;
  font-size:11px;
  border-bottom:1px solid #edf1f5;
  vertical-align:middle;
}

tr:last-child td{border-bottom:0}

.empty{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:35px;
  margin-bottom:8px;
}

.alert{
  padding:12px 14px;
  border-radius:10px;
  font-size:11px;
  margin-bottom:14px;
}

.alert-info{
  background:#eff6ff;
  color:#1e40af;
  border:1px solid #bfdbfe;
}

.alert-warning{
  background:#fffbeb;
  color:#92400e;
  border:1px solid #fde68a;
}

.alert-success{
  background:#f0fdf4;
  color:#166534;
  border:1px solid #bbf7d0;
}

.section-space{margin-top:18px}

/* ================= LOGIN ================= */

.login-page{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(20,184,166,.18),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(34,197,94,.13),transparent 35%),
    #f4f8f7;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:min(440px,100%);
}

.login-brand{
  text-align:center;
  margin-bottom:20px;
}

.login-logo{
  width:70px;
  height:70px;
  margin:0 auto 12px;
  border-radius:20px;
  display:grid;
  place-items:center;
  color:white;
  font-size:25px;
  font-weight:900;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  box-shadow:0 15px 35px rgba(15,118,110,.25);
}

.login-brand h1{
  font-size:21px;
  margin:0;
}

.login-brand p{
  color:var(--muted);
  font-size:12px;
  margin:6px 0 0;
}

.login-card{
  padding:25px;
}

.login-card h2{
  margin:0 0 5px;
  font-size:18px;
}

.login-card .intro{
  color:var(--muted);
  font-size:11px;
  margin-bottom:20px;
}

.login-form .field{
  margin-bottom:14px;
}

.login-footer{
  text-align:center;
  color:#94a3b8;
  font-size:10px;
  margin-top:14px;
}

/* ================= DOCUMENT CARDS ================= */

.doc-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}

.doc-card{
  padding:17px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
}

.doc-card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.doc-type{
  width:38px;
  height:38px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--primary-light);
  color:var(--primary-dark);
}

.doc-card h3{
  font-size:13px;
  margin:13px 0 6px;
}

.doc-card p{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
  min-height:34px;
}

.doc-meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:10px 0;
}

/* ================= REGISTER ================= */

.register-wrap{
  overflow:auto;
  border:1px solid #cbd5e1;
  border-radius:8px;
}

.register{
  border-collapse:collapse;
  min-width:1650px;
}

.register th,
.register td{
  border:1px solid #cbd5e1;
  text-align:center;
  padding:6px;
  font-size:10px;
}

.register th{
  background:#e2e8f0;
}

.register .student-name{
  min-width:190px;
  text-align:left;
  position:sticky;
  left:0;
  background:white;
  z-index:2;
}

.register .student-no{
  min-width:45px;
}

.att-btn{
  border:0;
  width:25px;
  height:25px;
  border-radius:5px;
  font-size:9px;
  font-weight:900;
}

.att-p{
  background:#dcfce7;
  color:#166534;
}

.att-a{
  background:#fee2e2;
  color:#991b1b;
}

.att-empty{
  background:#f8fafc;
  color:#94a3b8;
}

.register-title{
  text-align:center;
  margin:0 0 12px;
}

.register-title h2{
  margin:0;
  font-size:16px;
  text-transform:uppercase;
}

.register-title p{
  margin:3px 0;
  font-size:10px;
}

/* ================= ASSISTANT ================= */

.assistant{
  display:flex;
  flex-direction:column;
  height:650px;
}

.chat{
  flex:1;
  overflow:auto;
  padding:18px;
  background:#f8fafc;
}

.message{
  max-width:82%;
  margin-bottom:12px;
  padding:11px 13px;
  border-radius:12px;
  font-size:12px;
  line-height:1.55;
  white-space:pre-wrap;
}

.message.bot{
  background:#fff;
  border:1px solid var(--border);
}

.message.user{
  margin-left:auto;
  background:var(--primary);
  color:#fff;
}

.chat-input{
  padding:12px;
  border-top:1px solid var(--border);
  display:flex;
  gap:8px;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.48);
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-box{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:15px;
  box-shadow:0 25px 80px rgba(0,0,0,.2);
}

.modal-head{
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{
  margin:0;
  font-size:15px;
}

.modal-body{
  padding:18px;
}

.modal-foot{
  padding:13px 18px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:5000;
  max-width:350px;
  background:#0f172a;
  color:#fff;
  border-radius:10px;
  padding:12px 15px;
  font-size:11px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  animation:toastIn .2s ease;
}

@keyframes toastIn{
  from{transform:translateY(15px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .doc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:850px){
  :root{--sidebar:270px}

  .sidebar{
    transform:translateX(-100%);
    box-shadow:20px 0 50px rgba(0,0,0,.15);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 14px;
  }

  .content{
    padding:16px;
  }

  .grid-2,
  .grid-3{
    grid-template-columns:1fr;
  }

  .doc-grid{
    grid-template-columns:1fr;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.35);
    z-index:950;
  }
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:13px;
  }

  .stat-value{
    font-size:21px;
  }

  .content{
    padding:12px;
  }

  .page-title{
    font-size:15px;
  }

  .page-subtitle{
    display:none;
  }

  .top-actions .icon-btn{
    display:none;
  }

  .card-body{
    padding:13px;
  }

  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .toolbar .field{
    min-width:0;
  }

  .toolbar .btn{
    width:100%;
  }
}

/* ================= PRINT ================= */

@media print{
  body{
    background:#fff!important;
  }

  .sidebar,
  .topbar,
  .no-print,
  .toolbar,
  .btn,
  .modal,
  .toast{
    display:none!important;
  }

  .main{
    margin:0!important;
  }

  .content{
    padding:0!important;
    max-width:none!important;
  }

  .card{
    border:0!important;
    box-shadow:none!important;
  }

  .card-header{
    display:none!important;
  }

  .register-wrap{
    overflow:visible!important;
    border:0!important;
  }

  .register{
    min-width:0!important;
  }

  @page{
    size:A4 landscape;
    margin:8mm;
  }
}

/* RTL */
.rtl{
  direction:rtl;
  text-align:right;
}
</style>
</head>

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw){
      localStorage.setItem(DB_KEY,JSON.stringify(DEFAULT_DB));
      return clone(DEFAULT_DB);
    }

    const parsed = JSON.parse(raw);

    if(!parsed.schemaVersion){
      throw new Error("Invalid database");
    }

    return {
      ...clone(DEFAULT_DB),
      ...parsed,
      settings:{...clone(DEFAULT_DB.settings),...(parsed.settings||{})},
      users:Array.isArray(parsed.users)?parsed.users:[],
      students:Array.isArray(parsed.students)?parsed.students:[],
      classes:Array.isArray(parsed.classes)?parsed.classes:[],
      subjects:Array.isArray(parsed.subjects)?parsed.subjects:[],
      attendance:Array.isArray(parsed.attendance)?parsed.attendance:[],
      results:Array.isArray(parsed.results)?parsed.results:[],
      documents:Array.isArray(parsed.documents)?parsed.documents:[],
      audit:Array.isArray(parsed.audit)?parsed.audit:[]
    };
  }catch(e){
    localStorage.setItem(DB_KEY,JSON.stringify(DEFAULT_DB));
    return clone(DEFAULT_DB);
  }
}

function saveDB(){
  db.schemaVersion = SCHEMA_VERSION;

  try{
    localStorage.setItem(DB_KEY,JSON.stringify(db));
    localStorage.setItem(
      RECOVERY_KEY,
      JSON.stringify({
        savedAt:new Date().toISOString(),
        database:db
      })
    );
  }catch(e){
    toast("Could not save data. Browser storage may be full.","danger");
  }
}

function uid(prefix){
  const n = Date.now().toString(36).toUpperCase();
  return prefix+"-"+n;
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date=new Date()){
  return new Intl.DateTimeFormat("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).format(new Date(date));
}

function formatDateTime(date=new Date()){
  return new Intl.DateTimeFormat("en-GB",{
    dateStyle:"medium",
    timeStyle:"short"
  }).format(new Date(date));
}

function toast(message,type="info"){
  const old=document.querySelector(".toast");
  if(old)old.remove();

  const el=document.createElement("div");
  el.className="toast";
  el.textContent=message;
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),2800);
}

function audit(action,details=""){
  if(!currentUser)return;

  db.audit.unshift({
    id:uid("AUD"),
    date:new Date().toISOString(),
    user:currentUser.username,
    role:currentUser.role,
    action,
    details
  });

  if(db.audit.length>1000){
    db.audit=db.audit.slice(0,1000);
  }

  saveDB();
}

function hasRole(...roles){
  return currentUser && roles.includes(currentUser.role);
}

      !search ||
      u.name.toLowerCase().includes(search) ||
      u.username.toLowerCase().includes(search);

    const matchRole=!role||u.role===role;

    return matchSearch&&matchRole;
  });

  if(!users.length){
    return `<tr><td colspan="6"><div class="empty">No users found.</div></td></tr>`;
  }

  return users.map(u=>`
    <tr>
      <td>

function saveUser(e,id){
  e.preventDefault();

  const name=document.getElementById("uName").value.trim();
  const username=document.getElementById("uUsername").value.trim();
  const password=document.getElementById("uPassword").value;
  const role=document.getElementById("uRole").value;

  if(!name||!username){
    toast("Name and username are required.","danger");
    return;
  }

  const duplicate=db.users.find(u=>u.username===username&&u.id!==id);

  if(duplicate){
    toast("Username already exists.","danger");
    return;
  }

  let user;

  if(id){
    user=db.users.find(u=>u.id===id);
  }else{
    user={
      id:uid("USR"),
      active:true
    };
    db.users.push(user);
  }

  user.name=name;
  user.username=username;
  user.role=role;

  if(password)user.password=password;

  if(!id&&!password){
    toast("Password is required for a new user.","danger");
    if(!id)db.users=db.users.filter(x=>x.id!==user.id);
    return;
  }

  if(role==="Teacher"){
    user.subjects=(document.getElementById("uSubjects")?.value||"")
      .split(",").map(x=>x.trim()).filter(Boolean);

    user.classes=(document.getElementById("uClasses")?.value||"")
      .split(",").map(x=>x.trim()).filter(Boolean);

    user.assignment=document.getElementById("uAssignment")?.value||"";
  }

  if(role==="Student"){
    user.admissionNo=document.getElementById("uAdmission").value.trim();
    user.className=document.getElementById("uClass").value.trim();
    user.arm=document.getElementById("uArm").value.trim();

    syncStudentFromUser(user);
  }

  if(role==="Parent"){
    user.studentAdmissionNo=document.getElementById("uStudentAdmission").value.trim();
  }

  saveDB();
  audit(id?"Update User":"Create User",`${name} (${role})`);
  closeModal();
  renderApp();
  navigate("users");
  toast("User saved successfully.","success");
}

function syncStudentFromUser(user){
  let student=db.students.find(s=>s.admissionNo===user.admissionNo);

  if(!student){
    student={
      id:uid("STU"),
      admissionNo:user.admissionNo,
      name:user.name,
      gender:"",
      className:user.className,
      arm:user.arm,
      parentName:"",
      parentPhone:""
    };

    db.students.push(student);
  }else{
    student.name=user.name;
    student.className=user.className;
    student.arm=user.arm;
  }
}

function attendanceStudentsRows(days){
  const students=db.students.filter(s=>
    s.className===attendanceState.className &&
    s.arm===attendanceState.arm
  );

  if(!students.length){
    return `
      <tr>
        <td colspan="${days+7}">
          <div class="empty">
            No students are registered in this class and arm.
          </div>
        </td>
      </tr>
    `;
  }

  return students.map((student,index)=>{

    const stats=getAttendanceStats(student.id,days);

    return `
      <tr>
        <td>${index+1}</td>

        <td>${escapeHTML(student.admissionNo)}</td>

        <td class="student-name">
          <strong>${escapeHTML(student.name)}</strong>
        </td>

        ${Array.from({length:days},(_,i)=>`
          <td>
            ${attendanceButton(student.id,i+1)}
          </td>
        `).join("")}

        <td><strong>${stats.present}</strong></td>
        <td><strong>${stats.absent}</strong></td>
        <td><strong>${stats.percent}%</strong></td>
        <td>${escapeHTML(stats.remark)}</td>
      </tr>
    `;
  }).join("");
}

function attendanceButton(studentId,day){
  const key=attendanceKey(studentId,day);
  const rec=db.attendance.find(a=>a.key===key);

  const value=rec?.[attendanceState.mode]||"";

  return `
    <button class="att-btn ${
      value==="P"?"att-p":
      value==="A"?"att-a":"att-empty"
    }"
      onclick="cycleAttendance('${studentId}',${day})">
      ${value||"—"}
    </button>
  `;
}

function attendanceKey(studentId,day){
  return [
    attendanceState.session,
    attendanceState.term,
    attendanceState.className,
    attendanceState.arm,
    attendanceState.year,
    attendanceState.month,
    studentId,
    day
  ].join("|");
}

function cycleAttendance(studentId,day){
  if(!canAcademic())return;

  let rec=db.attendance.find(a=>
    a.key===attendanceKey(studentId,day)
  );

  if(!rec){
    rec={
      key:attendanceKey(studentId,day),
      studentId,
      session:attendanceState.session,
      term:attendanceState.term,
      className:attendanceState.className,
      arm:attendanceState.arm,
      year:attendanceState.year,
      month:attendanceState.month,
      day
    };

    db.attendance.push(rec);
  }

  const current=rec[attendanceState.mode]||"";

  rec[attendanceState.mode]=
    current===""?"P":
    current==="P"?"A":"";

  saveDB();

  renderCurrentPage();
}

function getAttendanceStats(studentId,days){
  let present=0;
  let absent=0;

  for(let d=1;d<=days;d++){
    const rec=db.attendance.find(a=>
      a.key===attendanceKey(studentId,d)
    );

    const value=rec?.[attendanceState.mode]||"";

    if(value==="P")present++;
    if(value==="A")absent++;
  }

  const marked=present+absent;
  const percent=marked?Math.round((present/days)*100):0;

  let remark="Not marked";

  if(marked){
    remark=percent>=75?"Satisfactory":"Needs Attention";
  }

  return {present,absent,percent,remark};
}

function updateAttendanceState(){
  attendanceState.session=document.getElementById("attSession").value;
  attendanceState.term=document.getElementById("attTerm").value;
  attendanceState.className=document.getElementById("attClass").value;
  attendanceState.arm=document.getElementById("attArm").value;
  attendanceState.month=Number(document.getElementById("attMonth").value);
  attendanceState.year=Number(document.getElementById("attYear").value);
  attendanceState.mode=document.getElementById("attMode").value;

  renderCurrentPage();
}

function changeAttendanceClass(){
  attendanceState.className=document.getElementById("attClass").value;

  const first=db.classes.find(c=>c.name===attendanceState.className);
  attendanceState.arm=first?.arm||"A";

  renderCurrentPage();
}

function saveAttendance(){
  saveDB();
  audit("Save Attendance Register",
    `${attendanceState.className} ${attendanceState.arm}`);
  toast("Attendance register saved.","success");
}

function resultsRows(){
  const search=(document.getElementById("resultSearch")?.value||"").toLowerCase();
  const classFilter=document.getElementById("resultClassFilter")?.value||"";

  const rows=db.results.filter(r=>{
    const student=db.students.find(s=>s.id===r.studentId);

    if(!student)return false;

    const matchSearch=
      !search ||
      student.name.toLowerCase().includes(search) ||
      student.admissionNo.toLowerCase().includes(search) ||
      r.subject.toLowerCase().includes(search);

    const matchClass=!classFilter||student.className===classFilter;

    return matchSearch&&matchClass;
  });

  if(!rows.length){
    return `<tr><td colspan="10"><div class="empty">No result records found.</div></td></tr>`;
  }

  return rows.map(r=>{
    const s=db.students.find(x=>x.id===r.studentId);

    return `
      <tr>
        <td>
          <strong>${escapeHTML(s?.name||"Unknown")}</strong><br>
          <span style="font-size:9px;color:var(--muted)">
            ${escapeHTML(s?.admissionNo||"")}
          </span>
        </td>

        <td>${escapeHTML(`${s?.className||""} ${s?.arm||""}`)}</td>
        <td>${escapeHTML(r.subject)}</td>
        <td>${r.ca1}</td>
        <td>${r.ca2}</td>
        <td>${r.exam}</td>
        <td><strong>${r.total}</strong></td>
        <td><span class="badge badge-approved">${r.grade}</span></td>
        <td>${statusBadge(r.status)}</td>

        <td>
          <button class="btn btn-sm btn-light"
            onclick="editResult('${r.id}')">Edit</button>

          ${resultActionButton(r)}

          <button class="btn btn-sm btn-danger"
            onclick="deleteResult('${r.id}')">Delete</button>
        </td>
      </tr>
    `;
  }).join("");
}

function resultActionButton(r){
  if(r.status==="Draft" && canAcademic()){
    return `
      <button class="btn btn-sm btn-info"
        onclick="submitResult('${r.id}')">Submit</button>
    `;
  }

  if(r.status==="Submitted" && isHODForSubject(r.subject)){
    return `
      <button class="btn btn-sm btn-success"
        onclick="approveResultHOD('${r.id}')">HOD Approve</button>
    `;
  }

  if(r.status==="HOD Approved" && isExamOfficer()){
    return `
      <button class="btn btn-sm btn-success"
        onclick="approveResultExam('${r.id}')">Exam Approve</button>
    `;
  }

  if(r.status==="Exam Officer Approved" && hasRole("Admin")){
    return `
      <button class="btn btn-sm btn-primary"
        onclick="publishResult('${r.id}')">Publish</button>
    `;
  }

  return "";
}

function statusBadge(status){
  let cls="badge-draft";

  if(status==="Submitted")cls="badge-submitted";
  if(status==="HOD Approved")cls="badge-approved";
  if(status==="Exam Officer Approved")cls="badge-approved";
  if(status==="Published")cls="badge-published";
  if(status==="Rejected")cls="badge-rejected";

  return `<span class="badge ${cls}">${escapeHTML(status)}</span>`;
}

function saveResult(e,id){
  e.preventDefault();

  const studentId=document.getElementById("rStudent").value;
  const subject=document.getElementById("rSubject").value;
  const ca1=Number(document.getElementById("rCA1").value);
  const ca2=Number(document.getElementById("rCA2").value);
  const exam=Number(document.getElementById("rExam").value);

  if(ca1<0||ca1>15||ca2<0||ca2>15||exam<0||exam>70){
    toast("Check the maximum marks: CA1 15, CA2 15, Exam 70.","danger");
    return;
  }

  const total=ca1+ca2+exam;
  const gradeInfo=grade(total);

  let r;

  if(id){
    r=db.results.find(x=>x.id===id);

    if(r.status!=="Draft" && !hasRole("Admin")){
      toast("Only draft results can be edited by a teacher.","danger");
      return;
    }
  }else{
    r={
      id:uid("RES"),
      session:db.settings.session,
      term:db.settings.term,
      status:"Draft",
      createdBy:currentUser.id
    };

    db.results.push(r);
  }

  r.studentId=studentId;
  r.subject=subject;
  r.ca1=ca1;
  r.ca2=ca2;
  r.exam=exam;
  r.total=total;
  r.grade=gradeInfo.grade;
  r.remark=gradeInfo.remark;
  r.updatedAt=new Date().toISOString();

  saveDB();
  audit(id?"Update Result":"Create Result",`${subject} - ${total}`);
  closeModal();
  navigate("results");
  toast("Result saved as Draft.","success");
}

function grade(total){
  if(total>=75)return {grade:"A",remark:"Excellent"};
  if(total>=65)return {grade:"B",remark:"Very Good"};
  if(total>=55)return {grade:"C",remark:"Good"};
  if(total>=45)return {grade:"D",remark:"Fair"};
  if(total>=40)return {grade:"E",remark:"Pass"};
  return {grade:"F",remark:"Needs Improvement"};
}

function editResult(id){
  openResultModal(id);
}

function deleteResult(id){
  if(!confirm("Delete this result?"))return;

  db.results=db.results.filter(r=>r.id!==id);
  saveDB();
  audit("Delete Result",id);
  navigate("results");
}

function submitResult(id){
  const r=db.results.find(x=>x.id===id);
  if(!r)return;

  r.status="Submitted";
  r.submittedAt=new Date().toISOString();

  saveDB();
  audit("Submit Result",r.subject);
  navigate("results");
  toast("Result submitted for HOD review.","success");
}

function isHODForSubject(subject){
  if(hasRole("Admin"))return true;

  if(!currentUser||currentUser.role!=="Teacher")return false;

  const s=db.subjects.find(x=>x.name===subject);

  return s?.hod===currentUser.id ||
    currentUser.assignment==="HOD";
}

function isExamOfficer(){
  return hasRole("Admin") ||
    (currentUser?.role==="Teacher" &&
     currentUser.assignment==="Exam Officer");
}

function approveResultHOD(id){
  const r=db.results.find(x=>x.id===id);

  if(!r||!isHODForSubject(r.subject)){
    toast("You are not the HOD assigned to this subject.","danger");
    return;
  }

  r.status="HOD Approved";
  r.hodApprovedBy=currentUser.id;
  r.hodApprovedAt=new Date().toISOString();

  saveDB();
  audit("HOD Approve Result",r.subject);
  navigate("results");
  toast("Result approved by HOD.","success");
}

function approveResultExam(id){
  const r=db.results.find(x=>x.id===id);

  if(!r||!isExamOfficer()){
    toast("Only the Examination Officer can approve this stage.","danger");
    return;
  }

  r.status="Exam Officer Approved";
  r.examApprovedBy=currentUser.id;
  r.examApprovedAt=new Date().toISOString();

  saveDB();
  audit("Examination Officer Approve Result",r.subject);
  navigate("results");
  toast("Result approved by Examination Officer.","success");
}

function publishResult(id){
  if(!hasRole("Admin")){
    toast("Only Admin can publish final results.","danger");
    return;
  }

  const r=db.results.find(x=>x.id===id);

  if(!r||r.status!=="Exam Officer Approved"){
    toast("Result must receive Examination Officer approval first.","danger");
    return;
  }

  r.status="Published";
  r.publishedBy=currentUser.id;
  r.publishedAt=new Date().toISOString();

  saveDB();
  audit("Publish Result",r.subject);
  navigate("results");
  toast("Result published.","success");
}

function broadsheetSummary(){
  const published=db.results.filter(r=>r.status==="Published");

  if(!published.length){
    return `<div class="empty">No published results available for broadsheet statistics.</div>`;
  }

  const average=published.reduce((sum,r)=>sum+r.total,0)/published.length;
  const passes=published.filter(r=>r.total>=40).length;
  const fails=published.filter(r=>r.total<40).length;

  return `
    <div class="grid-3">

      <div>
        <div class="stat-label">PUBLISHED RECORDS</div>
        <strong style="font-size:22px">${published.length}</strong>
      </div>

        <strong style="font-size:22px">${average.toFixed(1)}</strong>
      </div>

      <div>
        <div class="stat-label">PASS / FAIL</div>
        <strong style="font-size:22px">${passes} / ${fails}</strong>

}

function saveDocument(e,id){
  e.preventDefault();

  const data={
    type:document.getElementById("dType").value,
    language:document.getElementById("dLanguage").value,
    title:document.getElementById("dTitle").value.trim(),
    subject:document.getElementById("dSubject").value.trim(),
    className:document.getElementById("dClass").value.trim(),
    week:document.getElementById("dWeek").value.trim(),
    topic:document.getElementById("dTopic").value.trim(),
    subtopic:document.getElementById("dSubtopic").value.trim(),
    content:document.getElementById("dContent").value
  };

  let d;

  if(id){
    d=db.documents.find(x=>x.id===id);

    if(d.status==="Approved"&&!hasRole("Admin")){
      toast("Approved documents should not be edited directly.","danger");
      return;
    }
  }else{
    d={
      id:uid("DOC"),
      status:"Draft",
      createdAt:new Date().toISOString(),
      createdBy:currentUser.id
    };

    db.documents.unshift(d);
  }

  Object.assign(d,data);
  d.updatedAt=new Date().toISOString();

  saveDB();
  audit(id?"Update Document":"Create Document",data.title);
  closeModal();
  navigate("documents");
  toast("Document saved as Draft.","success");
}

function canApproveDocument(d){
  if(hasRole("Admin"))return true;

  if(currentUser?.role!=="Teacher")return false;

  const subject=db.subjects.find(s=>s.name===d.subject);

  return subject?.hod===currentUser.id ||
    currentUser.assignment==="HOD" ||
    currentUser.assignment==="Exam Officer";
}

function approveDocument(id){
  const d=db.documents.find(x=>x.id===id);

  if(!d||!canApproveDocument(d)){
    toast("You do not have approval permission.","danger");
    return;
  }

  d.status="Approved";
  d.approvedBy=currentUser.id;
  d.approvedAt=new Date().toISOString();

  saveDB();
  audit("Approve Document",d.title);
  navigate("approval");
  toast("Document approved and moved to Approved Work Archive.","success");
}

function rejectDocument(id){
  const d=db.documents.find(x=>x.id===id);

  if(!d||!canApproveDocument(d))return;

  const comment=prompt("Enter rejection reason:");

  if(comment===null)return;

  d.status="Rejected";
  d.rejectionComment=comment;
  d.rejectedBy=currentUser.id;
  d.rejectedAt=new Date().toISOString();

  saveDB();
  audit("Reject Document",`${d.title}: ${comment}`);
  navigate("approval");
  toast("Document rejected with comment.","success");
}

function archiveRows(){

  const rows=db.documents.filter(d=>
    d.status==="Approved" &&
    (
      !search ||
      d.title.toLowerCase().includes(search) ||
      d.subject.toLowerCase().includes(search) ||
      d.type.toLowerCase().includes(search)
    )
  );

  if(!rows.length){
    return `<tr><td colspan="6"><div class="empty">No approved work found.</div></td></tr>`;
  }

  return rows.map(d=>`
    <tr>
      <td><strong>${escapeHTML(d.title)}</strong></td>
      <td>${escapeHTML(d.type)}</td>
      <td>${escapeHTML(d.subject)}</td>

function renderAssistant(){
  if(!canAcademic())return accessDenied();

  return `

          </div>

        <span class="badge badge-published">Academic Support</span>
      </div>

      <div class="chat" id="chatBox">

        <div class="message bot">
          Hello. I am the Global Kids Academy Teacher Assistant.

          I can help you structure lesson plans, lesson notes,
          schemes of work, questions, answer keys and marking guides.

          Try:
          "Create a lesson plan on fractions for JSS 1"
        </div>

      </div>

      <div class="chat-input">
        <input id="assistantInput"
          placeholder="Ask for academic planning help..."
          onkeydown="if(event.key==='Enter')sendAssistant()">

        <button class="btn btn-primary"
          onclick="sendAssistant()">Send</button>
      </div>

    </div>

function sendAssistant(){
  const input=document.getElementById("assistantInput");
  const chat=document.getElementById("chatBox");

  if(!input||!chat)return;

  const text=input.value.trim();

  if(!text)return;

  chat.innerHTML+=`
    <div class="message user">${escapeHTML(text)}</div>
  `;

  const response=assistantResponse(text);

  chat.innerHTML+=`
    <div class="message bot">${escapeHTML(response)}</div>
  `;

  input.value="";
  chat.scrollTop=chat.scrollHeight;
}

function assistantResponse(text){
  const q=text.toLowerCase();

  if(q.includes("lesson plan")){
    return `PROFESSIONAL LESSON PLAN STRUCTURE:

1. Entry Behaviour
2. Objectives
3. Materials
4. References
5. Set Induction
6. Presentation
   - Teacher Activities
   - Learners Activities
7. Evaluation
8. Conclusion
9. Assignment

Tell me the class, subject and topic and I can help you draft the content.`;
  }

  if(q.includes("lesson note")){
    return `LESSON NOTE STRUCTURE:

Topic
Subtopic
Date
Class
Duration
Objectives
Entry Behaviour
Instructional Materials
References
Introduction
Main Content
Examples
Class Activity
Evaluation
Conclusion
Assignment`;
  }

  if(q.includes("scheme")){
    return `A professional 13-week scheme should normally include:

Week
Topic
Subtopic
Learning Objectives
Content
Activities
Resources
Evaluation

I can help structure all 13 weeks for a specified class and subject.`;
  }

  if(q.includes("question")){
    return `For examination questions, specify:

• Class
• Subject
• Term
• Number of questions
• Question type
• Difficulty level

For example:
"JSS 1 Mathematics, First Term, 30 objective questions and 5 theory questions."`;
  }

  if(q.includes("fraction")){
    return `For a lesson on fractions, cover:

1. Meaning of fractions
2. Numerator and denominator
3. Proper and improper fractions
4. Mixed numbers
5. Equivalent fractions
6. Comparing fractions
7. Addition
8. Subtraction
9. Multiplication
10. Division
11. Word problems

Use worked examples and learner activities.`;
  }

  return `I can assist with lesson plans, lesson notes, 13-week schemes,
CA questions, examination questions, answer keys and marking guides.

Please include the class, subject and topic for a more useful response.`;
}

function renderBackup(){
  if(!hasRole("Admin"))return accessDenied();

  return `
    <div class="grid-2">

      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Backup</div>
            <div class="card-subtitle">

            </div>
          </div>
        </div>

        <div class="card-body">

          <div class="alert alert-info">
            Keep backups in a secure location. A backup contains
            the local database, including user records.
          </div>

          <button class="btn btn-primary"
            onclick="backupDatabase()">
            Download Database Backup
          </button>

        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Restore</div>
            <div class="card-subtitle">
              Restore a previously exported database.
            </div>
          </div>
        </div>

        <div class="card-body">

          <input type="file" id="restoreFile"
            accept=".json,application/json">

          <button class="btn btn-warning"
            style="margin-top:12px"
            onclick="restoreDatabase()">
            Restore Backup
          </button>

        </div>
      </div>

    </div>

    <div class="section-space card">
      <div class="card-header">
        <div>
          <div class="card-title">Recovery Snapshot</div>
          <div class="card-subtitle">
            The application automatically maintains a local recovery snapshot.
          </div>
        </div>
      </div>

      <div class="card-body">
        <p style="font-size:12px;color:var(--muted)">
          Recovery data is maintained in browser storage whenever the database is saved.
        </p>

        <button class="btn btn-light" onclick="restoreRecoverySnapshot()">
          Restore Latest Recovery Snapshot
        </button>
      </div>
    </div>
  `;
}

function backupDatabase(){
  const data={
    application:APP_NAME,
    schemaVersion:SCHEMA_VERSION,
    exportedAt:new Date().toISOString(),
    database:db
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=`Global-Kids-Academy-Backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();

  URL.revokeObjectURL(url);

  if(currentUser){
    audit("Backup Database","Database exported");
  }

  toast("Backup downloaded.","success");
}

function restoreDatabase(){
  const input=document.getElementById("restoreFile");

  if(!input?.files?.[0]){
    toast("Select a backup file first.","danger");
    return;
  }

  const file=input.files[0];
  const reader=new FileReader();

  reader.onload=function(){
    try{
      const data=JSON.parse(reader.result);
      const restored=data.database||data;

      if(!restored.schemaVersion||
        !Array.isArray(restored.users)||
        !Array.isArray(restored.students)){
        throw new Error("Invalid database structure");
      }

      if(!confirm(
        "Restore this backup? Current local data will be replaced."
      ))return;

      db=restored;
      saveDB();
      audit("Restore Database","Database restored from backup");

      toast("Database restored successfully.","success");

      setTimeout(()=>renderApp(),500);

    }catch(e){
      toast("Invalid or incompatible backup file.","danger");
    }
  };

  reader.readAsText(file);
}

function restoreRecoverySnapshot(){
  const raw=localStorage.getItem(RECOVERY_KEY);

  if(!raw){
    toast("No recovery snapshot is available.","danger");
    return;
  }

  try{
    const data=JSON.parse(raw);

    if(!data.database)throw new Error();

    if(!confirm("Restore the latest recovery snapshot?"))return;

    db=data.database;
    saveDB();

    audit("Restore Recovery Snapshot","Latest recovery snapshot restored");

    toast("Recovery snapshot restored.","success");

    setTimeout(()=>renderApp(),500);

  }catch(e){
    toast("Recovery snapshot is invalid.","danger");
  }
}

function renderPassword(){

function changePassword(e){
  e.preventDefault();

  const oldPassword=document.getElementById("oldPassword").value;
  const newPassword=document.getElementById("newPassword").value;
  const confirmPassword=document.getElementById("confirmPassword").value;

  if(currentUser.password!==oldPassword){
    toast("Current password is incorrect.","danger");
    return;
  }

  if(newPassword.length<8){
    toast("New password must contain at least 8 characters.","danger");
    return;
  }

  if(newPassword!==confirmPassword){
    toast("Passwords do not match.","danger");
    return;
  }

  const user=db.users.find(u=>u.id===currentUser.id);

  user.password=newPassword;
  currentUser.password=newPassword;

  saveDB();
  audit("Change Password","Account password changed");

  toast("Password changed successfully.","success");

  document.getElementById("oldPassword").value="";
  document.getElementById("newPassword").value="";
  document.getElementById("confirmPassword").value="";
}

function printWindow(html){
  const w=window.open("","_blank");

  if(!w){
    toast("Please allow pop-ups to print.","danger");
    return;
  }

  w.document.open();
  w.document.write(html);
  w.document.close();

  setTimeout(()=>{
    w.focus();
    w.print();
  },400);
}
