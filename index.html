<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#14532d">
<title>Caliphate Tarbiya Academy | Academic Management System</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0fdf4;color:#172018}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#064e3b,#166534,#22c55e)}
.login-box{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}
.logo{width:75px;height:75px;border-radius:50%;background:#14532d;color:white;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;margin:0 auto 15px}
.login-box h1{text-align:center;color:#14532d;font-size:23px}
.login-box .sub{text-align:center;color:#64748b;margin:7px 0 25px}
label{display:block;font-weight:bold;margin:12px 0 6px;font-size:14px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;background:white}
textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:9px;padding:11px 15px;background:#166534;color:white;font-weight:bold}
.btn:hover{opacity:.9}
.btn.secondary{background:#475569}
.btn.danger{background:#b91c1c}
.btn.warning{background:#b45309}
.btn.light{background:#dcfce7;color:#14532d}
.login-btn{width:100%;margin-top:20px;padding:13px}
.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-top:12px}
.info{background:#ecfdf5;color:#166534;padding:10px;border-radius:8px;margin-top:12px;font-size:13px}

.app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#064e3b;color:white;padding:18px;overflow:auto;z-index:20}
.brand{font-size:18px;font-weight:bold;line-height:1.3;padding:10px 5px 20px;border-bottom:1px solid #ffffff30}
.user-box{background:#ffffff12;border-radius:10px;padding:12px;margin:15px 0}
.user-box small{display:block;color:#bbf7d0;margin-top:4px}
.nav button{display:block;width:100%;border:0;background:transparent;color:#d1fae5;text-align:left;padding:11px;border-radius:8px;margin:3px 0}
.nav button:hover,.nav button.active{background:#166534;color:white}
.logout{margin-top:15px;width:100%;background:#991b1b!important}

.main{margin-left:260px;min-height:100vh}
.topbar{background:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dcfce7;position:sticky;top:0;z-index:10}
.menu-btn{display:none;background:#166534;color:white;border:0;border-radius:7px;padding:8px 12px}
.content{padding:22px;max-width:1500px;margin:auto}
.page-title{font-size:25px;color:#14532d;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.card{background:white;border-radius:13px;padding:18px;box-shadow:0 3px 12px #0000000d;border:1px solid #dcfce7}
.card h3{color:#166534;font-size:14px}
.card .num{font-size:30px;font-weight:bold;margin-top:8px}
.panel{background:white;border-radius:13px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #0000000d}
.panel h2{font-size:19px;color:#14532d;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}
th{background:#ecfdf5;color:#14532d}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold}
.badge.draft{background:#e2e8f0;color:#334155}
.badge.submitted{background:#fef3c7;color:#92400e}
.badge.approved{background:#dcfce7;color:#166534}
.badge.rejected{background:#fee2e2;color:#991b1b}
.badge.active{background:#dcfce7;color:#166534}
.badge.inactive{background:#fee2e2;color:#991b1b}
.assistant-output{background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:15px;white-space:pre-wrap;line-height:1.6;min-height:180px}
.notice{padding:12px;background:#fefce8;border-left:4px solid #eab308;margin-bottom:15px}
.footer{text-align:center;color:#64748b;padding:30px;font-size:13px}

@media(max-width:800px){
.sidebar{transform:translateX(-100%);transition:.25s;width:280px}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.menu-btn{display:block}
.form-grid,.form-grid.three{grid-template-columns:1fr}
.content{padding:15px}
.topbar{padding:12px 15px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
<div class="login-box">
<div class="logo">CTA</div>
<h1>Caliphate Tarbiya Academy</h1>
<div class="sub">School Academic Management System</div>

<label>Login As</label>
<select id="loginRole">
<option value="admin">Administrator</option>
<option value="teacher">Teacher</option>
</select>

<label>Username</label>
<input id="loginUsername" autocomplete="username" placeholder="Enter username">

<label>Password</label>
<div style="display:flex;gap:7px">
<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password">
<button class="btn secondary" onclick="toggleLoginPassword()">Show</button>
</div>

<div id="loginError" class="error hidden"></div>
<button class="btn login-btn" onclick="login()">Login</button>

<div class="info">
<strong>Administrator demo:</strong><br>
Username: admin<br>
Password: Admin@12345
</div>
</div>
</div>

<!-- APPLICATION -->
<div id="app" class="app">

<aside id="sidebar" class="sidebar">
<div class="brand">Caliphate Tarbiya Academy<br>Academic Management System</div>

<div class="user-box">
<strong id="sideUser">Administrator</strong>
<small id="sideRole">Administrator</small>
</div>

<div id="nav" class="nav"></div>

<button class="nav button logout" onclick="logout()">Logout</button>
</aside>

<main class="main">
<div class="topbar">
<button class="menu-btn" onclick="toggleSidebar()">☰ Menu</button>
<strong id="topTitle">Dashboard</strong>
<span id="topSchool">CTA Sokoto</span>
</div>

<div id="content" class="content"></div>

<div class="footer">
Caliphate Tarbiya Academy Sokoto • Academic Management System
</div>
</main>
</div>

<script>
/* ==============================
   DATABASE
================================ */

const DB_KEY="CTA_FULL_ACADEMIC_SYSTEM_V2";

const SUBJECTS=[
"English Language","Mathematics","Basic Science","Basic Technology",
"Social Studies","Civic Education","Islamic Religious Studies",
"Christian Religious Studies","Computer Studies","Digital Technology",
"Agricultural Science","Economics","Biology","Chemistry","Physics",
"Government","Literature-in-English","Geography","Hausa","Arabic","French",
"Home Economics","Physical & Health Education","Business Studies",
"Financial Accounting","Commerce"
];

const CLASSES=[
"Nursery 1","Nursery 2","Nursery 3",
"Basic 1","Basic 2","Basic 3","Basic 4","Basic 5","Basic 6",
"JSS 1","JSS 2","JSS 3",
"SS 1","SS 2","SS 3"
];

const LANGUAGES=[
{v:"English",t:"English"},
{v:"Hausa",t:"Hausa"},
{v:"Arabic",t:"العربية (Arabic)"},
{v:"French",t:"Français (French)"}
];

let db=loadDB();
let currentUser=null;
let currentPage="dashboard";
let assistantResult="";

/* ==============================
   DATABASE FUNCTIONS
================================ */

function loadDB(){
let raw=localStorage.getItem(DB_KEY);
if(raw){
try{return JSON.parse(raw)}catch(e){}
}
return {
users:[{
id:"admin",
name:"Administrator",
username:"admin",
password:"Admin@12345",
role:"admin",
academicRole:"Administrator",
subjects:[],
classes:[],
active:true
}],
documents:[],
settings:{
schoolName:"Caliphate Tarbiya Academy Sokoto",
address:"",
phone:"",
email:"",
session:"2026/2027",
term:"First Term"
}
};
}

function saveDB(){
localStorage.setItem(DB_KEY,JSON.stringify(db));
}

/* ==============================
   LOGIN
================================ */

function toggleLoginPassword(){
const p=document.getElementById("loginPassword");
p.type=p.type==="password"?"text":"password";
}

document.getElementById("loginPassword").addEventListener("keyup",e=>{
if(e.getModifierState && e.getModifierState("CapsLock")){
document.getElementById("loginError").classList.remove("hidden");
document.getElementById("loginError").textContent="Caps Lock is ON.";
}
});

function login(){
const role=document.getElementById("loginRole").value;
const username=document.getElementById("loginUsername").value.trim();
const password=document.getElementById("loginPassword").value;

const user=db.users.find(u=>
u.username===username &&
u.password===password &&
u.active!==false &&
u.role===role
);

if(!user){
const er=document.getElementById("loginError");
er.textContent="Invalid login details or inactive account.";
er.classList.remove("hidden");
return;
}

currentUser={...user};
document.getElementById("loginPage").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("sideUser").textContent=user.name;
document.getElementById("sideRole").textContent=
user.role==="admin"?"Administrator":(user.academicRole||"Teacher");

buildNav();
showPage("dashboard");
}

function logout(){
currentUser=null;
document.getElementById("app").style.display="none";
document.getElementById("loginPage").style.display="flex";
document.getElementById("loginPassword").value="";
document.getElementById("loginUsername").value="";
}

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("open");
}

/* ==============================
   NAVIGATION
================================ */

function buildNav(){
let html="";
const teacher=[
["dashboard","🏠 Dashboard"],
["scheme","📚 Scheme of Work"],
["lessonplan","📝 Lesson Plan"],
["lessonnote","📖 Lesson Note"],
["documents","📂 My Documents"],
["assistant","🤖 Teacher Assistant"],
["exam","📋 Examination & CA"],
["password","🔐 Change Password"]
];

teacher.forEach(x=>{
html+=`<button onclick="showPage('${x[0]}')">${x[1]}</button>`;
});

if(currentUser.role==="admin"){
html+=`
<hr style="border-color:#ffffff25;margin:12px 0">
<button onclick="showPage('teachers')">👨‍🏫 Teacher Management</button>
<button onclick="showPage('approval')">✅ Approval Centre</button>
<button onclick="showPage('settings')">⚙️ School Settings</button>
<button onclick="showPage('backup')">💾 Backup & Restore</button>`;
}

document.getElementById("nav").innerHTML=html;
}

function showPage(page){
currentPage=page;
document.getElementById("sidebar").classList.remove("open");

const titles={
dashboard:"Dashboard",
scheme:"Scheme of Work",
lessonplan:"Lesson Plan",
lessonnote:"Lesson Note",
documents:"My Documents",
assistant:"Teacher Assistant",
exam:"Examination & CA",
teachers:"Teacher Management",
approval:"Approval Centre",
settings:"School Settings",
backup:"Backup & Restore",
password:"Change Password"
};

document.getElementById("topTitle").textContent=titles[page]||"Dashboard";

const pages={
dashboard:dashboardPage,
scheme:schemePage,
lessonplan:lessonPlanPage,
lessonnote:lessonNotePage,
documents:documentsPage,
assistant:assistantPage,
exam:examPage,
teachers:teachersPage,
approval:approvalPage,
settings:settingsPage,
backup:backupPage,
password:passwordPage
};

if(pages[page])pages[page]();
}

/* ==============================
   HELPERS
================================ */

function options(arr,selected=""){
return arr.map(x=>{
let value=typeof x==="string"?x:x.v;
let text=typeof x==="string"?x:x.t;
return `<option value="${esc(value)}" ${value===selected?"selected":""}>${esc(text)}</option>`;
}).join("");
}

function esc(s){
return String(s??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function id(){
return Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function userCanEdit(doc){
return currentUser.role==="admin" || doc.userId===currentUser.id;
}

function statusBadge(status){
return `<span class="badge ${status.toLowerCase()}">${esc(status)}</span>`;
}

function documentList(filterUser=false){
let docs=db.documents;
if(filterUser)docs=docs.filter(d=>d.userId===currentUser.id);
return docs;
}

/* ==============================
   DASHBOARD
================================ */

function dashboardPage(){
const teachers=db.users.filter(u=>u.role==="teacher");
const docs=documentList(currentUser.role!=="admin");
const submitted=db.documents.filter(d=>d.status==="Submitted").length;
const approved=db.documents.filter(d=>d.status==="Approved").length;

document.getElementById("content").innerHTML=`
<h1 class="page-title">Welcome, ${esc(currentUser.name)}</h1>

<div class="cards">
<div class="card"><h3>Teachers</h3><div class="num">${teachers.length}</div></div>
<div class="card"><h3>My Documents</h3><div class="num">${docs.length}</div></div>
<div class="card"><h3>Submitted</h3><div class="num">${submitted}</div></div>
<div class="card"><h3>Approved</h3><div class="num">${approved}</div></div>
</div>

<div class="panel">
<h2>System Status</h2>
<p>✓ Administrator and Teacher login active</p>
<p>✓ Arabic and French subjects included</p>
<p>✓ Teacher Assistant available</p>
<p>✓ Lesson Plan, Lesson Note and Scheme workflow available</p>
<p>✓ CA & Examination module available</p>
<p>✓ Approval workflow available</p>
</div>

<div class="panel">
<h2>Current School Settings</h2>
<p><strong>School:</strong> ${esc(db.settings.schoolName)}</p>
<p><strong>Session:</strong> ${esc(db.settings.session)}</p>
<p><strong>Term:</strong> ${esc(db.settings.term)}</p>
</div>`;
}

/* ==============================
   SCHEME
================================ */

function schemePage(){
let use=db.documents.find(d=>d.type==="Scheme of Work"&&d.userId===currentUser.id&&d.status==="Draft");

document.getElementById("content").innerHTML=`
<h1 class="page-title">Scheme of Work</h1>

<div class="panel">
<h2>Create / Edit Scheme of Work</h2>
<div class="form-grid">
<div><label>Session</label><input id="scSession" value="${esc(db.settings.session)}"></div>
<div><label>Term</label><select id="scTerm">${options(["First Term","Second Term","Third Term"],db.settings.term)}</select></div>
<div><label>Class</label><select id="scClass">${options(CLASSES)}</select></div>
<div><label>Subject</label><select id="scSubject">${options(SUBJECTS)}</select></div>
<div><label>Week</label><input id="scWeek" placeholder="Week 1"></div>
<div><label>Topic</label><input id="scTopic"></div>
<div><label>Sub-topic</label><input id="scSubtopic"></div>
<div><label>Language of Content</label><select id="scLanguage">${options(LANGUAGES,"English")}</select></div>
<div class="full"><label>Learning Objectives</label><textarea id="scObjectives"></textarea></div>
<div class="full"><label>Activities</label><textarea id="scActivities"></textarea></div>
<div><label>Instructional Materials</label><textarea id="scMaterials"></textarea></div>
<div><label>Evaluation</label><textarea id="scEvaluation"></textarea></div>
</div>
<div class="actions">
<button class="btn" onclick="saveScheme('Draft')">Save Draft</button>
<button class="btn warning" onclick="saveScheme('Submitted')">Submit for Approval</button>
<button class="btn light" onclick="showPage('assistant')">Generate with Teacher Assistant</button>
</div>
</div>

<div class="panel">
<h2>Language Support</h2>
<p>Arabic and French are available as subjects and as content languages. Select Arabic or French above when preparing language-specific academic materials.</p>
</div>`;
}

function saveScheme(status){
saveDocumentFromForm("Scheme of Work",{
session:val("scSession"),
term:val("scTerm"),
className:val("scClass"),
subject:val("scSubject"),
week:val("scWeek"),
topic:val("scTopic"),
subtopic:val("scSubtopic"),
language:val("scLanguage"),
objectives:val("scObjectives"),
activities:val("scActivities"),
materials:val("scMaterials"),
evaluation:val("scEvaluation")
},status);
}

/* ==============================
   LESSON PLAN
================================ */

function lessonPlanPage(prefill={}){
document.getElementById("content").innerHTML=`
<h1 class="page-title">Nigerian Standard Lesson Plan</h1>

<div class="panel">
<div class="notice">
<strong>Standard format:</strong> Entry Behaviour, Objectives, Materials, References, Set Induction, Presentation, Teacher's Activities, Learners' Activities, Evaluation, Conclusion and Assignment.
</div>

<div class="form-grid">
<div><label>School</label><input id="lpSchool" value="${esc(prefill.school||db.settings.schoolName)}"></div>
<div><label>Teacher</label><input id="lpTeacher" value="${esc(prefill.teacher||currentUser.name)}"></div>
<div><label>Date</label><input id="lpDate" type="date" value="${esc(prefill.date||"")}"></div>
<div><label>Class</label><select id="lpClass">${options(CLASSES,prefill.className||"")}</select></div>
<div><label>Subject</label><select id="lpSubject">${options(SUBJECTS,prefill.subject||"")}</select></div>
<div><label>Duration</label><input id="lpDuration" value="${esc(prefill.duration||"40 Minutes")}"></div>
<div><label>Topic</label><input id="lpTopic" value="${esc(prefill.topic||"")}"></div>
<div><label>Sub-topic</label><input id="lpSubtopic" value="${esc(prefill.subtopic||"")}"></div>
<div><label>Session</label><input id="lpSession" value="${esc(prefill.session||db.settings.session)}"></div>
<div><label>Term</label><select id="lpTerm">${options(["First Term","Second Term","Third Term"],prefill.term||db.settings.term)}</select></div>

<div class="full"><label>Entry Behaviour / Previous Knowledge</label><textarea id="lpEntry">${esc(prefill.entry||"")}</textarea></div>
<div class="full"><label>Instructional Objectives</label><textarea id="lpObjectives">${esc(prefill.objectives||"")}</textarea></div>
<div class="full"><label>Instructional Materials</label><textarea id="lpMaterials">${esc(prefill.materials||"")}</textarea></div>
<div class="full"><label>References</label><textarea id="lpReferences">${esc(prefill.references||"")}</textarea></div>
<div class="full"><label>Set Induction</label><textarea id="lpInduction">${esc(prefill.induction||"")}</textarea></div>
<div class="full"><label>Presentation / Lesson Development</label><textarea id="lpPresentation">${esc(prefill.presentation||"")}</textarea></div>
<div class="full"><label>Teacher's Activities</label><textarea id="lpTeacherAct">${esc(prefill.teacherActivities||"")}</textarea></div>
<div class="full"><label>Learners' Activities</label><textarea id="lpLearnerAct">${esc(prefill.learnerActivities||"")}</textarea></div>
<div class="full"><label>Evaluation</label><textarea id="lpEvaluation">${esc(prefill.evaluation||"")}</textarea></div>
<div class="full"><label>Conclusion</label><textarea id="lpConclusion">${esc(prefill.conclusion||"")}</textarea></div>
<div class="full"><label>Assignment</label><textarea id="lpAssignment">${esc(prefill.assignment||"")}</textarea></div>
<div class="full"><label>Teacher's Reflection</label><textarea id="lpReflection">${esc(prefill.reflection||"")}</textarea></div>
</div>

<div class="actions">
<button class="btn" onclick="saveLessonPlan('Draft')">Save Draft</button>
<button class="btn warning" onclick="saveLessonPlan('Submitted')">Submit for Approval</button>
</div>
</div>`;
}

function saveLessonPlan(status){
saveDocumentFromForm("Lesson Plan",{
school:val("lpSchool"),teacher:val("lpTeacher"),date:val("lpDate"),
className:val("lpClass"),subject:val("lpSubject"),duration:val("lpDuration"),
topic:val("lpTopic"),subtopic:val("lpSubtopic"),session:val("lpSession"),term:val("lpTerm"),
entry:val("lpEntry"),objectives:val("lpObjectives"),materials:val("lpMaterials"),
references:val("lpReferences"),induction:val("lpInduction"),presentation:val("lpPresentation"),
teacherActivities:val("lpTeacherAct"),learnerActivities:val("lpLearnerAct"),
evaluation:val("lpEvaluation"),conclusion:val("lpConclusion"),
assignment:val("lpAssignment"),reflection:val("lpReflection")
},status);
}

/* ==============================
   LESSON NOTE
================================ */

function lessonNotePage(prefill={}){
document.getElementById("content").innerHTML=`
<h1 class="page-title">Lesson Note</h1>

<div class="panel">
<div class="form-grid">
<div><label>Class</label><select id="lnClass">${options(CLASSES,prefill.className||"")}</select></div>
<div><label>Subject</label><select id="lnSubject">${options(SUBJECTS,prefill.subject||"")}</select></div>
<div><label>Topic</label><input id="lnTopic" value="${esc(prefill.topic||"")}"></div>
<div><label>Sub-topic</label><input id="lnSubtopic" value="${esc(prefill.subtopic||"")}"></div>
<div><label>Language</label><select id="lnLanguage">${options(LANGUAGES,prefill.language||"English")}</select></div>
<div><label>Session</label><input id="lnSession" value="${esc(prefill.session||db.settings.session)}"></div>
<div class="full"><label>Objectives</label><textarea id="lnObjectives">${esc(prefill.objectives||"")}</textarea></div>
<div class="full"><label>Introduction</label><textarea id="lnIntro">${esc(prefill.intro||"")}</textarea></div>
<div class="full"><label>Detailed Explanation</label><textarea id="lnExplanation">${esc(prefill.explanation||"")}</textarea></div>
<div class="full"><label>Examples</label><textarea id="lnExamples">${esc(prefill.examples||"")}</textarea></div>
<div class="full"><label>Teacher / Learner Activities</label><textarea id="lnActivities">${esc(prefill.activities||"")}</textarea></div>
<div class="full"><label>Evaluation</label><textarea id="lnEvaluation">${esc(prefill.evaluation||"")}</textarea></div>
<div class="full"><label>Assignment</label><textarea id="lnAssignment">${esc(prefill.assignment||"")}</textarea></div>
<div class="full"><label>References</label><textarea id="lnReferences">${esc(prefill.references||"")}</textarea></div>
</div>

<div class="actions">
<button class="btn" onclick="saveLessonNote('Draft')">Save Draft</button>
<button class="btn warning" onclick="saveLessonNote('Submitted')">Submit for Approval</button>
</div>
</div>`;
}

function saveLessonNote(status){
saveDocumentFromForm("Lesson Note",{
className:val("lnClass"),subject:val("lnSubject"),topic:val("lnTopic"),
subtopic:val("lnSubtopic"),language:val("lnLanguage"),session:val("lnSession"),
objectives:val("lnObjectives"),intro:val("lnIntro"),explanation:val("lnExplanation"),
examples:val("lnExamples"),activities:val("lnActivities"),
evaluation:val("lnEvaluation"),assignment:val("lnAssignment"),
references:val("lnReferences")
},status);
}

/* ==============================
   SAVE DOCUMENT
================================ */

function saveDocumentFromForm(type,data,status){
const doc={
id:id(),
type,
userId:currentUser.id,
teacherName:currentUser.name,
createdAt:new Date().toLocaleString(),
status,
data
};

db.documents.push(doc);
saveDB();
alert(status==="Submitted"?"Document submitted successfully.":"Draft saved successfully.");
showPage("documents");
}

/* ==============================
   DOCUMENTS
================================ */

function documentsPage(){
let docs=documentList(currentUser.role!=="admin");

let rows=docs.map(d=>`
<tr>
<td>${esc(d.type)}</td>
<td>${esc(d.data.subject||"")}</td>
<td>${esc(d.data.className||"")}</td>
<td>${esc(d.teacherName)}</td>
<td>${statusBadge(d.status)}</td>
<td>

function createTeacher(){
if(currentUser.role!=="admin"){
alert("Only Administrator can create teachers.");
return;

const name=val("tName").trim();
const username=val("tUsername").trim();
const password=val("tPassword");

const subject=val("tSubject");

if(!name||!username||!password){
alert("Please complete all required fields.");
return;
}

if(db.users.some(u=>u.username===username)){
alert("Username already exists.");
return;
}

db.users.push({
id:id(),
name,
username,
password,
role:"teacher",
academicRole,
subjects:[subject],
classes:[cls],
active:true
});

saveDB();
alert("Teacher account created successfully.");
showPage("teachers");
}

function toggleTeacher(id){
const t=db.users.find(u=>u.id===id);
if(!t)return;
t.active=!t.active;
saveDB();
showPage("teachers");
}

function resetTeacher(id){
const t=db.users.find(u=>u.id===id);
if(!t)return;
const p=prompt("Enter new password for "+t.name);
if(!p)return;
t.password=p;
saveDB();
alert("Password reset successfully.");
}

function deleteTeacher(id){
if(!confirm("Delete this teacher account?"))return;
db.users=db.users.filter(u=>u.id!==id);
saveDB();
showPage("teachers");
}

function downloadBackup(){

a.download="caliphate-tarbiya-academy-backup.json";

}

function restoreBackup(){
const file=document.getElementById("restoreFile").files[0];
if(!file){
alert("Select a backup file first.");
return;
}

const reader=new FileReader();
reader.onload=e=>{
try{
const restored=JSON.parse(e.target.result);
if(!restored.users||!restored.documents){
alert("Invalid CTA backup.");
return;
}
db=restored;
saveDB();
alert("Database restored successfully.");
location.reload();
}catch(err){
alert("Unable to restore this backup.");
}
};
reader.readAsText(file);
}

}

/* Add Word export button when viewing exam */
const originalViewDocument=viewDocument;
viewDocument=function(id){
originalViewDocument(id);
const d=db.documents.find(x=>x.id===id);
if(d&&d.type==="Examination & CA"){
const panel=document.querySelector("#content .panel");
if(panel){
const actions=panel.querySelector(".actions");
if(actions){
const b=document.createElement("button");
b.className="btn";
b.textContent="Save as Microsoft Word";
b.onclick=()=>exportExamWord(id);
actions.prepend(b);
}
}
}
};
