<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#14532d">
<title>Caliphate Tarbiya Academy | Academic Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6f4;
  color:#17251c;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#064e3b,#14532d,#166534);
}
.login-card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:20px;
  padding:28px;
  box-shadow:0 20px 60px #0005;
}
.logo{
  width:75px;height:75px;border-radius:50%;
  background:#14532d;color:white;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:25px;
  margin:0 auto 15px;
}
.login h1{text-align:center;font-size:23px;color:#14532d}
.login p{text-align:center;color:#667;margin:8px 0 22px}

label{
  display:block;
  font-weight:700;
  margin:12px 0 6px;
}
input,select,textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #ccd5cf;
  border-radius:9px;
  background:white;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:#15803d;
  box-shadow:0 0 0 2px #15803d22;
}
textarea{min-height:130px;resize:vertical}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:700;
}
.btn-primary{background:#15803d;color:white}
.btn-primary:hover{background:#166534}
.btn-secondary{background:#e7eee9;color:#14532d}
.btn-danger{background:#dc2626;color:white}
.btn-warning{background:#d97706;color:white}
.btn-info{background:#2563eb;color:white}
.btn:disabled{opacity:.5;cursor:not-allowed}

.app{min-height:100vh;display:flex}
.sidebar{
  width:260px;
  background:#064e3b;
  color:white;
  position:fixed;
  left:0;top:0;bottom:0;
  overflow:auto;
  z-index:20;
}
.brand{
  padding:20px 16px;
  border-bottom:1px solid #ffffff20;
}
.brand strong{display:block;font-size:18px}
.brand small{opacity:.75}
.nav{padding:12px}
.nav button{
  width:100%;
  text-align:left;
  background:none;
  border:0;
  color:#dcefe3;
  padding:11px 12px;
  border-radius:8px;
  margin-bottom:3px;
}
.nav button:hover,.nav button.active{
  background:#ffffff18;
  color:white;
}
.nav-section{
  font-size:11px;
  color:#9bc4a9;
  padding:15px 12px 5px;
  text-transform:uppercase;
  font-weight:bold;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
  min-height:100vh;
}
.topbar{
  height:65px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:10;
}
.menu-btn{display:none}
.page{padding:22px;max-width:1400px;margin:auto}
.page-title{
  font-size:25px;
  font-weight:800;
  color:#14532d;
  margin-bottom:18px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}
.card{
  background:white;
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 10px #0000000b;
  border:1px solid #e2e8e4;
}
.stat-number{
  font-size:30px;
  font-weight:800;
  color:#14532d;
}
.stat-label{color:#68756d;margin-top:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}
.toolbar>*{flex:0 0 auto}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}
th,td{
  padding:10px;
  border-bottom:1px solid #e5e9e6;
  text-align:left;
  vertical-align:top;
}
th{background:#ecf5ef;color:#14532d}
.table-wrap{overflow:auto;border-radius:10px}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.badge-draft{background:#e5e7eb;color:#374151}
.badge-submitted{background:#fef3c7;color:#92400e}
.badge-approved{background:#dcfce7;color:#166534}
.badge-exam{background:#dbeafe;color:#1d4ed8}
.badge-final{background:#ede9fe;color:#6d28d9}
.badge-published{background:#bbf7d0;color:#166534}
.badge-returned{background:#fee2e2;color:#991b1b}

.form-card{
  background:white;
  border:1px solid #e0e7e2;
  border-radius:12px;
  padding:18px;
  margin-bottom:16px;
}
.form-card h3{color:#14532d;margin-bottom:12px}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.alert{
  padding:12px;
  border-radius:8px;
  margin-bottom:12px;
}
.alert-error{background:#fee2e2;color:#991b1b}
.alert-success{background:#dcfce7;color:#166534}
.alert-info{background:#dbeafe;color:#1e40af}

.empty{
  padding:35px;
  text-align:center;
  color:#777;
}

.mobile-only{display:none}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{
    margin-left:0;
    width:100%;
  }
  .menu-btn{
    display:block;
    border:0;
    background:#14532d;
    color:white;
    border-radius:7px;
    padding:8px 11px;
  }
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
  .mobile-only{display:block}
}
@media(max-width:600px){
  .cards{grid-template-columns:1fr}
  .page{padding:13px}
  .topbar{padding:0 12px}
  .page-title{font-size:21px}
}
</style>
</head>

<body>

<select id="loginType">

<script>
/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
  "https://udbocxqfsufpyexxpfkr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eljKKJNBUtRx55847F2RTA_2hfMgs7U";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let assistantText = "";
let currentResultRows = [];

/* ============================================================
   HELPERS
============================================================ */

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function uid(){
  return crypto.randomUUID();
}

function notify(message,type="info"){
  const cls =
    type==="error" ? "alert-error" :
    type==="success" ? "alert-success" :
    "alert-info";

  const el = document.createElement("div");
  el.className = "alert " + cls;
  el.textContent = message;

  const page = $("content");
  if(page){
    page.prepend(el);
    setTimeout(()=>el.remove(),5000);
  }else{
    alert(message);
  }
}

function statusBadge(status){
  const map={
    draft:"badge-draft",
    submitted_hod:"badge-submitted",
    hod_approved:"badge-approved",
    submitted_exam_officer:"badge-exam",
    finalized:"badge-final",
    published:"badge-published",
    returned:"badge-returned"
  };

  return `<span class="badge ${map[status]||"badge-draft"}">
    ${esc(String(status||"").replaceAll("_"," ").toUpperCase())}
  </span>`;
}

function grade(total){
  total=Number(total)||0;
  if(total>=75)return "A";
  if(total>=70)return "B";
  if(total>=60)return "C";
  if(total>=50)return "D";
  if(total>=40)return "E";
  return "F";
}

function gradeText(g){
  return {
    A:"Excellent",
    B:"Very Good",
    C:"Good",
    D:"Fair",
    E:"Pass",
    F:"Fail"
  }[g] || "";
}

function isAdmin(){
  return currentProfile?.role==="administrator";
}

function isTeacher(){
  return currentProfile?.role==="teacher";
}

function isHOD(){
  const r=(currentProfile?.academic_role||"").toLowerCase();
  return r.includes("hod");
}

function isExamOfficer(){
  return currentProfile?.is_exam_officer===true ||
         (currentProfile?.academic_role||"").toLowerCase()
           .includes("examination officer");
}

function canUseHOD(){
  return isAdmin() || isHOD();
}

function canUseExam(){
  return isAdmin() || isExamOfficer();
}

/* ============================================================
   AUTH
============================================================ */

async function login(){

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;
  const type=$("loginType").value;

  if(!email || !password){
    $("loginMessage").innerHTML =
      `<div class="alert alert-error">Enter email and password.</div>`;
    return;
  }

  $("loginMessage").innerHTML =
    `<div class="alert alert-info">Signing in...</div>`;

  const {data,error}=await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    $("loginMessage").innerHTML =
      `<div class="alert alert-error">${esc(error.message)}</div>`;
    return;
  }

  currentUser=data.user;

  await loadProfile();

  if(!currentProfile){
    await sb.auth.signOut();
    $("loginMessage").innerHTML =
      `<div class="alert alert-error">
        Your account profile has not been configured.
      </div>`;
    return;
  }

  if(type==="administrator" &&
     currentProfile.role!=="administrator"){
    await sb.auth.signOut();
    $("loginMessage").innerHTML =
      `<div class="alert alert-error">
        This account is not an Administrator account.
      </div>`;
    return;
  }

  if(type==="teacher" &&
     currentProfile.role!=="teacher"){
    await sb.auth.signOut();
    $("loginMessage").innerHTML =
      `<div class="alert alert-error">
        This account is not a Teacher account.
      </div>`;
    return;
  }

  openApplication();
}

async function loadProfile(){

  if(!currentUser)return;

  const {data,error}=await sb
    .from("user_profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error(error);
    currentProfile=null;
    return;
  }

  currentProfile=data;
}

function openApplication(){

  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("userName").textContent =
    currentProfile?.full_name ||
    currentUser?.email ||
    "User";

  $("adminNav").classList.toggle(
    "hidden",
    !isAdmin()
  );

  $("hodNav").classList.toggle(
    "hidden",
    !canUseHOD()
  );

  $("examNav").classList.toggle(
    "hidden",
    !canUseExam()
  );

  showPage("dashboard");
}

async function restoreSession(){

  const {data}=await sb.auth.getSession();

  if(data?.session?.user){
    currentUser=data.session.user;
    await loadProfile();

    if(currentProfile){
      openApplication();
    }
  }
}

async function logout(){
  await sb.auth.signOut();

  currentUser=null;
  currentProfile=null;

  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("loginPassword").value="";
}

/* ============================================================
   NAVIGATION
============================================================ */

function toggleSidebar(){
  $("sidebar").classList.toggle("open");
}

function showPage(page){

  $("sidebar").classList.remove("open");

  const titles={
    dashboard:"Dashboard",
    lessonPlan:"Lesson Plan",
    lessonNote:"Lesson Note",
    scheme:"Scheme of Work",
    assistant:"Teacher Assistant",
    documents:"My Documents",
    resultEntry:"Result Entry",
    submissions:"My Result Submissions",
    hod:"HOD Result Vetting",
    examOfficer:"Examination Officer",
    teachers:"Teacher Management",
    classes:"Classes & Students",
    hodAssignment:"HOD Assignment",
    publish:"Publish Results",
    broadsheet:"Broadsheet",
    settings:"School Settings",
    password:"Change Password"
  };

  $("topTitle").textContent=titles[page]||"Dashboard";

  const pages={
    dashboard:dashboardPage,
    lessonPlan:lessonPlanPage,
    lessonNote:lessonNotePage,
    scheme:schemePage,
    assistant:assistantPage,
    documents:documentsPage,
    resultEntry:resultEntryPage,
    submissions:submissionsPage,
    hod:hodPage,
    examOfficer:examOfficerPage,
    teachers:teachersPage,
    classes:classesPage,
    hodAssignment:hodAssignmentPage,
    publish:publishPage,
    broadsheet:broadsheetPage,
    settings:settingsPage,
    password:passwordPage
  };

  if(!pages[page]){
    $("content").innerHTML="<div class='empty'>Page not found.</div>";
    return;
  }

  pages[page]();
}

/* ============================================================
   DOCUMENT GENERATOR
============================================================ */

function lessonPlanPage(){
  $("content").innerHTML=
    `<div class="page-title">Lesson Plan</div>`+
    documentForm("Lesson Plan");
}

function lessonNotePage(){
  $("content").innerHTML=
    `<div class="page-title">Lesson Note</div>`+
    documentForm("Lesson Note");
}

function schemePage(){
  $("content").innerHTML=
    `<div class="page-title">Scheme of Work</div>`+
    documentForm("Scheme of Work");
}

async function saveDocument(type){

  const title=$("docTitle").value.trim();
  const subject=$("docSubject").value.trim();
  const className=$("docClass").value;
  const term=$("docTerm").value;
  const session=$("docSession").value.trim();
  const content=$("docContent").value;

  if(!title || !content){
    notify("Enter a title and document content.","error");
    return;
  }

  const {error}=await sb.from("documents").insert({
    owner_id:currentUser.id,
    document_type:type,
    title,
    subject,
    class_name:className,
    term,
    session,
    content,
    status:"draft"
  });

  if(error){
    console.error(error);
    notify(error.message,"error");
    return;
  }

  notify("Document saved successfully.","success");
}

/* ============================================================
   TEACHER ASSISTANT
============================================================ */

function assistantPage(){

  $("content").innerHTML=`

function calculateRow(id){

  const ca1=Math.min(15,Math.max(0,
    Number($("ca1_"+id).value)||0));

  const ca2=Math.min(15,Math.max(0,
    Number($("ca2_"+id).value)||0));

  const exam=Math.min(70,Math.max(0,
    Number($("exam_"+id).value)||0));

  const total=ca1+ca2+exam;
  const g=grade(total);

  $("total_"+id).textContent=total;
  $("grade_"+id).textContent=
    `${g} - ${gradeText(g)}`;
}

async function saveResults(status){

  const classId=$("resultClass").value;
  const subjectId=$("resultSubject").value;
  const term=$("resultTerm").value;
  const session=$("resultSession").value.trim();

  if(!classId || !subjectId){
    notify("Select class and subject.","error");
    return;
  }

  const submissionId="SUB-"+uid();

  const rows=currentResultRows.map(s=>{

    const ca1=Math.min(15,Math.max(0,
      Number($("ca1_"+s.id).value)||0));

    const ca2=Math.min(15,Math.max(0,
      Number($("ca2_"+s.id).value)||0));

    const exam=Math.min(70,Math.max(0,
      Number($("exam_"+s.id).value)||0));

    return {
      id:uid(),
      submission_id:submissionId,
      teacher_id:currentUser.id,
      student_id:s.id,
      class_id:classId,
      subject_id:subjectId,
      term,
      session,
      ca1,
      ca2,
      exam,
      status,
      created_at:new Date().toISOString()
    };
  });

  const {error}=await sb
    .from("results")
    .insert(rows);

  if(error){
    console.error(error);
    notify(error.message,"error");
    return;
  }

  notify(
    status==="submitted_hod"
      ? "Result submitted to HOD successfully."
      : "Result draft saved successfully.",
    "success"
  );

  showPage("submissions");
}

      </button>

  `;

async function loadBroadsheet(){

  const classId=$("bClass").value;
  const term=$("bTerm").value;
  const session=$("bSession").value.trim();

  const {data,error}=await sb
    .from("results")
    .select(`
      *,
      students(full_name),
      subjects(name)
    `)
    .eq("class_id",classId)
    .eq("term",term)
    .eq("session",session)
    .eq("status","published")
    .order("created_at");

  if(error){
    notify(error.message,"error");
    return;
  }

  if(!data?.length){
    $("broadsheetBox").innerHTML=
      `<div class="card empty">No published results found.</div>`;
    return;
  }

  const students={};
  const subjects={};

  data.forEach(r=>{
    const sid=r.student_id;

    if(!students[sid]){
      students[sid]={
        name:r.students?.full_name,
        scores:{}
      };
    }

    const sub=r.subjects?.name||"Subject";

    students[sid].scores[sub]=
      Number(r.ca1||0)+
      Number(r.ca2||0)+
      Number(r.exam||0);

    subjects[sub]=true;
  });

  const subjectNames=Object.keys(subjects);

  $("broadsheetBox").innerHTML=`
    <div class="form-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              ${subjectNames.map(s=>`
                <th>${esc(s)}</th>
              `).join("")}
              <th>Grand Total</th>
            </tr>
          </thead>

          <tbody>
            ${Object.values(students).map(s=>{
              const total=subjectNames.reduce(
                (a,x)=>a+(s.scores[x]||0),0
              );

              return `
                <tr>
                  <td>${esc(s.name)}</td>

                  ${subjectNames.map(x=>`
                    <td>${s.scores[x]??"-"}</td>
                  `).join("")}

                  <td><strong>${total}</strong></td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>

      <button class="btn btn-secondary"
        style="margin-top:12px"
        onclick="printCurrentDocument()">
        Print Broadsheet
      </button>
    </div>
  `;
}

async function saveSchoolSettings(){

  const school_name=$("schoolName").value.trim();
  const motto=$("schoolMotto").value.trim();
  const address=$("schoolAddress").value.trim();
  const contact=$("schoolContact").value.trim();

  const {data:existing}=await sb
    .from("school_profiles")
    .select("id")
    .limit(1)
    .maybeSingle();

  let result;

  if(existing?.id){

    result=await sb
      .from("school_profiles")
      .update({
        school_name,
        motto,
        address,
        contact
      })
      .eq("id",existing.id);

  }else{

    result=await sb
      .from("school_profiles")
      .insert({
        school_name,
        motto,
        address,
        contact
      });
  }

  if(result.error){
    notify(result.error.message,"error");
    return;
  }

  notify("School settings saved.","success");

  const p1=$("newPassword").value;
  const p2=$("confirmPassword").value;

  if(p1.length<6){
    notify("Password must contain at least 6 characters.","error");
    return;
  }

  if(p1!==p2){
    notify("Passwords do not match.","error");
    return;
  }

  const {error}=await sb.auth.updateUser({
    password:p1
  });

  if(error){
    notify(error.message,"error");

  notify("Password changed successfully.","success");

  $("newPassword").value="";
  $("confirmPassword").value="";
}

function printCurrentDocument(){

  const content=
    $("viewDocContent")?.value ||
    $("docContent")?.value ||
    $("assistantOutput")?.value ||
    $("content")?.innerText ||
    "";

  const w=window.open("","_blank");

  if(!w){
    notify("Please allow pop-ups for printing.","error");
    return;
  }

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Caliphate Tarbiya Academy</title>
      <style>
        body{
          font-family:Arial,sans-serif;
          padding:40px;
          line-height:1.6;
        }
        h1,h2,h3{color:#14532d}
        pre{
          white-space:pre-wrap;
          font-family:Arial,sans-serif;
        }
      </style>
    </head>
    <body>
      <h2>Caliphate Tarbiya Academy</h2>
      <pre>${esc(content)}</pre>
    </body>
    </html>
  `);

  w.document.close();
  w.focus();
  setTimeout(()=>w.print(),300);
}

    currentProfile=null;
    return;

  if(session?.user && !currentProfile){

    currentUser=session.user;
    await loadProfile();

    if(currentProfile){
      openApplication();

});
