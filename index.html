<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Global Kids Academy Sokoto</title>

<style>
*{box-sizing:border-box}
:root{
 --green:#166534;
 --green2:#15803d;
 --green3:#22c55e;
 --dark:#10251a;
 --bg:#f4f7f5;
 --card:#fff;
 --border:#dbe5de;
 --muted:#64748b;
 --danger:#b91c1c;
 --warning:#b45309;
 --blue:#1d4ed8;
 --shadow:0 8px 25px rgba(15,23,42,.07);
}
html,body{margin:0;padding:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:#17251d}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login-wrap{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;background:linear-gradient(135deg,#ecfdf5,#f8fafc)
}
.login-card{
 width:min(440px,100%);background:#fff;border:1px solid var(--border);
 border-radius:22px;padding:30px;box-shadow:var(--shadow)
}
.logo{
 width:72px;height:72px;border-radius:18px;background:var(--green);
 color:white;display:flex;align-items:center;justify-content:center;
 font-size:28px;font-weight:800;margin:0 auto 15px
}
.login-card h1{text-align:center;font-size:24px;margin:5px 0}
.login-card .sub{text-align:center;color:var(--muted);margin-bottom:25px}
.form-group{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#334155}
input,select,textarea{
 width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;
 background:#fff;outline:none
}
input:focus,select:focus,textarea:focus{
 border-color:var(--green2);box-shadow:0 0 0 3px rgba(34,197,94,.12)
}
textarea{min-height:100px;resize:vertical}
.btn{
 border:0;border-radius:9px;padding:10px 14px;font-weight:700;
 background:#e2e8f0;color:#1e293b
}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#14532d}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-warning{background:#fef3c7;color:#92400e}
.btn-blue{background:#dbeafe;color:#1e40af}
.btn-small{padding:7px 10px;font-size:12px}
.btn-block{width:100%}
.demo-box{
 margin-top:18px;background:#f0fdf4;border:1px solid #bbf7d0;
 padding:12px;border-radius:10px;font-size:12px;color:#166534
}

/* APP */
.app{display:flex;min-height:100vh}
.sidebar{
 position:fixed;left:0;top:0;bottom:0;width:260px;background:#0f291a;color:#fff;
 z-index:1000;overflow-y:auto;transition:.25s
}
.brand{
 padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.1);
 display:flex;align-items:center;gap:12px
}
.brand-logo{
 width:44px;height:44px;border-radius:12px;background:#22c55e;
 display:flex;align-items:center;justify-content:center;font-weight:900
}
.brand-title{font-weight:800;font-size:14px;line-height:1.3}
.brand-sub{font-size:10px;color:#bbf7d0;margin-top:3px}
.nav-section{
 padding:18px 15px 7px;color:#86efac;font-size:10px;text-transform:uppercase;
 letter-spacing:1px;font-weight:800
}
.nav-btn{
 width:100%;border:0;background:transparent;color:#d1fae5;text-align:left;
 padding:11px 15px;border-radius:8px;margin:2px 0;font-weight:600;
 display:flex;align-items:center;gap:10px
}
.nav-btn:hover,.nav-btn.active{background:#14532d;color:#fff}
.nav-icon{width:22px;text-align:center}
.main{margin-left:260px;width:calc(100% - 260px);min-width:0}
.topbar{
 height:68px;background:#fff;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;padding:0 24px;
 position:sticky;top:0;z-index:900
}
.topbar-title{font-weight:800;font-size:18px}
.user-pill{
 display:flex;align-items:center;gap:8px;background:#f1f5f9;
 padding:8px 12px;border-radius:30px;font-size:12px
}
.avatar{
 width:28px;height:28px;border-radius:50%;background:var(--green);
 color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800
}
.menu-toggle{
 display:none;border:0;background:#ecfdf5;color:var(--green);
 width:40px;height:40px;border-radius:9px;font-size:20px
}
.content{padding:24px;max-width:1600px;margin:auto}
.page-head{
 display:flex;justify-content:space-between;align-items:flex-start;gap:15px;
 margin-bottom:20px
}
.page-head h2{margin:0 0 5px;font-size:23px}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px
}
.card{
 background:#fff;border:1px solid var(--border);border-radius:14px;
 box-shadow:0 3px 12px rgba(15,23,42,.04);padding:18px
}
.stat-label{font-size:12px;color:var(--muted);font-weight:700}
.stat-value{font-size:28px;font-weight:900;margin-top:8px}
.stat-note{font-size:11px;color:#64748b;margin-top:5px}
.section-title{font-size:16px;font-weight:800;margin:0 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.toolbar{
 background:#fff;border:1px solid var(--border);padding:12px;border-radius:12px;
 display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px
}
.toolbar>*{flex:1;min-width:130px}
.table-wrap{
 width:100%;overflow:auto;border:1px solid var(--border);border-radius:12px;
 background:#fff
}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{
 padding:10px 9px;border-bottom:1px solid #e5e7eb;
 text-align:left;font-size:12px;white-space:nowrap
}
th{background:#f0fdf4;color:#14532d;font-weight:800;position:sticky;top:0;z-index:2}
tr:hover td{background:#fafafa}
.badge{
 display:inline-block;padding:4px 8px;border-radius:30px;font-size:10px;font-weight:800
}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.empty{
 padding:35px;text-align:center;color:#64748b;background:#fff;border-radius:12px
}

/* REGISTER */
.register-toolbar{
 display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;
 background:#fff;border:1px solid var(--border);padding:15px;border-radius:12px;
 margin-bottom:15px
}
.register-shell{
 background:#fff;border:1px solid #cbd5e1;border-radius:10px;
 overflow:auto;box-shadow:var(--shadow)
}
.register-header{
 min-width:1300px;padding:20px;text-align:center;border-bottom:1px solid #cbd5e1
}
.register-header h1{margin:0;font-size:22px;text-transform:uppercase}
.register-header h2{margin:6px 0;font-size:17px}
.register-meta{
 display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
 margin-top:14px;text-align:left;font-size:12px
}
.register-table{
 min-width:1450px;border-collapse:collapse;width:100%
}
.register-table th,.register-table td{
 border:1px solid #94a3b8;text-align:center;padding:5px;font-size:10px
}
.register-table th{
 background:#dcfce7;color:#14532d;position:sticky;top:0
}
.register-table th.name,
.register-table td.name{text-align:left;min-width:220px}
.register-table th.adm,
.register-table td.adm{min-width:100px}
.day-head{min-width:31px}
.att-btn{
 width:25px;height:25px;padding:0;border-radius:4px;border:1px solid #cbd5e1;
 background:#fff;font-weight:900;font-size:10px
}
.att-btn.p{background:#dcfce7;color:#166534;border-color:#86efac}
.att-btn.a{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.att-btn.m{background:#fef3c7;color:#92400e}
.att-total{font-weight:900;background:#f8fafc}
.register-sign{
 min-width:1300px;display:grid;grid-template-columns:1fr 1fr 1fr;
 gap:30px;padding:35px 20px 20px;font-size:11px
}
.signature{border-top:1px solid #475569;padding-top:7px}

/* MODAL */
.modal{
 position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:2000;
 display:flex;align-items:center;justify-content:center;padding:20px
}
.modal-card{
 background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;
 border-radius:16px;padding:22px
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h3{margin:0}
.close{border:0;background:#f1f5f9;border-radius:8px;width:34px;height:34px}

/* ASSISTANT */
.chat{
 background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;
 max-width:950px
}
.chat-messages{height:430px;overflow-y:auto;padding:18px;background:#f8fafc}
.msg{display:flex;margin-bottom:14px}
.msg.user{justify-content:flex-end}
.bubble{
 max-width:78%;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.55
}
.msg.assistant .bubble{background:#fff;border:1px solid var(--border)}
.msg.user .bubble{background:var(--green);color:#fff}
.chat-input{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input textarea{min-height:45px;height:45px;resize:none}

/* MOBILE */
@media(max-width:1050px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .register-toolbar{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:800px){
 .sidebar{transform:translateX(-100%);width:270px}
 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0;width:100%}
 .menu-toggle{display:block}
 .topbar{padding:0 14px}
 .content{padding:15px}
 .two,.three{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr 1fr}
 .page-head{flex-direction:column}
 .register-toolbar{grid-template-columns:1fr 1fr}
 .register-meta{grid-template-columns:1fr 1fr}
}
@media(max-width:500px){
 .grid{grid-template-columns:1fr}
 .register-toolbar{grid-template-columns:1fr}
 .topbar-title{font-size:15px}
 .content{padding:10px}
 .card{padding:13px}
}

/* PRINT */
@media print{
 body{background:#fff!important}
 .sidebar,.topbar,.no-print,.modal{display:none!important}
 .main{margin:0;width:100%}
 .content{padding:0!important;max-width:none}
 .page-head,.register-toolbar{display:none!important}
 .register-shell{border:0;box-shadow:none;overflow:visible}
 .register-table{min-width:0}
 .register-header{min-width:0}
 .register-sign{min-width:0}
 @page{size:A4 landscape;margin:7mm}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="logo">GKA</div>
    <h1>Global Kids Academy Sokoto</h1>
    <div class="sub">School Academic Management System</div>

    <div class="form-group">
      <label>Username</label>
      <input id="loginUsername" autocomplete="username" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password">
    </div>

    <div class="form-group">
      <label>Login Type</label>
      <select id="loginRole">
        <option value="Admin">Admin</option>
        <option value="Teacher">Teacher</option>
        <option value="Student">Student</option>
        <option value="Parent">Parent</option>
      </select>
    </div>

    <button class="btn btn-primary btn-block" onclick="login()">Sign In</button>

    <div id="loginError" class="hidden" style="color:#b91c1c;font-size:12px;margin-top:12px;text-align:center"></div>

    <div class="demo-box">
      <strong>Prototype administrator:</strong><br>
      Username: <b>Admin</b><br>
      Password: <b>Admin@2026!</b>
    </div>
  </div>
</div>

<!-- APPLICATION -->
<div id="app" class="app hidden">

<aside id="sidebar" class="sidebar">
  <div class="brand">
    <div class="brand-logo">G</div>
    <div>
      <div class="brand-title">Global Kids Academy</div>
      <div class="brand-sub">Sokoto • Academic System</div>
    </div>
  </div>

  <div class="nav-section">Main</div>
  <button class="nav-btn active" data-page="dashboard" onclick="showPage('dashboard')">
    <span class="nav-icon">⌂</span> Dashboard
  </button>

  <div class="nav-section">Users</div>
  <button class="nav-btn admin-only" data-page="users" onclick="showPage('users')">
    <span class="nav-icon">👥</span> User Management
  </button>

  <div class="nav-section">Academic</div>
  <button class="nav-btn" data-page="setup" onclick="showPage('setup')">
    <span class="nav-icon">⚙</span> Academic Setup
  </button>
  <button class="nav-btn" data-page="attendance" onclick="showPage('attendance')">
    <span class="nav-icon">✓</span> Attendance Register
  </button>
  <button class="nav-btn" data-page="results" onclick="showPage('results')">
    <span class="nav-icon">▣</span> Results
  </button>

  <div class="nav-section">Academic Documents</div>
  <button class="nav-btn" data-page="documents" onclick="showPage('documents')">
    <span class="nav-icon">▤</span> Academic Documents
  </button>
  <button class="nav-btn" data-page="approval" onclick="showPage('approval')">
    <span class="nav-icon">✓</span> Approval Centre
  </button>
  <button class="nav-btn" data-page="archive" onclick="showPage('archive')">
    <span class="nav-icon">▥</span> Approved Work Archive
  </button>

  <div class="nav-section">Portals</div>
  <button class="nav-btn" data-page="studentPortal" onclick="showPage('studentPortal')">
    <span class="nav-icon">🎓</span> Student Portal
  </button>
  <button class="nav-btn" data-page="parentPortal" onclick="showPage('parentPortal')">
    <span class="nav-icon">👨‍👩‍👧</span> Parent Portal
  </button>

  <div class="nav-section">Tools</div>
  <button class="nav-btn" data-page="assistant" onclick="showPage('assistant')">
    <span class="nav-icon">🤖</span> Teacher Assistant
  </button>
  <button class="nav-btn admin-only" data-page="audit" onclick="showPage('audit')">
    <span class="nav-icon">◷</span> Audit History
  </button>
  <button class="nav-btn admin-only" data-page="backup" onclick="showPage('backup')">
    <span class="nav-icon">↕</span> Backup & Recovery
  </button>
  <button class="nav-btn admin-only" data-page="settings" onclick="showPage('settings')">
    <span class="nav-icon">⚙</span> Settings
  </button>

  <div class="nav-section">Account</div>
  <button class="nav-btn" data-page="password" onclick="showPage('password')">
    <span class="nav-icon">🔐</span> Change Password
  </button>
  <button class="nav-btn" onclick="logout()">
    <span class="nav-icon">↪</span> Logout
  </button>
</aside>

<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="topTitle">Dashboard</div>
    </div>

    <div class="user-pill">
      <div class="avatar" id="avatar">A</div>
      <span id="currentUser">Admin</span>
    </div>
  </header>

  <div id="content" class="content"></div>
</main>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
 <div class="modal-card">
   <div class="modal-head">
     <h3 id="modalTitle">Form</h3>
     <button class="close" onclick="closeModal()">×</button>
   </div>
   <div id="modalBody"></div>
 </div>
</div>

<script>
/* =========================================================
   GLOBAL KIDS ACADEMY SOKOTO
   LOCAL / PROTOTYPE DATABASE
   ========================================================= */

const APP_NAME="Global Kids Academy Sokoto";
const DB_KEY="GKA_V8_LOCAL_DATABASE";
const RECOVERY_KEY="GKA_V8_RECOVERY_SNAPSHOT";

let db=null;
let currentUser=null;
let currentPage="dashboard";

const defaultDB={
 schemaVersion:8,
 settings:{
   schoolName:APP_NAME,
   motto:"Knowledge, Character and Excellence",
   address:"Sokoto State, Nigeria",
   phone:"",
   email:"",
   session:"2026/2027",
   term:"First Term",
   language:"English"
 },
 users:[
   {
     id:"u-admin",
     username:"Admin",
     password:"Admin@2026!",
     role:"Admin",
     name:"School Administrator",
     active:true
   },
   {
     id:"u-teacher",
     username:"teacher",
     password:"Teacher@2026!",
     role:"Teacher",
     name:"Demo Teacher",
     active:true
   },
   {
     id:"u-student",
     username:"student",
     password:"Student@2026!",
     role:"Student",
     name:"Demo Student",
     active:true
   },
   {
     id:"u-parent",
     username:"parent",
     password:"Parent@2026!",
     role:"Parent",
     name:"Demo Parent",
     active:true
   }
 ],
 classes:[
   {id:"c1",name:"JSS 1",arm:"A"},
   {id:"c2",name:"JSS 1",arm:"B"},
   {id:"c3",name:"JSS 2",arm:"A"},
   {id:"c4",name:"JSS 3",arm:"A"},
   {id:"c5",name:"SS 1",arm:"A"}
 ],
 subjects:[
   {id:"s1",name:"Mathematics",hod:""},
   {id:"s2",name:"English Language",hod:""},
   {id:"s3",name:"Physics",hod:""},
   {id:"s4",name:"Chemistry",hod:""},
   {id:"s5",name:"Biology",hod:""},
   {id:"s6",name:"Economics",hod:""},
   {id:"s7",name:"Hausa",hod:""},
   {id:"s8",name:"Arabic",hod:""},
   {id:"s9",name:"French",hod:""}
 ],
 students:[],
 parents:[],
 attendance:[],
 results:[],
 documents:[],
 audit:[]
};

function clone(x){return JSON.parse(JSON.stringify(x));}

function loadDB(){
 try{
   const raw=localStorage.getItem(DB_KEY);
   db=raw?JSON.parse(raw):clone(defaultDB);
 }catch(e){
   db=clone(defaultDB);
 }
 if(!db.schemaVersion)db.schemaVersion=8;
 if(!db.settings)db.settings=clone(defaultDB.settings);
 if(!db.users)db.users=[];
 if(!db.classes)db.classes=[];
 if(!db.subjects)db.subjects=[];
 if(!db.students)db.students=[];
 if(!db.parents)db.parents=[];
 if(!db.attendance)db.attendance=[];
 if(!db.results)db.results=[];
 if(!db.documents)db.documents=[];
 if(!db.audit)db.audit=[];
 saveDB(false);
}

function saveDB(snapshot=true){
 localStorage.setItem(DB_KEY,JSON.stringify(db));
 if(snapshot){
   try{localStorage.setItem(RECOVERY_KEY,JSON.stringify(db));}catch(e){}
 }
}

function uid(prefix){
 return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 })[m]);
}

function now(){
 return new Date().toLocaleString("en-NG");
}

function audit(action,details=""){
 if(!db)return;
 db.audit.unshift({
   id:uid("audit"),
   user:currentUser?currentUser.username:"System",
   role:currentUser?currentUser.role:"System",
   action,
   details,
   date:now()
 });
 db.audit=db.audit.slice(0,2000);
 saveDB();
}

function roleAllowed(roles){
 return roles.includes(currentUser?.role);
}

/* LOGIN */

function login(){
 const username=document.getElementById("loginUsername").value.trim();
 const password=document.getElementById("loginPassword").value;
 const role=document.getElementById("loginRole").value;
 const error=document.getElementById("loginError");

 const user=db.users.find(u=>
   u.username.toLowerCase()===username.toLowerCase() &&
   u.password===password &&
   u.role===role &&
   u.active!==false
 );

 if(!user){
   error.textContent="Invalid username, password or login type.";
   error.classList.remove("hidden");
   return;
 }

 currentUser=clone(user);
 localStorage.setItem("GKA_SESSION_USER",JSON.stringify(currentUser));

 error.classList.add("hidden");
 document.getElementById("loginScreen").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 document.getElementById("currentUser").textContent=currentUser.name||currentUser.username;
 document.getElementById("avatar").textContent=(currentUser.name||currentUser.username).charAt(0).toUpperCase();

 applyRoleUI();
 audit("Login","Successful login");
 showPage("dashboard");
}

function restoreSession(){
 const saved=localStorage.getItem("GKA_SESSION_USER");
 if(!saved)return;
 try{
   currentUser=JSON.parse(saved);
   if(db.users.some(u=>u.id===currentUser.id&&u.active!==false)){
     document.getElementById("loginScreen").classList.add("hidden");
     document.getElementById("app").classList.remove("hidden");
     document.getElementById("currentUser").textContent=currentUser.name||currentUser.username;
     document.getElementById("avatar").textContent=(currentUser.name||currentUser.username).charAt(0).toUpperCase();
     applyRoleUI();
     showPage("dashboard");
   }
 }catch(e){}
}

function logout(){
 audit("Logout","User logged out");
 localStorage.removeItem("GKA_SESSION_USER");
 currentUser=null;
 document.getElementById("app").classList.add("hidden");
 document.getElementById("loginScreen").classList.remove("hidden");
}

function applyRoleUI(){
 document.querySelectorAll(".admin-only").forEach(el=>{
   el.classList.toggle("hidden",currentUser?.role!=="Admin");
 });
}

/* NAVIGATION */

const pageTitles={
 dashboard:"Dashboard",
 users:"User Management",
 setup:"Academic Setup",
 attendance:"Attendance Register",
 results:"Results Management",
 documents:"Academic Documents",
 approval:"Approval Centre",
 archive:"Approved Work Archive",
 studentPortal:"Student Portal",
 parentPortal:"Parent Portal",
 assistant:"Teacher Assistant",
 audit:"Audit History",
 backup:"Backup & Recovery",
 settings:"School Settings",
 password:"Change Password"
};

function showPage(page){
 if(pageTitles[page]===undefined)return;

 const adminPages=["users","audit","backup","settings"];

function saveUser(e,id){
 e.preventDefault();
 const existing=id?db.users.find(u=>u.id===id):null;
 const username=document.getElementById("uUsername").value.trim();

 if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()&&u.id!==id)){
  alert("Username already exists.");
  return;
 }

 if(existing){
  existing.name=document.getElementById("uName").value.trim();
  existing.username=username;
  existing.role=document.getElementById("uRole").value;
  existing.active=document.getElementById("uActive").checked;
  const p=document.getElementById("uPassword").value;
  if(p)existing.password=p;
  audit("Edit User",username);
 }else{
  db.users.push({
   id:uid("user"),
   name:document.getElementById("uName").value.trim(),
   username,
   role:document.getElementById("uRole").value,
   password:document.getElementById("uPassword").value,
   active:document.getElementById("uActive").checked
  });
  audit("Create User",username);
 }

 saveDB();
 closeModal();
 showPage("users");
}

function initRegister(){

 if(!classSelect)return;

 const selected=classSelect.value;
 if(!selected){

  `<div class="empty">Select a class and click <b>Load Register</b>.</div>`;

 const [className,arm]=selected.split("|");
 const month=parseInt(document.getElementById("regMonth").value||0);
 const mode=document.getElementById("regMode").value;
 const year=parseInt((document.getElementById("regSession").value||"2026/2027").slice(0,4))||new Date().getFullYear();

 const days=new Date(year,month+1,0).getDate();
 const students=db.students.filter(s=>s.className===className&&s.arm===arm);

 const titleMode=
  mode==="morning"?"Morning Attendance Register":
  mode==="afternoon"?"Afternoon Attendance Register":
  "Class Attendance Register";

 let html=`
 <div class="register-shell">
  <div class="register-header">
   <h1>${esc(APP_NAME)}</h1>
   <h2>${titleMode}</h2>
   <div class="register-meta">
    <div><b>Academic Session:</b> ${esc(document.getElementById("regSession").value)}</div>
    <div><b>Term:</b> ${esc(document.getElementById("regTerm").value)}</div>
    <div><b>Class:</b> ${esc(className)}</div>
    <div><b>Arm:</b> ${esc(arm)}</div>
    <div><b>Month:</b> ${new Date(year,month,1).toLocaleString("en-US",{month:"long"})}</div>
    <div><b>Class Teacher:</b> ____________________</div>
    <div><b>School:</b> ${esc(APP_NAME)}</div>
    <div><b>Mode:</b> ${esc(titleMode)}</div>
   </div>
  </div>

  <table class="register-table">
   <thead>
    <tr>
     <th rowspan="2">S/N</th>
     <th rowspan="2" class="adm">Admission No.</th>
     <th rowspan="2" class="name">Student Name</th>
     ${Array.from({length:days},(_,i)=>`<th class="day-head">${i+1}</th>`).join("")}
     <th rowspan="2">Present</th>
     <th rowspan="2">Absent</th>
     <th rowspan="2">%</th>
     <th rowspan="2">Remarks</th>
    </tr>
    <tr>
     ${Array.from({length:days},()=>`<th class="day-head">P/A</th>`).join("")}
    </tr>
   </thead>
   <tbody>
 `;

 if(!students.length){
   html+=`<tr><td colspan="${days+7}" style="padding:30px;text-align:center">No students are registered in this class.</td></tr>`;
 }else{
   students.forEach((s,index)=>{
     const stats=getAttendanceStats(s.id,year,month,mode,days);
     html+=`
      <tr>
       <td>${index+1}</td>
       <td class="adm">${esc(s.admissionNo)}</td>
       <td class="name">${esc(s.name)}</td>
       ${Array.from({length:days},(_,i)=>{
         const val=getAttendanceValue(s.id,year,month,i+1,mode);
         return `<td>
           <button class="att-btn ${val==="P"?"p":val==="A"?"a":""}"
            onclick="cycleAttendance('${s.id}',${year},${month},${i+1},'${mode}')">
            ${val||""}
           </button>
         </td>`
       }).join("")}
       <td class="att-total">${stats.present}</td>
       <td class="att-total">${stats.absent}</td>
       <td class="att-total">${stats.percent}%</td>
       <td>${stats.percent>=75?"Satisfactory":stats.present===0?"":"Monitor"}</td>
      </tr>
     `;
   });
 }

 html+=`
   </tbody>
   <tfoot>
    <tr>
     <td colspan="3"><b>Monthly Class Summary</b></td>
     <td colspan="${days}" style="text-align:left">
       <b>P = Present &nbsp;&nbsp; A = Absent &nbsp;&nbsp; Blank = Not Recorded</b>
     </td>
     <td colspan="4"></td>
    </tr>
   </tfoot>
  </table>

  <div class="register-sign">
   <div class="signature">Class Teacher's Signature / Date</div>
   <div class="signature">Head Teacher / Principal's Verification</div>
   <div class="signature">Attendance Officer / School Stamp</div>
  </div>
 </div>
 `;

 document.getElementById("registerContainer").innerHTML=html;
}

function getAttendanceValue(studentId,year,month,day,mode){
 const key=attendanceKey(studentId,year,month,day);
 const record=db.attendance.find(a=>a.key===key);
 if(!record)return "";

 if(mode==="morning")return record.morning||"";
 if(mode==="afternoon")return record.afternoon||"";

 if(record.morning==="A"||record.afternoon==="A")return "A";
 if(record.morning==="P"||record.afternoon==="P")return "P";
 return "";
}

function attendanceKey(studentId,year,month,day){
 return `${studentId}_${year}_${month}_${day}`;
}

function cycleAttendance(studentId,year,month,day,mode){
 if(!["Admin","Teacher"].includes(currentUser.role)){
  alert("Only Admin or Teacher can mark attendance.");
  return;
 }

 const key=attendanceKey(studentId,year,month,day);
 let r=db.attendance.find(a=>a.key===key);

 if(!r){
  r={id:uid("att"),key,studentId,year,month,day,morning:"",afternoon:""};
  db.attendance.push(r);
 }

 const field=mode==="morning"?"morning":
             mode==="afternoon"?"afternoon":null;

 if(field){
  r[field]=r[field]===""?"P":r[field]==="P"?"A":"";
 }else{
  /* Combined mode changes both together */
  if(r.morning===""&&r.afternoon===""){
   r.morning="P";r.afternoon="P";
  }else if(r.morning==="P"&&r.afternoon==="P"){
   r.morning="A";r.afternoon="A";
  }else{
   r.morning="";r.afternoon="";
  }
 }

 saveDB();
 initRegister();
}

function getAttendanceStats(studentId,year,month,mode,days){
 let present=0,absent=0;

 for(let d=1;d<=days;d++){
  const val=getAttendanceValue(studentId,year,month,d,mode);
  if(val==="P")present++;
  if(val==="A")absent++;
 }

 const recorded=present+absent;
 const percent=recorded?((present/recorded)*100).toFixed(1):"0.0";
 return {present,absent,percent};
}

function clearCurrentMonth(){

 const ids=db.students.filter(s=>s.className===className&&s.arm===arm).map(s=>s.id);

 db.attendance=db.attendance.filter(a=>!(ids.includes(a.studentId)&&a.year===year&&a.month===month));
 saveDB();audit("Clear Attendance",`${className} ${arm}`);
 initRegister();
}

function gradeFor(total){

 if(total>=65)return ["B","Very Good"];
 if(total>=55)return ["C","Good"];

 if(total>=40)return ["E","Fair"];
 return ["F","Fail"];
}

}

     ${db.audit.map(a=>`
      <tr><td>${esc(a.date)}</td><td>${esc(a.user)}</td><td>${esc(a.role)}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>
     `).join("")||`<tr><td colspan="5" class="empty">No audit activity.</td></tr>`}
    </tbody>
   </table>
  </div>
 </div>
 `;
}

/* BACKUP */

function renderBackup(){
 return `
 <div class="page-head">
  <div><h2>Backup & Recovery</h2><p>Export or restore the local school database.</p></div>
 </div>

 <div class="two">
  <div class="card">
   <h3 class="section-title">Create Backup</h3>
   <p style="font-size:13px;color:#64748b">
    Download a complete JSON copy of the current local database.
   </p>
   <button class="btn btn-primary" onclick="downloadBackup()">Download Backup</button>
   <button class="btn" onclick="createRecoverySnapshot()">Create Recovery Snapshot</button>
  </div>

  <div class="card">
   <h3 class="section-title">Restore Backup</h3>
   <p style="font-size:13px;color:#64748b">
    Restore a previously exported JSON database.
   </p>
   <input id="restoreFile" type="file" accept=".json">
   <button class="btn btn-warning" onclick="restoreBackup()" style="margin-top:10px">Restore Database</button>
  </div>
 </div>
 `;
}

function downloadBackup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="global-kids-academy-backup.json";
 a.click();
 URL.revokeObjectURL(a.href);
 audit("Backup","Database exported");
}

function createRecoverySnapshot(){
 localStorage.setItem(RECOVERY_KEY,JSON.stringify(db));
 audit("Recovery Snapshot","Manual snapshot created");
 alert("Recovery snapshot created successfully.");
}

function restoreBackup(){
 const file=document.getElementById("restoreFile").files[0];
 if(!file)return alert("Select a backup JSON file.");

 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const imported=JSON.parse(reader.result);
   if(!imported.schemaVersion||!imported.users||!imported.settings){
    throw new Error("Invalid database");
   }

   if(!confirm("Restore this database? Current local data will be replaced."))return;

   db=imported;
   saveDB();
   audit("Restore","Database restored from backup");
   alert("Database restored successfully.");
   location.reload();
  }catch(e){
   alert("Invalid backup file.");
  }
 };
 reader.readAsText(file);
}

/* PASSWORD */

function renderPassword(){
 return `
 <div class="page-head">
  <div><h2>Change Password</h2><p>Change the password for the currently logged-in account.</p></div>
 </div>
 <div class="card" style="max-width:600px">
  <form onsubmit="changePassword(event)">
   <div class="form-group"><label>Current Password</label><input id="oldPass" type="password" required></div>
   <div class="form-group"><label>New Password</label><input id="newPass" type="password" minlength="8" required></div>
   <div class="form-group"><label>Confirm New Password</label><input id="confirmPass" type="password" required></div>
   <button class="btn btn-primary">Change Password</button>
  </form>
 </div>
 `;
}

function changePassword(e){
 e.preventDefault();
 const old=document.getElementById("oldPass").value;
 const n=document.getElementById("newPass").value;
 const c=document.getElementById("confirmPass").value;

 const user=db.users.find(u=>u.id===currentUser.id);
 if(!user||user.password!==old)return alert("Current password is incorrect.");
 if(n!==c)return alert("New passwords do not match.");
 if(n.length<8)return alert("Password must contain at least 8 characters.");

 user.password=n;
 currentUser=clone(user);
 localStorage.setItem("GKA_SESSION_USER",JSON.stringify(currentUser));
 saveDB();audit("Password Change",user.username);
 alert("Password changed successfully.");
}
