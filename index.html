<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#14532d">

<title>Caliphate Tarbiya Academy | School Management System</title>

<style>
:root{
--green:#14532d;
--green2:#166534;
--light:#f0fdf4;
--bg:#f5f7f6;
--white:#fff;
--text:#172033;
--muted:#64748b;
--border:#dbe3df;
--red:#b91c1c;
--orange:#b45309;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
}

button,input,select,textarea{
font:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}

/* LOGIN */

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(135deg,#052e16,#166534);
}

.login-box{
width:100%;
max-width:470px;
background:white;
padding:28px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.logo{
width:65px;
height:65px;
border-radius:16px;
background:var(--green);
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:22px;
margin-bottom:15px;
}

.login-box h1{
font-size:25px;
margin-bottom:5px;
}

.subtitle{
color:var(--muted);
margin-bottom:20px;
}

.login-tabs{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-bottom:20px;
}

.login-tabs button{
border:0;
padding:11px 5px;
border-radius:8px;
background:#e8eeeb;
color:#173024;
font-size:12px;
font-weight:bold;
}

.login-tabs button.active{
background:var(--green);
color:white;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin:12px 0 6px;
}

input,select,textarea{
width:100%;
border:1px solid var(--border);
border-radius:9px;
padding:11px;
background:white;
outline:none;
}

textarea{
min-height:120px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--green);
}

.btn{
border:0;
background:var(--green);
color:white;
padding:10px 15px;
border-radius:9px;
font-weight:bold;
}

.btn:hover{
background:var(--green2);
}

.btn-danger{
background:var(--red);
}

.btn-orange{
background:var(--orange);
}

.btn-light{
background:#e8eeeb;
color:#173024;
}

.full{
width:100%;
margin-top:14px;
}

.small-text{
font-size:12px;
color:var(--muted);
margin-top:12px;
line-height:1.5;
}

/* APP */

.topbar{
height:64px;
background:var(--green);
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
position:sticky;
top:0;
z-index:100;
}

.top-left{
display:flex;
align-items:center;
gap:10px;
}

.menu-button{
display:none;
border:0;
background:transparent;
color:white;
font-size:25px;
}

.layout{
display:grid;
grid-template-columns:250px 1fr;
min-height:calc(100vh - 64px);
}

.sidebar{
background:#052e16;
color:white;
padding:15px;
position:sticky;
top:64px;
height:calc(100vh - 64px);
overflow-y:auto;
}

.sidebar-title{
font-size:12px;
color:#bbf7d0;
padding:10px;
text-transform:uppercase;
}

.nav button{
display:block;
width:100%;
border:0;
background:transparent;
color:#dcfce7;
padding:12px;
text-align:left;
border-radius:8px;
margin-bottom:3px;
}

.nav button:hover,
.nav button.active{
background:#166534;
color:white;
}

.content{
padding:20px;
max-width:1500px;
width:100%;
margin:auto;
}

.page{
display:none;
}

.page.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-top:15px;
}

.card{
background:white;
border:1px solid var(--border);
border-radius:14px;
padding:17px;
box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.card-title{
font-size:13px;
color:var(--muted);
}

.card-number{
font-size:30px;
font-weight:bold;
margin-top:7px;
color:var(--green);
}

.panel{
background:white;
border:1px solid var(--border);
border-radius:14px;
padding:18px;
margin-top:15px;
}

.grid2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.grid3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}

.table-wrap{
overflow:auto;
margin-top:15px;
}

table{
width:100%;
border-collapse:collapse;
min-width:700px;
}

th,td{
border-bottom:1px solid var(--border);
padding:10px;
text-align:left;
}

th{
background:#f8faf9;
}

.badge{
display:inline-block;
padding:4px 9px;
border-radius:20px;
font-size:11px;
font-weight:bold;
background:#dcfce7;
color:#166534;
}

.badge-warning{
background:#fef3c7;
color:#92400e;
}

.badge-danger{
background:#fee2e2;
color:#991b1b;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:300;
align-items:center;
justify-content:center;
padding:15px;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:800px;
max-height:90vh;
overflow:auto;
background:white;
border-radius:16px;
padding:20px;
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.close{
border:0;
background:#fee2e2;
color:#991b1b;
border-radius:8px;
padding:7px 10px;
}

.toast{
position:fixed;
right:15px;
bottom:15px;
background:#111827;
color:white;
padding:12px 16px;
border-radius:9px;
display:none;
z-index:500;
}

.toast.show{
display:block;
}

.empty{
text-align:center;
padding:25px;
color:var(--muted);
}

.stat-icon{
font-size:24px;
}

@media(max-width:950px){

.cards{
grid-template-columns:repeat(2,1fr);
}

.layout{
grid-template-columns:1fr;
}

.sidebar{
position:fixed;
left:-260px;
top:64px;
width:250px;
z-index:200;
transition:.25s;
}

.layout.sidebar-open .sidebar{
left:0;
}

.menu-button{
display:block;
}

.grid3{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:600px){

.login-tabs{
grid-template-columns:repeat(2,1fr);
}

.cards,
.grid2,
.grid3{
grid-template-columns:1fr;
}

.content{
padding:12px;
}

.topbar{
padding:0 10px;
}

.logout-text{
display:none;
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen" class="login">

<div class="login-box">

<div class="logo">CTA</div>

<h1>Caliphate Tarbiya Academy</h1>

<p class="subtitle">
School Academic Management System
</p>

<div class="login-tabs">

<button class="active" data-role="admin"
onclick="selectLoginRole('admin',this)">
Administrator
</button>

<button data-role="teacher"
onclick="selectLoginRole('teacher',this)">
Teacher
</button>

<button data-role="student"
onclick="selectLoginRole('student',this)">
Student
</button>

<button data-role="parent"
onclick="selectLoginRole('parent',this)">
Parent
</button>

</div>

<div id="loginForm">

<label>Email / Username / ID</label>
<input id="loginId" autocomplete="username">

<label>Password</label>
<input id="loginPassword"
type="password"
autocomplete="current-password">

<button class="btn full"
onclick="login()">
Sign In
</button>

<p class="small-text">
Accounts are created and managed by the Administrator.
</p>

</div>

</div>
</section>


<!-- APPLICATION -->

<section id="appScreen" class="hidden">

<header class="topbar">

<div class="top-left">

<button class="menu-button"
onclick="toggleSidebar()">
☰
</button>

<div>
<strong>Caliphate Tarbiya Academy</strong>
</div>

</div>

<div>

<span id="currentUserName"></span>

<button class="btn btn-light"
onclick="logout()"
style="margin-left:8px">
<span class="logout-text">Logout</span>
↪
</button>

</div>

</header>


<div id="mainLayout" class="layout">

<aside class="sidebar">

<div class="sidebar-title">
Main Menu
</div>

<nav id="navigation" class="nav"></nav>

</aside>


<main class="content">

<!-- DASHBOARD -->

<section id="page-dashboard" class="page active">
</section>


<!-- ACCOUNT MANAGEMENT -->

<section id="page-accounts" class="page">
</section>


<!-- TEACHERS -->

<section id="page-teachers" class="page">
</section>


<!-- STUDENTS -->

<section id="page-students" class="page">
</section>


<!-- PARENTS -->

<section id="page-parents" class="page">
</section>


<!-- CLASSES -->

<section id="page-classes" class="page">
</section>


<!-- ATTENDANCE -->

<section id="page-attendance" class="page">
</section>


<!-- DOCUMENTS -->

<section id="page-documents" class="page">
</section>


<!-- TEACHER ASSISTANT -->

<section id="page-assistant" class="page">
</section>


<!-- APPROVALS -->

<section id="page-approvals" class="page">
</section>


<!-- RESULTS -->

<section id="page-results" class="page">
</section>


<!-- STUDENT/PARENT PORTAL -->

<section id="page-portal" class="page">
</section>


<!-- SETTINGS -->

<section id="page-settings" class="page">
</section>

</main>

</div>

</section>


<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h3 id="modalTitle">Form</h3>

<button class="close"
onclick="closeModal()">
✕
</button>

</div>

<div id="modalBody"></div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =====================================================
DATABASE
===================================================== */

const DB_KEY = "CTA_ACADEMY_V8_DB";
const SESSION_KEY = "CTA_ACADEMY_V8_SESSION";

let loginRole = "admin";

const defaultDB = {

users:[

{
id:"admin1",
role:"admin",
name:"School Administrator",
email:"admin@cta.local",
username:"admin",
password:"demo-admin",
status:"approved"
},

{
id:"teacher1",
role:"teacher",
name:"Mathematics Teacher",
email:"teacher@cta.local",
username:"teacher",
password:"demo-teacher",
passwordChange:false,
status:"approved",
staffId:"T001",
subjects:["Mathematics"],
classes:["JSS1"],
hodSubject:"Mathematics",
examOfficer:false
},

{
id:"teacher2",
role:"teacher",
name:"English Teacher",
email:"english@cta.local",
username:"english",
password:"demo-teacher",
status:"approved",
staffId:"T002",
subjects:["English"],
classes:["JSS1"],
hodSubject:"",
examOfficer:true
},

{
id:"student1",
role:"student",
name:"Demo Student",
email:"student@cta.local",
username:"student",
password:"demo-student",
status:"approved",
studentId:"CTA/001",
className:"JSS1"
},

{
id:"parent1",
role:"parent",
name:"Demo Parent",
email:"parent@cta.local",
username:"parent",
password:"demo-parent",
status:"approved",
children:["student1"]
}

],

classes:[
{
id:"class1",
name:"JSS1",
section:"A",
session:"2026/2027"
},
{
id:"class2",
name:"JSS2",
section:"A",
session:"2026/2027"
},
{
id:"class3",
name:"SS1",
section:"A",
session:"2026/2027"
}
],

subjects:[
"Mathematics",
"English",
"Physics",
"Chemistry",
"Biology",
"Economics",
"Hausa",
"Arabic",
"French",
"Computer Studies",
"Basic Science",
"Basic Technology",
"Social Studies",
"Civic Education",
"Islamic Religious Studies",
"Christian Religious Studies"
],

attendance:[],
documents:[],
submissions:[],
results:[],
activity:[]

};


/* =====================================================
DATABASE FUNCTIONS
===================================================== */

function getDB(){

let data=localStorage.getItem(DB_KEY);

if(!data){

localStorage.setItem(
DB_KEY,
JSON.stringify(defaultDB)
);

return JSON.parse(
JSON.stringify(defaultDB)
);

}

return JSON.parse(data);

}


function saveDB(data){

localStorage.setItem(
DB_KEY,
JSON.stringify(data)
);

}


function currentSession(){

return JSON.parse(
localStorage.getItem(SESSION_KEY)||"null"
);

}


function currentUser(){

let s=currentSession();

if(!s)return null;

return getDB().users.find(
u=>u.id===s.id
);

}


function generateID(prefix){

return prefix+"_"+Date.now()+"_"+Math.random()
.toString(36)
.substring(2,7);

}


function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
LOGIN
===================================================== */

function selectLoginRole(role,button){

loginRole=role;

document
.querySelectorAll(".login-tabs button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

}


function login(){

let identifier=document
.getElementById("loginId")
.value
.trim()
.toLowerCase();

let password=document
.getElementById("loginPassword")
.value;

let db=getDB();

let user=db.users.find(u=>{

return u.role===loginRole &&
(
(u.email||"").toLowerCase()===identifier ||
(u.username||"").toLowerCase()===identifier ||
(u.staffId||"").toLowerCase()===identifier ||
(u.studentId||"").toLowerCase()===identifier
);

});


if(!user){

showToast(
"Account not found for this login type."
);

return;

}


if(user.password!==password){

showToast("Incorrect password.");

return;

}


if(user.status!=="approved"){

showToast(
"Your account has not been approved by the Administrator."
);

return;

}


localStorage.setItem(
SESSION_KEY,
JSON.stringify({
id:user.id,
role:user.role
})
);

addActivity(
"Logged in",
user.name
);

openApplication();

}


function logout(){

localStorage.removeItem(SESSION_KEY);

location.reload();

}


/* =====================================================
APPLICATION
===================================================== */

function openApplication(){

let user=currentUser();

if(!user)return;

document
.getElementById("loginScreen")
.classList.add("hidden");

document
.getElementById("appScreen")
.classList.remove("hidden");

document
.getElementById("currentUserName")
.textContent=
user.name+" · "+
user.role.toUpperCase();

buildNavigation();

showPage("dashboard");

}


function toggleSidebar(){

document
.getElementById("mainLayout")
.classList.toggle("sidebar-open");

}


function buildNavigation(){

let user=currentUser();

let html="";

html+=navButton(
"dashboard",
"📊 Dashboard"
);


if(user.role==="admin"){

html+=navButton(
"accounts",
"👥 Account Management"
);

html+=navButton(
"teachers",
"👨‍🏫 Teacher Management"
);

html+=navButton(
"students",
"🎓 Student Management"
);

html+=navButton(
"parents",
"👨‍👩‍👧 Parent Management"
);

html+=navButton(
"classes",
"🏫 Classes & Subjects"
);

html+=navButton(
"attendance",
"📝 Attendance"
);

html+=navButton(
"documents",
"📚 Academic Documents"
);

html+=navButton(
"approvals",
"✅ Approval Centre"
);

html+=navButton(
"results",
"📈 Results"
);

html+=navButton(
"settings",
"⚙️ Settings"
);

}


if(user.role==="teacher"){

html+=navButton(
"attendance",
"📝 Attendance"
);

html+=navButton(
"documents",
"📚 My Documents"
);

html+=navButton(
"assistant",
"🤖 Teacher Assistant"
);

if(user.hodSubject ||
user.examOfficer){

html+=navButton(
"approvals",
"🛡️ HOD / Exam Officer"
);

}

html+=navButton(
"results",
"📈 Results"
);

}


if(user.role==="student" ||
user.role==="parent"){

html+=navButton(
"portal",
"🎓 My Portal"
);

html+=navButton(
"attendance",
"📝 Attendance"
);

html+=navButton(
"results",
"📈 Results"
);

}


document
.getElementById("navigation")
.innerHTML=html;

}


function navButton(page,text){

return `
<button onclick="showPage('${page}',this)">
${text}
</button>
`;

}


function showPage(page,button){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

let target=document
.getElementById("page-"+page);

if(target){

target.classList.add("active");

}

document
.querySelectorAll(".nav button")
.forEach(b=>b.classList.remove("active"));

if(button){

button.classList.add("active");

}

document
.getElementById("mainLayout")
.classList.remove("sidebar-open");


const renderers={

dashboard:renderDashboard,
accounts:renderAccounts,
teachers:renderTeachers,
students:renderStudents,
parents:renderParents,
classes:renderClasses,
attendance:renderAttendance,
documents:renderDocuments,
assistant:renderAssistant,
approvals:renderApprovals,
results:renderResults,
portal:renderPortal,
settings:renderSettings

};

if(renderers[page]){

renderers[page]();

}

}


/* =====================================================
DASHBOARD
===================================================== */

function renderDashboard(){

let db=getDB();

let user=currentUser();

let studentCount=db.users.filter(
u=>u.role==="student"
).length;

let teacherCount=db.users.filter(
u=>u.role==="teacher"
).length;

let parentCount=db.users.filter(
u=>u.role==="parent"
).length;

let pending=db.users.filter(
u=>u.status==="pending"
).length;

let html=`

<h2>Dashboard</h2>

<p style="color:#64748b;margin-top:5px">
Welcome, ${escapeHTML(user.name)}.
</p>

<div class="cards">

<div class="card">
<div class="stat-icon">🎓</div>
<div class="card-title">Students</div>
<div class="card-number">
${studentCount}
</div>
</div>

<div class="card">
<div class="stat-icon">👨‍🏫</div>
<div class="card-title">Teachers</div>
<div class="card-number">
${teacherCount}
</div>
</div>

<div class="card">
<div class="stat-icon">👨‍👩‍👧</div>
<div class="card-title">Parents</div>
<div class="card-number">
${parentCount}
</div>
</div>

<div class="card">
<div class="stat-icon">⏳</div>
<div class="card-title">Pending Accounts</div>
<div class="card-number">
${pending}
</div>
</div>

</div>

<div class="grid2">

<div class="panel">

<h3>Quick Actions</h3>

<div class="actions" style="margin-top:12px">

${
user.role==="admin"
?
`
<button class="btn"
onclick="showPage('accounts')">
Add Account
</button>

<button class="btn"
onclick="showPage('students')">
Register Student
</button>

<button class="btn"
onclick="showPage('teachers')">
Manage Teachers
</button>
`
:
user.role==="teacher"
?
`
<button class="btn"
onclick="showPage('attendance')">
Take Attendance
</button>

<button class="btn"
onclick="showPage('assistant')">
Teacher Assistant
</button>
`
:
`
<button class="btn"
onclick="showPage('portal')">
Open Portal
</button>
`
}

</div>

</div>


<div class="panel">

<h3>Recent Activity</h3>

<div style="margin-top:10px">

${
db.activity.slice(0,8).map(a=>`

<p style="padding:7px 0;border-bottom:1px solid #eee">

<b>${escapeHTML(a.action)}</b>

<br>

<small>
${escapeHTML(a.user)}
·
${new Date(a.date).toLocaleString()}
</small>

</p>

`).join("")
||
"<div class='empty'>No activity yet.</div>"
}

</div>

</div>

</div>
`;

document
.getElementById("page-dashboard")
.innerHTML=html;

}


/* =====================================================
ACCOUNT MANAGEMENT
===================================================== */

function renderAccounts(){

let user=currentUser();

if(user.role!=="admin")return;

let db=getDB();

let html=`

<h2>Account Management</h2>

<div class="panel">

<p>
The Administrator can create and manage all four account types.
</p>

<div class="actions" style="margin-top:12px">

<button class="btn"
onclick="openAccountModal('admin')">
+ Administrator
</button>

<button class="btn"
onclick="openAccountModal('teacher')">
+ Teacher
</button>

<button class="btn"
onclick="openAccountModal('student')">
+ Student
</button>

<button class="btn"
onclick="openAccountModal('parent')">
+ Parent
</button>

</div>

</div>


<div class="panel table-wrap">

<table>

<tr>

<th>Name</th>
<th>Login Type</th>
<th>Email</th>
<th>Username</th>
<th>Status</th>
<th>Actions</th>

</tr>

${
db.users.map(u=>`

<tr>

<td>${escapeHTML(u.name)}</td>

<td>
<span class="badge">
${u.role==="admin"
?"Administrator"
:u.role==="teacher"
?"Teacher"
:u.role==="student"
?"Student"
:"Parent"}
</span>
</td>

<td>${escapeHTML(u.email)}</td>

<td>${escapeHTML(u.username)}</td>

<td>
<span class="${
u.status==="approved"
?"badge"
:"badge badge-warning"
}">
${u.status}
</span>
</td>

<td>

<div class="actions">

${
u.status==="pending"
?

function createAccount(role){

let db=getDB();

let name=document
.getElementById("formName")
.value.trim();

let email=document
.getElementById("formEmail")
.value.trim()
.toLowerCase();

let username=document
.getElementById("formUsername")
.value.trim()
.toLowerCase();

let password=document
.getElementById("formPassword")
.value;

if(!name||!email||!username||!password){

showToast("Complete all required fields.");

return;

}

if(db.users.some(u=>
u.email===email||
u.username===username
)){

showToast(
"Email or username already exists."
);

return;

}

let user={

id:generateID("user"),

role:role,

name:name,

email:email,

username:username,

password:password,

status:"approved"

};


if(role==="teacher"){

user.staffId=
document.getElementById("formStaffId").value;

user.subjects=
document.getElementById("formSubjects")
.value
.split(",")
.map(x=>x.trim())
.filter(Boolean);

user.classes=
document.getElementById("formClasses")
.value
.split(",")
.map(x=>x.trim())
.filter(Boolean);

user.hodSubject=
document.getElementById("formHod").value;

user.examOfficer=
document.getElementById("formExamOfficer")
.value==="true";

}


if(role==="student"){

user.studentId=
document.getElementById("formStudentId").value;

user.className=
document.getElementById("formClass").value;

}


if(role==="parent"){

let child=
document.getElementById("formChild").value;

user.children=child?[child]:[];

}


db.users.push(user);

saveDB(db);

closeModal();

showToast(
roleName(role)+" created successfully."
);

renderAccounts();

addActivity(
"Created "+roleName(role),
currentUser().name
);

}


function roleName(role){

return role==="admin"
?"Administrator"

?"Teacher"

:"Parent";

function loadAttendanceRegister(){

.value;

.getElementById("attendanceDate")
.value;

let students=db.users.filter(
u=>u.role==="student" &&
u.className===className
);

let old=db.attendance.filter(
a=>a.className===className &&
a.date===date
);

document
.getElementById("attendanceRegister")
.innerHTML=`

<div class="actions">

<button class="btn btn-light"
onclick="markAllAttendance('present')">
All Present
</button>

<button class="btn btn-light"
onclick="markAllAttendance('absent')">
All Absent
</button>

onclick="saveAttendance()">
Save Attendance
</button>

</div>

<div class="table-wrap">

<table id="attendanceTable">

<tr>

<th>Present</th>
<th>Absent</th>
<th>Late</th>
<th>Excused</th>

</tr>

${
students.map(s=>{

let oldRecord=old.find(
x=>x.studentId===s.id
);

let status=
oldRecord?.status||"present";

return `

<tr data-student="${s.id}">

<td>
${escapeHTML(s.name)}
</td>

${[
"present",
"absent",
"late",
"excused"
].map(v=>`

name="attendance_${s.id}"
value="${v}"
${status===v?"checked":""}>

</td>

`).join("")}

</tr>

}).join("")

||
`<tr>
<td colspan="5">
No students registered in this class.
</td>
</tr>`

}

</table>

</div>

`;

}


function markAllAttendance(status){

document
.querySelectorAll(
"#attendanceTable input[type=radio]"
)
.forEach(input=>{
input.checked=
input.value===status;
});

}


function saveAttendance(){

let db=getDB();

let className=document
.getElementById("attendanceClass")
.value;

let date=document
.getElementById("attendanceDate")
.value;

let term=document
.getElementById("attendanceTerm")
.value;

db.attendance=db.attendance.filter(
a=>!(a.className===className &&
a.date===date)
);

document
.querySelectorAll(
"#attendanceTable tr[data-student]"
)
.forEach(row=>{

let checked=row.querySelector(
"input:checked"
);

if(!checked)return;

db.attendance.push({

id:generateID("attendance"),

studentId:row.dataset.student,

className:className,

date:date,

term:term,

status:checked.value,

markedBy:currentUser().id

});

});

saveDB(db);

showToast("Attendance saved successfully.");

}

Class: ${className}

Further practice

Application and problem solving

Revision

Examination preparation`;

}

else if(type==="Lesson Note"){

`CALIPHATE TARBIYA ACADEMY

LESSON NOTE

Subject: ${subject}
Class: ${className}
Topic: ${topic}

Introduction:
${topic} is an important topic in ${subject}.

Learning Objectives:

${type.toUpperCase()}

Subject: ${subject}
Class: ${className}

SECTION A — OBJECTIVE

1. Which of the following best describes ${topic}?

B. __________________

B. __________________

function approveSubmission(id,newStatus){

let db=getDB();

let submission=db.submissions.find(
s=>s.id===id
);

if(!submission)return;

submission.status=newStatus;

submission.history=
submission.history||[];

submission.history.push({

status:newStatus,

date:new Date().toISOString(),

by:currentUser().id

});

let documentRecord=db.documents.find(
d=>d.id===submission.documentId
);

if(documentRecord){

documentRecord.status=newStatus;

}

saveDB(db);

showToast(
"Submission updated successfully."
);

renderApprovals();

}

function saveResult(){

let ca=Number(
document.getElementById("resultCA").value
);

let exam=Number(
document.getElementById("resultExam").value
);

if(ca<0||ca>40||
exam<0||exam>60){

showToast(
"CA must be 0–40 and Examination 0–60."
);

return;

}

let total=ca+exam;

let grade=
total>=75?"A":
total>=65?"B":
total>=55?"C":
total>=45?"D":
total>=40?"E":"F";

let db=getDB();

db.results.push({

id:generateID("result"),

studentId:
document.getElementById("resultStudent").value,

subject:
document.getElementById("resultSubject").value,

ca:ca,

exam:exam,

total:total,

grade:grade,

published:true,

date:new Date().toISOString()

});

saveDB(db);

closeModal();

showToast("Result published.");

renderResults();

}

function downloadBackup(){

let data=JSON.stringify(
getDB(),
null,
2
);

let blob=new Blob(
[data],
{type:"application/json"}
);

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;

a.download=
"Caliphate-Tarbiya-Academy-Backup.json";

a.click();

URL.revokeObjectURL(url);

}
