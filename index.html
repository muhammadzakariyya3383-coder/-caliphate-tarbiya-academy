<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify Email - Caliphate Tarbiya Academy</title>

<style>
*{

}

body{
    margin:0;
    padding:20px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#064e3b;
    font-family:Arial,sans-serif;

.box{

}

.logo{

    height:70px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#14532d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

h1{
    color:#14532d;
    margin-bottom:15px;
}

p{
    color:#555;
    line-height:1.6;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:10px;
    background:#14532d;
    color:white;
    font-size:16px;
    font-weight:bold;
}

a{
    display:block;
    margin-top:20px;
    color:#14532d;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="box">
