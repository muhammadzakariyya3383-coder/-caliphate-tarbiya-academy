<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087443">
<title>Global Kids Academy Sokoto — Academic Management System</title>

<style>
:root{
  --green:#087443;
  --green2:#0a8f55;
  --dark:#12352a;
  --bg:#f4f7f6;
  --card:#fff;
  --text:#18322a;
  --muted:#6d7d76;
  --border:#dfe8e3;
  --danger:#c62828;
  --warning:#b77900;
  --success:#087443;
  --shadow:0 8px 25px rgba(20,60,45,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#eaf7f0,#f8fbfa);
}
.login-card{
  width:100%;
  max-width:470px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:30px;
}
.logo{
  width:70px;height:70px;border-radius:18px;
  background:var(--green);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:24px;margin:0 auto 15px;
}
.login-card h1{text-align:center;margin:0;font-size:24px}
.login-card .sub{text-align:center;color:var(--muted);margin:7px 0 25px}
.role-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.role-tabs button{
  flex:1;min-width:80px;border:1px solid var(--border);
  background:#f7faf8;padding:10px;border-radius:10px;color:var(--dark)
}
.role-tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--border);
  border-radius:10px;outline:none;background:#fff;color:var(--text)
}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(8,116,67,.08)}
.btn{
  border:0;border-radius:10px;padding:11px 15px;
  background:var(--green);color:#fff;font-weight:700
}
.btn:hover{background:#06643a}
.btn.secondary{background:#edf5f1;color:var(--green)}
.btn.danger{background:var(--danger)}
.btn.warning{background:#d89c13}
.btn.small{padding:7px 10px;font-size:12px}
.login-btn{width:100%;margin-top:18px}
.demo-note{
  margin-top:15px;padding:12px;border-radius:10px;
  background:#f4faf7;font-size:12px;color:var(--muted)
}

.app{display:none;min-height:100vh}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:270px;
  background:#102f25;color:#fff;z-index:1000;
  display:flex;flex-direction:column
}
.brand{
  padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.1);
  display:flex;gap:12px;align-items:center
}
.brand-logo{
  width:42px;height:42px;border-radius:11px;background:#0b8a51;
  display:flex;align-items:center;justify-content:center;font-weight:900
}
.brand strong{display:block;font-size:14px}
.brand small{color:#b7d2c6}
.nav{padding:12px 10px;overflow:auto;flex:1}
.nav-section{
  color:#7fae9b;font-size:10px;text-transform:uppercase;
  font-weight:800;padding:13px 10px 6px;letter-spacing:.7px
}
.nav button{
  width:100%;display:flex;align-items:center;gap:11px;
  padding:10px 12px;margin:2px 0;border:0;border-radius:9px;
  background:transparent;color:#dcebe4;text-align:left;font-size:13px
}
.nav button:hover,.nav button.active{background:#1b513d;color:#fff}
.nav .ico{width:20px;text-align:center}
.sidebar-bottom{padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.user-mini{font-size:12px;color:#b7d2c6;margin-bottom:9px}

.main{margin-left:270px;min-height:100vh}
.topbar{
  height:66px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;position:sticky;top:0;z-index:500
}
.menu-toggle{display:none}
.top-title{font-weight:800}
.top-right{display:flex;align-items:center;gap:10px}
.content{padding:24px;max-width:1500px;margin:auto}

.page-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:15px;margin-bottom:20px
}
.page-head h2{margin:0 0 5px}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px
}
.stat{
  background:#fff;border:1px solid var(--border);border-radius:15px;
  padding:18px;box-shadow:var(--shadow)
}
.stat .icon{font-size:23px}
.stat strong{display:block;font-size:27px;margin-top:8px}
.stat span{color:var(--muted);font-size:12px}

.card{
  background:#fff;border:1px solid var(--border);
  border-radius:15px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px
}
.card h3{margin:0 0 13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.full{grid-column:1/-1}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{background:#f5f9f7;color:#355449}
.badge{
  display:inline-block;padding:5px 8px;border-radius:999px;
  font-size:11px;font-weight:800;background:#edf5f1;color:var(--green)
}
.badge.pending{background:#fff4d9;color:#946b00}
.badge.rejected{background:#fde8e8;color:#a51f1f}
.badge.published{background:#e0f6e9;color:#087443}

.empty{
  padding:35px;text-align:center;color:var(--muted);
  border:1px dashed var(--border);border-radius:12px
}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:2000
}
.modal-box{
  background:#fff;border-radius:16px;width:100%;max-width:700px;
  max-height:90vh;overflow:auto;padding:20px
}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.close{border:0;background:#edf2ef;border-radius:8px;padding:7px 10px}

.chat{
  display:flex;flex-direction:column;height:600px
}
.chat-messages{
  flex:1;overflow:auto;padding:15px;background:#f5f8f6;
  border-radius:12px;margin-bottom:12px
}
.msg{
  max-width:85%;padding:11px 13px;border-radius:13px;
  margin:7px 0;line-height:1.5;font-size:13px
}
.msg.bot{background:#fff;border:1px solid var(--border)}
.msg.user{background:var(--green);color:#fff;margin-left:auto}
.chat-form{display:grid;grid-template-columns:1fr auto;gap:8px}
.prompt-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.prompt-chip{
  border:1px solid var(--border);background:#fff;
  padding:7px 10px;border-radius:999px;font-size:12px
}

.toast{
  position:fixed;right:20px;bottom:20px;z-index:5000;
  background:#163a2d;color:#fff;padding:12px 16px;border-radius:10px;
  box-shadow:var(--shadow);display:none
}

.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:900
}

@media(max-width:1000px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .sidebar{transform:translateX(-100%);transition:.25s;width:280px}
  .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block}
  .main{margin-left:0}
  .menu-toggle{display:block;border:0;background:#edf5f1;color:var(--green);padding:8px 10px;border-radius:8px}
  .topbar{padding:0 14px}
  .content{padding:15px}
  .stats,.grid2,.grid3,.form-grid{grid-template-columns:1fr}
  .page-head{flex-direction:column}
  .chat{height:520px}
}
@media print{
  .sidebar,.topbar,.actions,.no-print,.overlay{display:none!important}
  .main{margin:0}
  .content{padding:0}
  .card{box-shadow:none}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="logo">GKA</div>
    <h1>Global Kids Academy Sokoto</h1>
    <div class="sub">Academic Management System</div>

    <div class="role-tabs" id="roleTabs">
      <button data-role="Admin" class="active">Admin</button>
      <button data-role="Teacher">Teacher</button>
      <button data-role="Student">Student</button>
      <button data-role="Parent">Parent</button>
    </div>

    <label>Username</label>
    <input id="loginUsername" autocomplete="username" placeholder="Enter username">

    <label>Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password">

    <button class="btn login-btn" onclick="login()">Sign In</button>

    <div class="demo-note">
      <b>Prototype access:</b><br>
      Admin username: <b>Admin</b><br>
      Admin password: <b>Admin@2026!</b><br><br>
      This local version stores data in the browser. Do not use prototype credentials for a production deployment.
    </div>
  </div>
</section>

<!-- APPLICATION -->
<div id="app" class="app">

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-logo">G</div>
      <div>
        <strong>Global Kids Academy</strong>
        <small>Sokoto</small>
      </div>
    </div>

    <nav id="nav" class="nav"></nav>

    <div class="sidebar-bottom">
      <div id="miniUser" class="user-mini"></div>
      <button class="nav" style="padding:0;background:none" onclick="logout()">
        <span style="display:block;padding:10px 12px;color:#fff">↪ Logout</span>
      </button>
    </div>
  </aside>

  <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div id="topTitle" class="top-title">Dashboard</div>
      </div>
      <div class="top-right">
        <span id="topRole" class="badge"></span>
      </div>
    </header>

    <div id="content" class="content"></div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   GLOBAL KIDS ACADEMY SOKOTO
   V8 LOCAL / PROTOTYPE
   ========================================================= */

const APP_NAME = "Global Kids Academy Sokoto";
const DB_KEY = "GKA_V8_LOCAL_DATABASE";
const RECOVERY_KEY = "GKA_V8_RECOVERY_SNAPSHOT";
const SCHEMA_VERSION = 8;

let db;
let currentUser = null;
let selectedRole = "Admin";
let currentPage = "dashboard";

/* ---------------- DATABASE ---------------- */

function uid(prefix="ID"){
  return prefix + "_" + Date.now().toString(36) + "_" +
    Math.random().toString(36).slice(2,8);
}

function defaultDB(){
  return {
    schemaVersion:SCHEMA_VERSION,
    settings:{
      schoolName:APP_NAME,
      motto:"Knowledge, Character and Excellence",
      address:"Sokoto State, Nigeria",
      phone:"",
      email:"",
      session:"2026/2027",
      term:"First Term",
      language:"English"
    },

    users:[
      {
        id:"U_ADMIN",
        username:"Admin",
        passwordHash:null,
        role:"Admin",
        name:"System Administrator",
        active:true
      },
      {
        id:"U_TEACHER",
        username:"teacher",
        passwordHash:null,
        role:"Teacher",
        name:"Demo Teacher",
        active:true,
        subject:"Mathematics",
        isHOD:true,
        isExamOfficer:true
      },
      {
        id:"U_STUDENT",
        username:"student",
        passwordHash:null,
        role:"Student",
        name:"Demo Student",
        active:true,
        admissionNo:"GKA/001",
        className:"JSS 1"
      },
      {
        id:"U_PARENT",
        username:"parent",
        passwordHash:null,
        role:"Parent",
        name:"Demo Parent",
        active:true,
        studentAdmissionNo:"GKA/001"
      }
    ],

    classes:[
      {id:"C1",name:"JSS 1"},
      {id:"C2",name:"JSS 2"},
      {id:"C3",name:"JSS 3"},
      {id:"C4",name:"SS 1"},
      {id:"C5",name:"SS 2"},
      {id:"C6",name:"SS 3"}
    ],

    subjects:[
      {id:"S1",name:"Mathematics",hod:"U_TEACHER"},
      {id:"S2",name:"English",hod:""},
      {id:"S3",name:"Physics",hod:""},
      {id:"S4",name:"Chemistry",hod:""},
      {id:"S5",name:"Biology",hod:""},
      {id:"S6",name:"Economics",hod:""},
      {id:"S7",name:"Hausa",hod:""},
      {id:"S8",name:"Arabic",hod:""},
      {id:"S9",name:"French",hod:""}
    ],

    students:[
      {
        id:"ST001",
        admissionNo:"GKA/001",
        name:"Demo Student",
        className:"JSS 1",
        parentName:"Demo Parent",
        active:true
      }
    ],

    documents:[],
    results:[],
    attendance:[],
    audit:[],
    notifications:[],
    counters:{
      document:0,
      result:0,
      attendance:0
    }
  };
}

async function hashPassword(password){
  if(window.crypto && crypto.subtle){
    const data = new TextEncoder().encode(password);
    const hash = await crypto.subtle.digest("SHA-256",data);
    return Array.from(new Uint8Array(hash))
      .map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  return "plain:"+btoa(unescape(encodeURIComponent(password)));
}

async function initializeDB(){
  const raw = localStorage.getItem(DB_KEY);

  if(!raw){
    db = defaultDB();
    db.users[0].passwordHash = await hashPassword("Admin@2026!");
    db.users[1].passwordHash = await hashPassword("Teacher@2026!");
    db.users[2].passwordHash = await hashPassword("Student@2026!");
    db.users[3].passwordHash = await hashPassword("Parent@2026!");
    saveDB();
  }else{
    try{
      db = JSON.parse(raw);
      repairDB();
    }catch(e){
      db = defaultDB();
      saveDB();
    }
  }
}

function repairDB(){
  if(!db.schemaVersion) db.schemaVersion=SCHEMA_VERSION;
  if(!db.settings) db.settings=defaultDB().settings;
  if(!db.users) db.users=[];
  if(!db.classes) db.classes=[];
  if(!db.subjects) db.subjects=[];
  if(!db.students) db.students=[];
  if(!db.documents) db.documents=[];
  if(!db.results) db.results=[];
  if(!db.attendance) db.attendance=[];
  if(!db.audit) db.audit=[];
  if(!db.notifications) db.notifications=[];
  if(!db.counters) db.counters={document:0,result:0,attendance:0};

  const admin = db.users.find(u=>u.username==="Admin");
  if(!admin){
    db.users.unshift({
      id:"U_ADMIN",
      username:"Admin",
      passwordHash:null,
      role:"Admin",
      name:"System Administrator",
      active:true
    });
  }
  db.schemaVersion=SCHEMA_VERSION;
  saveDB();
}

function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
  localStorage.setItem(RECOVERY_KEY,JSON.stringify(db));
}

function audit(action,details=""){
  if(!db.audit) db.audit=[];
  db.audit.unshift({
    id:uid("AUD"),
    user:currentUser ? currentUser.username : "SYSTEM",
    role:currentUser ? currentUser.role : "SYSTEM",
    action,
    details,
    time:new Date().toISOString()
  });
  db.audit=db.audit.slice(0,2000);
  saveDB();
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.style.display="block";
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.style.display="none",2600);
}

/* ---------------- LOGIN ---------------- */

document.querySelectorAll("#roleTabs button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedRole=btn.dataset.role;
    document.querySelectorAll("#roleTabs button")
      .forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  });
});

async function login(){
  const username=document.getElementById("loginUsername").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!username || !password){
    toast("Enter username and password.");
    return;
  }

  const user=db.users.find(u=>
    u.username.toLowerCase()===username.toLowerCase() &&
    u.role===selectedRole &&
    u.active!==false
  );

  if(!user){
    toast("Account not found for the selected role.");
    return;
  }

  const hash=await hashPassword(password);

  if(hash!==user.passwordHash){
    toast("Incorrect password.");
    return;
  }

  currentUser=user;
  localStorage.setItem("GKA_CURRENT_USER",user.id);
  audit("LOGIN","Successful login");
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="block";
  buildNav();
  showPage("dashboard");
}

function restoreSession(){
  const id=localStorage.getItem("GKA_CURRENT_USER");
  if(!id)return;
  const user=db.users.find(u=>u.id===id && u.active!==false);
  if(user){
    currentUser=user;
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";
    buildNav();
    showPage("dashboard");
  }
}

function logout(){
  audit("LOGOUT","User logged out");
  localStorage.removeItem("GKA_CURRENT_USER");
  currentUser=null;
  document.getElementById("app").style.display="none";
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("loginPassword").value="";
}

/* ---------------- NAVIGATION ---------------- */

const NAV=[
  {section:"Main"},
  {id:"dashboard",label:"Dashboard",icon:"⌂",roles:["Admin","Teacher","Student","Parent"]},

  {section:"User Management",roles:["Admin"]},
  {id:"teachers",label:"Teachers",icon:"👨‍🏫",roles:["Admin"]},
  {id:"students",label:"Students",icon:"🎓",roles:["Admin"]},
  {id:"parents",label:"Parents",icon:"👪",roles:["Admin"]},

  {section:"Academic Setup",roles:["Admin","Teacher"]},
  {id:"classes",label:"Sessions / Classes",icon:"🏫",roles:["Admin"]},
  {id:"subjects",label:"Subjects / HOD",icon:"📚",roles:["Admin"]},

  {section:"Academic Operations",roles:["Admin","Teacher"]},
  {id:"attendance",label:"Attendance",icon:"✓",roles:["Admin","Teacher"]},
  {id:"results",label:"Results",icon:"▣",roles:["Admin","Teacher"]},

  {section:"Academic Documents",roles:["Admin","Teacher"]},
  {id:"lessonplans",label:"Lesson Plans",icon:"🗓",roles:["Admin","Teacher"]},
  {id:"lessonnotes",label:"Lesson Notes",icon:"📝",roles:["Admin","Teacher"]},
  {id:"schemes",label:"13-Week Schemes",icon:"📅",roles:["Admin","Teacher"]},
  {id:"caquestions",label:"CA Questions",icon:"❓",roles:["Admin","Teacher"]},
  {id:"examquestions",label:"Examination Questions",icon:"📄",roles:["Admin","Teacher"]},
  {id:"answerkeys",label:"Answer Keys",icon:"✓",roles:["Admin","Teacher"]},
  {id:"markingguides",label:"Marking Guides",icon:"☑",roles:["Admin","Teacher"]},

  {section:"Quality Control",roles:["Admin","Teacher"]},
  {id:"approval",label:"Approval Centre",icon:"✓",roles:["Admin","Teacher"]},
  {id:"archive",label:"Approved Work Archive",icon:"🗄",roles:["Admin","Teacher"]},

  {section:"Portals",roles:["Admin","Teacher","Student","Parent"]},
  {id:"studentportal",label:"Student Portal",icon:"🎓",roles:["Admin","Student"]},
  {id:"parentportal",label:"Parent Portal",icon:"👪",roles:["Admin","Parent"]},

  {section:"Tools",roles:["Admin","Teacher"]},
  {id:"assistant",label:"Teacher Assistant",icon:"💬",roles:["Admin","Teacher"]},
  {id:"backup",label:"Backup & Recovery",icon:"💾",roles:["Admin"]},
  {id:"audit",label:"Audit History",icon:"🔎",roles:["Admin"]},
  {id:"settings",label:"Settings",icon:"⚙",roles:["Admin"]},
  {id:"password",label:"Change Password",icon:"🔐",roles:["Admin","Teacher","Student","Parent"]}
];

function buildNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML="";

  NAV.forEach(item=>{
    if(item.section){
      if(!item.roles || item.roles.includes(currentUser.role)){
        const d=document.createElement("div");
        d.className="nav-section";
        d.textContent=item.section;
        nav.appendChild(d);
      }
      return;
    }

    if(!item.roles.includes(currentUser.role))return;

    const b=document.createElement("button");
    b.dataset.page=item.id;
    b.innerHTML=`<span class="ico">${item.icon}</span><span>${item.label}</span>`;
    b.onclick=()=>showPage(item.id);
    nav.appendChild(b);
  });

  document.getElementById("miniUser").textContent=
    `${currentUser.name} • ${currentUser.role}`;
  document.getElementById("topRole").textContent=currentUser.role;
}

function showPage(page){
  currentPage=page;
  document.querySelectorAll(".nav button").forEach(b=>
    b.classList.toggle("active",b.dataset.page===page)
  );
  closeSidebar();

  const titles={
    dashboard:"Dashboard",
    teachers:"Teacher Management",
    students:"Student Management",
    parents:"Parent Management",
    classes:"Sessions / Classes",
    subjects:"Subjects & HOD Assignment",
    attendance:"Attendance",
    results:"Results",
    lessonplans:"Lesson Plans",
    lessonnotes:"Lesson Notes",
    schemes:"13-Week Schemes",
    caquestions:"CA Questions",
    examquestions:"Examination Questions",
    answerkeys:"Answer Keys",
    markingguides:"Marking Guides",
    approval:"Approval Centre",
    archive:"Approved Work Archive",
    studentportal:"Student Portal",
    parentportal:"Parent Portal",
    assistant:"Teacher Assistant",
    backup:"Backup & Recovery",
    audit:"Audit History",
    settings:"School Settings",
    password:"Change Password"
  };

async function saveTeacher(id){
  const name=document.getElementById("f_name").value.trim();
  const username=document.getElementById("f_username").value.trim();
  const password=document.getElementById("f_password").value;
  const subject=document.getElementById("f_subject").value.trim();

  if(!name||!username){toast("Name and username are required.");return}

  const duplicate=db.users.find(u=>
    u.username.toLowerCase()===username.toLowerCase() && u.id!==id
  );
  if(duplicate){toast("Username already exists.");return}

  let t=id?db.users.find(x=>x.id===id):null;

  if(!t){
    t={
      id:uid("USR"),
      role:"Teacher",
      active:true,
      passwordHash:await hashPassword(password||"Teacher@2026!")
    };
    db.users.push(t);
  }else if(password){
    t.passwordHash=await hashPassword(password);
  }

  t.name=name;
  t.username=username;
  t.subject=subject;
  t.isHOD=document.getElementById("f_hod").value==="1";
  t.isExamOfficer=document.getElementById("f_exam").value==="1";

  audit(id?"EDIT_TEACHER":"CREATE_TEACHER",username);
  saveDB();closeModal();page_teachers();toast("Teacher saved.");
}

/* ---------------- RESULTS ---------------- */

function grade(total){
  if(total>=75)return ["A1","Excellent"];
  if(total>=70)return ["B2","Very Good"];
  if(total>=65)return ["B3","Good"];
  if(total>=60)return ["C4","Credit"];
  if(total>=55)return ["C5","Credit"];
  if(total>=50)return ["C6","Credit"];
  if(total>=45)return ["D7","Pass"];
  if(total>=40)return ["E8","Pass"];
  return ["F9","Fail"];
}

function resultModal(){
  openModal(`
    <div class="modal-head"><h3>Enter Result</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="form-grid">
      <div><label>Student</label><select id="res_student">${db.students.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.admissionNo)}</option>`).join("")}</select></div>
      <div><label>Subject</label><select id="res_subject">${db.subjects.map(s=>`<option>${esc(s.name)}</option>`).join("")}</select></div>
      <div><label>CA1 / 15</label><input id="res_ca1" type="number" min="0" max="15" value="0"></div>
      <div><label>CA2 / 15</label><input id="res_ca2" type="number" min="0" max="15" value="0"></div>
      <div><label>Examination / 70</label><input id="res_exam" type="number" min="0" max="70" value="0"></div>
    </div>
    <div style="margin-top:12px;padding:12px;background:#f5f9f7;border-radius:10px">
      <b>Total: <span id="res_total">0</span> / 100</b>
    </div>
    <div style="margin-top:15px;text-align:right"><button class="btn" onclick="saveResult()">Save Result</button></div>
  `);

  ["res_ca1","res_ca2","res_exam"].forEach(id=>{
    document.getElementById(id).addEventListener("input",()=>{
      const t=(+document.getElementById("res_ca1").value||0)+
              (+document.getElementById("res_ca2").value||0)+
              (+document.getElementById("res_exam").value||0);
      document.getElementById("res_total").textContent=t;
    });
  });
}

function saveResult(){
  const ca1=Math.min(15,Math.max(0,+document.getElementById("res_ca1").value||0));
  const ca2=Math.min(15,Math.max(0,+document.getElementById("res_ca2").value||0));
  const exam=Math.min(70,Math.max(0,+document.getElementById("res_exam").value||0));
  const total=ca1+ca2+exam;
  const g=grade(total);
  const student=db.students.find(s=>s.id===document.getElementById("res_student").value);

  db.results.unshift({
    id:uid("RES"),
    studentId:student?.id,
    studentName:student?.name||"Unknown",
    admissionNo:student?.admissionNo||"",
    className:student?.className||"",
    subject:document.getElementById("res_subject").value,
    ca1,ca2,exam,total,
    grade:g[0],
    remark:g[1],
    status:"Draft",
    createdBy:currentUser.id,
    createdAt:new Date().toISOString()
  });

  audit("CREATE_RESULT",student?.name||"");
  saveDB();closeModal();page_results();toast("Result saved as draft.");
}

function publishResult(id){
  if(currentUser.role!=="Admin"){
    toast("Only Admin can publish results.");
    return;
  }
  const r=db.results.find(x=>x.id===id);
  if(!r)return;

  r.status="Published";
  r.publishedAt=new Date().toISOString();
  audit("PUBLISH_RESULT",r.studentName+" / "+r.subject);
  saveDB();page_results();toast("Result published.");
}

function assistantFillDocument(type){
  closeModal();
  showPage("assistant");
  setTimeout(()=>{
    const input=document.getElementById("chatInput");
    if(input){
      input.value=`Help me prepare a professional ${DOC_TYPES[type]} for Global Kids Academy Sokoto. Include objectives, activities, examples and evaluation where appropriate.`;

    }

function saveDocument(type,status){
  const content=document.getElementById("doc_content").value.trim();
  const title=document.getElementById("doc_title").value.trim();

  if(!title||!content){
    toast("Title and content are required.");
    return;
  }

  const d={
    id:uid("DOC"),
    type:DOC_TYPES[type],
    title,
    subject:document.getElementById("doc_subject").value,
    className:document.getElementById("doc_class").value,
    term:document.getElementById("doc_term").value,
    week:document.getElementById("doc_week").value,
    language:document.getElementById("doc_language").value,
    topic:document.getElementById("doc_topic").value,
    subtopic:document.getElementById("doc_subtopic").value,
    content,
    authorId:currentUser.id,
    authorName:currentUser.name,
    status,
    createdAt:new Date().toISOString(),
    history:[{
      status,
      by:currentUser.name,
      time:new Date().toISOString(),
      comment:"Document created"
    }]
  };

  db.documents.unshift(d);
  audit(status==="Submitted"?"SUBMIT_DOCUMENT":"CREATE_DOCUMENT",title);
  saveDB();closeModal();page_documents(type);
  toast(status==="Submitted"?"Document submitted for approval.":"Draft saved.");
}

function viewDocument(id){
  const d=db.documents.find(x=>x.id===id);
  if(!d)return;

  openModal(`
    <div class="modal-head">
      <h3>${esc(d.title)}</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <p><b>Type:</b> ${esc(d.type)} &nbsp; <b>Subject:</b> ${esc(d.subject)} &nbsp; <b>Class:</b> ${esc(d.className)}</p>
    <p><b>Status:</b> <span class="badge">${esc(d.status)}</span></p>

function printDocument(id){
  const d=db.documents.find(x=>x.id===id);
  if(!d)return;

  const w=window.open("","_blank");
  w.document.write(`
    <!doctype html><html><head><title>${esc(d.title)}</title>
    <style>
      body{font-family:Arial;padding:35px;line-height:1.6}
      h1{color:#087443}
      .meta{border-bottom:1px solid #ddd;padding-bottom:12px;margin-bottom:20px}

    </style></head><body>
    <h1>${esc(APP_NAME)}</h1>
    <h2>${esc(d.title)}</h2>
    <div class="meta">
      <b>Type:</b> ${esc(d.type)}<br>
      <b>Subject:</b> ${esc(d.subject)}<br>
      <b>Class:</b> ${esc(d.className)}<br>
      <b>Term:</b> ${esc(d.term)}<br>
      <b>Author:</b> ${esc(d.authorName)}

function exportWord(id){
  const d=db.documents.find(x=>x.id===id);
  if(!d)return;

  const html=`
  <html><head><meta charset="utf-8"><title>${esc(d.title)}</title></head>
  <body>
  <h1>${esc(APP_NAME)}</h1>
  <h2>${esc(d.title)}</h2>
  <p><b>Subject:</b> ${esc(d.subject)}</p>
  <p><b>Class:</b> ${esc(d.className)}</p>
  <pre style="white-space:pre-wrap">${esc(d.content)}</pre>
  </body></html>`;

  const blob=new Blob([html],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(d.title||"academic-document")+".doc";
  a.click();
  URL.revokeObjectURL(a.href);
}

function approveDocument(id){
  const d=db.documents.find(x=>x.id===id);
  if(!d)return;

  d.status="Approved";
  d.approvedBy=currentUser.name;
  d.approvedAt=new Date().toISOString();
  d.history=d.history||[];
  d.history.push({
    status:"Approved",
    by:currentUser.name,
    time:new Date().toISOString(),
    comment:"Approved"
  });

  audit("APPROVE_DOCUMENT",d.title);
  saveDB();page_approval();toast("Document approved and archived.");
}

function rejectDocument(id){
  const d=db.documents.find(x=>x.id===id);
  if(!d)return;

  const comment=prompt("Enter rejection comment:");
  if(comment===null)return;

  d.status="Rejected";
  d.rejectionComment=comment;
  d.history=d.history||[];
  d.history.push({
    status:"Rejected",
    by:currentUser.name,
    time:new Date().toISOString(),
    comment
  });

  audit("REJECT_DOCUMENT",d.title);
  saveDB();page_approval();toast("Document rejected.");
}

function filterArchive(q){

    JSON.stringify(d).toLowerCase().includes(q)
  );
  document.getElementById("archiveList").innerHTML=archiveRows(docs);

function usePrompt(text){
  const input=document.getElementById("chatInput");
  if(input){
    input.value=text+" ";
    input.focus();
  }
}

function sendAssistant(){
  const input=document.getElementById("chatInput");
  const text=input.value.trim();
  if(!text)return;

  addChat("user",text);
  input.value="";

  setTimeout(()=>{
    addChat("bot",assistantResponse(text));
  },250);
}

function addChat(type,text){
  const box=document.getElementById("chatMessages");
  if(!box)return;

  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerHTML=esc(text).replace(/\n/g,"<br>");
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

function assistantResponse(q){
  const x=q.toLowerCase();

  if(x.includes("lesson plan")){
    return `LESSON PLAN TEMPLATE

Class: [Class]
Topic: [Topic]
Week: [Week]
Duration: [Duration]

Entry Behaviour:

5. Correct misconceptions.

  if(x.includes("scheme")){

Week 7 — Revision
Week 8 — Intermediate concepts
Week 9 — Advanced application
Week 10 — Practical/class activities
Week 11 — Revision and reinforcement
Week 12 — Examination preparation
Week 13 — Final revision/evaluation

For an exact scheme, provide the class, subject and curriculum topic area.`;
  }

  if(x.includes("question") || x.includes("ca")){
    return `CA QUESTION SET

Class: [Class]
Topic: [Topic]

SECTION A — OBJECTIVE
1. __________________________________
A. ______ B. ______ C. ______ D. ______

A. ______ B. ______ C. ______ D. ______

3. __________________________________
A. ______ B. ______ C. ______ D. ______

SECTION B — THEORY
1. Explain __________________________________.

The questions should be adjusted to the learners' class level and the exact topic.`;

  }

  if(x.includes("marking guide")){

}

function backupDatabase(){
  const data=JSON.stringify(db,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Global-Kids-Academy-Backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(a.href);
  audit("BACKUP_EXPORT","Database backup exported");
  saveDB();
}

function restoreDatabase(){
  const file=document.getElementById("restoreFile").files[0];
  if(!file){toast("Choose a backup file first.");return}

  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);
      if(!imported || !imported.users || !imported.settings){
        throw new Error("Invalid database");
      }
      if(!confirm("Restore this database? Current local data will be replaced."))return;
      db=imported;
      repairDB();
      audit("BACKUP_RESTORE","Database restored from backup");
      saveDB();
      buildNav();showPage("dashboard");
      toast("Database restored.");
    }catch(e){
      toast("Invalid backup file.");
    }
  };
  reader.readAsText(file);
}

function restoreSnapshot(){
  const raw=localStorage.getItem(RECOVERY_KEY);
  if(!raw){toast("No recovery snapshot found.");return}
  if(!confirm("Restore the automatic recovery snapshot?"))return;

  try{
    db=JSON.parse(raw);
    repairDB();
    audit("RECOVERY_RESTORE","Automatic snapshot restored");
    saveDB();
    buildNav();showPage("dashboard");
    toast("Recovery snapshot restored.");
  }catch(e){
    toast("Recovery snapshot is invalid.");
  }
}

/* ---------------- PASSWORD ---------------- */

function page_password(){
  document.getElementById("content").innerHTML=`
    <div class="page-head">
      <div><h2>Change Password</h2><p>Update your current account password.</p></div>
    </div>

    <div class="card" style="max-width:600px">
      <label>Current Password</label>
      <input id="oldpass" type="password">

      <label>New Password</label>
      <input id="newpass" type="password">

      <label>Confirm New Password</label>
      <input id="confpass" type="password">

      <button class="btn" style="margin-top:15px" onclick="changePassword()">Change Password</button>
    </div>
  `;
}

async function changePassword(){
  const oldp=document.getElementById("oldpass").value;
  const newp=document.getElementById("newpass").value;
  const conf=document.getElementById("confpass").value;

  if(!oldp||!newp||!conf){toast("Complete all fields.");return}
  if(newp.length<6){toast("New password must be at least 6 characters.");return}
  if(newp!==conf){toast("New passwords do not match.");return}

  if(await hashPassword(oldp)!==currentUser.passwordHash){
    toast("Current password is incorrect.");
    return;
  }

  currentUser.passwordHash=await hashPassword(newp);
  const user=db.users.find(u=>u.id===currentUser.id);
  user.passwordHash=currentUser.passwordHash;

  audit("PASSWORD_CHANGE","Password changed");
  saveDB();

  document.getElementById("oldpass").value="";
  document.getElementById("newpass").value="";
  document.getElementById("confpass").value="";
  toast("Password changed successfully.");
}

/* ---------------- UTILITIES ---------------- */

function emptyRow(cols){
  return `<tr><td colspan="${cols}" class="empty">No records available.</td></tr>`;
}

function esc(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escAttr(value){
  return esc(value).replace(/\n/g," ");
}

function openModal(html){
  document.getElementById("modalContent").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}
