<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>Global Kids Academy Sokoto | School Academic Management System</title>

<style>
:root{
  --g:#14532d;
  --g2:#166534;
  --g3:#dcfce7;
  --bg:#f5f7f6;
  --card:#fff;
  --line:#dbe3df;
  --txt:#172033;
  --mut:#64748b;
  --red:#b91c1c;
  --gold:#a16207;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--txt);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
  background:linear-gradient(135deg,#052e16,#166534);
}

.box{
  background:#fff;
  border-radius:20px;
  padding:24px;
  box-shadow:0 20px 60px #0004;
  width:min(500px,100%);
}

.logo{
  width:64px;
  height:64px;
  background:var(--g);
  color:#fff;
  border-radius:16px;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:20px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:16px 0;
}

.tabs button,
.secondary{
  border:0;
  background:#e8eeeb;
  color:#173024;
  border-radius:9px;
  padding:10px;
}

.tabs .on{
  background:var(--g);
  color:#fff;
}

.btn{
  border:0;
  background:var(--g);
  color:#fff;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
}

.btn:hover{
  background:var(--g2);
}

.danger{
  background:var(--red);
}

.danger:hover{
  background:#991b1b;
}

label{
  display:block;
  font-weight:700;
  font-size:12px;
  margin:10px 0 5px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  background:#fff;
  color:var(--txt);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.top{
  min-height:62px;
  background:var(--g);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:10;
}

.top .secondary{
  padding:8px 12px;
}

.layout{
  display:grid;
  grid-template-columns:245px 1fr;
  min-height:calc(100vh - 62px);
}

aside{
  background:#052e16;
  color:#fff;
  padding:14px;
  position:sticky;
  top:62px;
  height:calc(100vh - 62px);
  overflow:auto;
}

.brand-side{
  padding:10px 8px 15px;
  border-bottom:1px solid #ffffff22;
  margin-bottom:10px;
}

.brand-side b{
  display:block;
}

.brand-side small{
  color:#bbf7d0;
}

.nav button{
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  color:#d9f5e2;
  border:0;
  padding:11px;
  border-radius:8px;
  margin:2px 0;
}

.nav button:hover,
.nav .on{
  background:#166534;
  color:#fff;
}

main{
  padding:20px;
  max-width:1500px;
  width:100%;
  margin:auto;
}

.page{
  display:none;
}

.page.on{
  display:block;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card,
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:0 5px 18px #0f172a0a;
}

.panel{
  margin-top:14px;
}

.num{
  font-size:28px;
  font-weight:800;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.table{
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:650px;
}

th,
td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  vertical-align:top;
}

th{
  background:#f8faf9;
  white-space:nowrap;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#dcfce7;
  color:#166534;
  font-size:11px;
  font-weight:700;
}

.warn{
  background:#fef3c7;
  color:#92400e;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  place-items:center;
  padding:16px;
  z-index:50;
}

.modal.on{
  display:grid;
}

.modal>div{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#111827;
  color:#fff;
  padding:12px 15px;
  border-radius:9px;
  display:none;
  z-index:99;
  max-width:90vw;
}

.toast.on{
  display:block;
}

.hamb{
  display:none;
  background:none;
  border:0;
  color:#fff;
  font-size:24px;
}

.class-card{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin:8px 0;
  background:#fafcfb;
}

.quick{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.signature-box{
  border:1px dashed #94a3b8;
  min-height:130px;
  background:#fff;
  border-radius:10px;
  padding:10px;
}

.stat-label{
  color:var(--mut);
  font-size:12px;
}

.empty{
  color:var(--mut);
  text-align:center;
  padding:25px;
}

.result-pass{
  color:#166534;
  font-weight:700;
}

.result-fail{
  color:#b91c1c;
  font-weight:700;
}

.assistant-output{
  white-space:pre-wrap;
  line-height:1.6;
  background:#f8faf9;
  border:1px solid var(--line);
  padding:14px;
  border-radius:10px;
  max-height:600px;
  overflow:auto;
}

@media(max-width:900px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .layout{
    grid-template-columns:1fr;
  }

  aside{
    position:fixed;
    left:-260px;
    width:245px;
    z-index:20;
    transition:.2s;
  }

  .layout.open aside{
    left:0;
  }

  .hamb{
    display:inline-block;
  }

  .grid3{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){

  .cards,
  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  main{
    padding:12px;
  }

  .tabs{
    grid-template-columns:repeat(2,1fr);
  }

  .top{
    padding:0 10px;
  }

  .top b{
    font-size:13px;
  }

  .box{
    padding:18px;
  }
}

@media print{

  .top,
  aside,
  .nav,
  .hamb,
  button{
    display:none!important;
  }

  .layout{
    display:block;
  }

  main{
    padding:0;
    max-width:none;
  }

  .page{
    display:none!important;
  }

  .page.on{
    display:block!important;
  }

  .panel,
  .card{
    box-shadow:none;
    border:1px solid #ccc;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="login" class="login">

<div class="box">

<div class="logo">GKA</div>

<h1>Global Kids Academy Sokoto</h1>

<p style="color:#64748b">
School Academic Management System
</p>

<div class="tabs" id="roleTabs">

Admin

id="lid"

style="

background:#f0fdf4;

border-radius:10px">

Teacher

<!-- =====================================================
     APPLICATION
===================================================== -->

<section id="app" class="hidden">

<header class="top">

<div>

<button
class="hamb"
onclick="
document.getElementById('layout')
.classList.toggle('open')
">
☰
</button>

<b>
Global Kids Academy Sokoto
</b>

</div>

<div>

<span id="who"></span>

class="secondary"
onclick="logout()">
Logout
</button>

</div>

</header>


<div id="layout" class="layout">

<aside>

<div class="brand-side">

<b>
Global Kids Academy Sokoto
</b>

<small>
Academic Management System
</small>

</div>

<div id="nav" class="nav"></div>

</aside>


<main>

<section id="dashboard" class="page on"></section>

<section id="attendance" class="page"></section>

<section id="students" class="page"></section>

<section id="teachers" class="page"></section>

<section id="classes" class="page"></section>

<section id="docs" class="page"></section>

<section id="assistant" class="page"></section>

<section id="submissions" class="page"></section>

<section id="results" class="page"></section>

</main>

</div>

</section>


<div id="modal" class="modal">

<div id="mb"></div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =====================================================
   DATABASE CONSTANTS
===================================================== */

const DB='GLOBAL_KIDS_ACADEMY_SOKOTO_DATABASE_V1';
const SES='GLOBAL_KIDS_ACADEMY_SOKOTO_SESSION_V1';


/* =====================================================
   SEED DATABASE
===================================================== */

const seed={

users:[

{
id:'a1',
role:'admin',
name:'Administrator',
username:'Admin',
email:'admin@gka.local',
password:'Admin@2026!',
status:'approved'
},

{
id:'t1',
role:'teacher',
name:'Demo Mathematics Teacher',
email:'teacher@gka.local',
password:'demo-teacher',
status:'approved',
staffId:'T001',
subjects:['Mathematics'],
classes:['JSS1 A'],
hod:'Mathematics',
examOfficer:false
},

{
id:'t2',
role:'teacher',
name:'Demo English Teacher',
email:'english@gka.local',
password:'demo-teacher',
status:'approved',
staffId:'T002',
subjects:['English Language'],
classes:['JSS1 A'],
hod:'',
examOfficer:true
},

{
id:'suser',
role:'student',
name:'Demo Student',
email:'student@gka.local',
password:'demo-student',
status:'approved',
studentId:'GKA/001'
},

{
id:'p1',
role:'parent',
name:'Demo Parent',
email:'parent@gka.local',
password:'demo-parent',
status:'approved',
children:['s1']
}

],

classes:[

{
id:'c1',
name:'JSS1',
section:'A',
displayName:'JSS1 A',
session:'2026/2027'
},

{
id:'c2',
name:'JSS1',
section:'B',
displayName:'JSS1 B',
session:'2026/2027'
}

],

subjects:[

'Mathematics',
'English Language',
'Physics',
'Chemistry',
'Biology',
'Economics',
'Hausa',
'Arabic',
'French',
'Computer Studies',
'Basic Science',
'Basic Technology',
'Social Studies',
'Civic Education',
'Agricultural Science',
'Geography',
'Government',
'Literature in English',
'Islamic Religious Studies',
'Christian Religious Studies',
'Home Economics',
'Commerce',
'Financial Accounting',
'Further Mathematics'

],

students:[

{
id:'s1',
userId:'suser',
name:'Demo Student',
studentId:'GKA/001',
className:'JSS1',
section:'A',
gender:'Male',
session:'2026/2027',
parents:['p1']
}

],

attendance:[],
documents:[],
submissions:[],
results:[],
activity:[]

};


/* =====================================================
   DATABASE
   FIXED LOGIN DATABASE REPAIR
===================================================== */

function db(){

  let x=localStorage.getItem(DB);

  /* Create database if it does not exist */

  if(!x){

    const fresh=JSON.parse(
      JSON.stringify(seed)
    );

    localStorage.setItem(
      DB,
      JSON.stringify(fresh)
    );

    return fresh;
  }

  let d;

  try{

    d=JSON.parse(x);

  }catch(error){

    console.warn(
      'Database was corrupted. Rebuilding database.'
    );

    d=JSON.parse(
      JSON.stringify(seed)
    );

    localStorage.setItem(
      DB,
      JSON.stringify(d)
    );

    return d;
  }


  /* Make sure arrays exist */

  d.users=Array.isArray(d.users)
    ?d.users:[];

  d.classes=Array.isArray(d.classes)
    ?d.classes:[];

  d.subjects=Array.isArray(d.subjects)
    ?d.subjects:[];

  d.students=Array.isArray(d.students)
    ?d.students:[];

  d.attendance=Array.isArray(d.attendance)
    ?d.attendance:[];

  d.documents=Array.isArray(d.documents)
    ?d.documents:[];

  d.submissions=Array.isArray(d.submissions)
    ?d.submissions:[];

  d.results=Array.isArray(d.results)
    ?d.results:[];

  d.activity=Array.isArray(d.activity)
    ?d.activity:[];


  /* =================================================
     IMPORTANT ADMIN REPAIR
     This fixes old databases.
  ================================================= */

  let admin=d.users.find(u=>

    String(u.username||'')
      .trim()
      .toLowerCase()==='admin'

    ||

    u.role==='admin'

  );


  if(!admin){

    d.users.unshift({

      id:'a1',

      role:'admin',

      name:'Administrator',

      username:'Admin',

      email:'admin@gka.local',

      password:'Admin@2026!',

      status:'approved'

    });

  }else{

    admin.role='admin';

    admin.username='Admin';

    admin.password='Admin@2026!';

    admin.status='approved';

    if(!admin.name)
      admin.name='Administrator';

    if(!admin.email)
      admin.email='admin@gka.local';

  }


  /* Make sure demo classes exist */

  if(!d.classes.length){

    d.classes=[
      {
        id:'c1',
        name:'JSS1',
        section:'A',
        displayName:'JSS1 A',
        session:'2026/2027'
      },
      {
        id:'c2',
        name:'JSS1',
        section:'B',
        displayName:'JSS1 B',
        session:'2026/2027'
      }
    ];

  }


  /* Make sure subjects exist */

  if(!d.subjects.length){

    d.subjects=[
      'Mathematics',
      'English Language',
      'Physics',
      'Chemistry',
      'Biology',
      'Economics',
      'Hausa',
      'Arabic',
      'French',
      'Computer Studies',
      'Basic Science',
      'Basic Technology',
      'Social Studies',
      'Civic Education',
      'Agricultural Science',
      'Geography',
      'Government',
      'Literature in English',
      'Islamic Religious Studies',
      'Christian Religious Studies',
      'Home Economics',
      'Commerce',
      'Financial Accounting',
      'Further Mathematics'
    ];

  }


  localStorage.setItem(
    DB,
    JSON.stringify(d)
  );

  return d;

}


function save(x){

  localStorage.setItem(
    DB,
    JSON.stringify(x)
  );

}


function me(){

  try{

    return JSON.parse(
      localStorage.getItem(SES)||'null'
    );

  }catch(e){

    return null;

  }

}


function id(p){

  return p+
  '_'+
  Date.now()+
  '_'+
  Math.random()
    .toString(36)
    .slice(2,7);

}


function esc(x){

  return String(x??'')
    .replace(/[&<>'"]/g,m=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'

    }[m]));

}


function toast(x){

  const e=document.getElementById('toast');

  e.textContent=x;

  e.classList.add('on');

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(
    ()=>e.classList.remove('on'),
    2500
  );

}


function log(x){

  const d=db();

  d.activity.unshift({

    action:x,

    user:me()?.name||'System',

    at:new Date().toISOString()

  });

  d.activity=d.activity.slice(0,200);

  save(d);

}


/* =====================================================
   LOGIN
===================================================== */

document
.querySelectorAll('#roleTabs button')
.forEach(b=>{

  b.onclick=()=>{

    document
    .querySelectorAll('#roleTabs button')
    .forEach(x=>
      x.classList.remove('on')
    );

    b.classList.add('on');

  };

});


function signinBox(){

  document
  .getElementById('signin')
  .classList.remove('hidden');

  document
  .getElementById('signup')
  .classList.add('hidden');

}


function registerBox(){

  document
  .getElementById('signin')
  .classList.add('hidden');

  document
  .getElementById('signup')
  .classList.remove('hidden');

}


/* =====================================================
   FIXED LOGIN
===================================================== */

function login(){

  const d=db();

  const input=document
    .getElementById('lid')
    .value
    .trim();

  const password=document
    .getElementById('lpw')
    .value;

  if(!input||!password){

    toast(
      'Enter your username and password'
    );

    return;

  }


  const search=input.toLowerCase();


  const u=d.users.find(x=>

    String(x.username||'')
      .trim()
      .toLowerCase()===search

    ||

    String(x.email||'')
      .trim()
      .toLowerCase()===search

    ||

    String(x.staffId||'')
      .trim()
      .toLowerCase()===search

    ||

    String(x.studentId||'')
      .trim()
      .toLowerCase()===search

  );


  if(!u){

    toast('Account not found');

    return;

  }


  if(String(u.password)!==
     String(password)){

    toast('Incorrect password');

    return;

  }


  /* Admin is always approved */

  if(u.role==='admin'){

    u.status='approved';

    u.username='Admin';

    u.password='Admin@2026!';

    save(d);

  }

  else if(u.status!=='approved'){

    toast(
      'Account awaiting approval'
    );

    return;

  }


  localStorage.setItem(

    SES,

    JSON.stringify({

      id:u.id,

      role:u.role,

      name:u.name

    })

  );


  log('Signed in');

  boot();

}


function register(){

  const d=db();

  const role=
    document.getElementById('rr').value;

  const n=
    document.getElementById('rn').value.trim();

  const e=
    document.getElementById('re').value
      .trim()
      .toLowerCase();

  const p=
    document.getElementById('r1').value;

  const p2=
    document.getElementById('r2').value;

  const rid=
    document.getElementById('rid').value.trim();


  if(!n||!e||!p||p!==p2){

    toast(
      'Complete the form and match passwords'
    );

    return;

  }


  if(d.users.some(x=>

    String(x.email||'')
      .toLowerCase()===e

  )){

    toast(
      'Email already exists'
    );

    return;

  }


  const u={

    id:id('u'),

    role:role,

    name:n,

    email:e,

    phone:
      document.getElementById('rp').value.trim(),

    password:p,

    status:'pending'

  };


  if(role==='teacher')
    u.staffId=rid;

  if(role==='student')
    u.studentId=rid;


  if(role==='parent')
    u.children=[];


  d.users.push(u);

  save(d);

  toast(
    'Registration submitted for approval'
  );

  signinBox();

}


/* =====================================================
   SESSION
===================================================== */

function logout(){

  localStorage.removeItem(SES);

  location.reload();

}


function boot(){

  const s=me();

  if(!s){

    document
    .getElementById('login')
    .classList.remove('hidden');

    return;

  }


  const d=db();

  const u=d.users.find(
    x=>x.id===s.id
  );


  if(!u){

      ['docs','📚 My Documents'],

      ['assistant','🤖 Teacher Assistant'],

  const seen=new Set();

  a=a.filter(x=>{

    if(seen.has(x[0]))

    seen.add(x[0]);

    return true;

  });


  document
  .getElementById('nav')
  .innerHTML=

    a.map((x,i)=>`

      <button
        class="${i===0?'on':''}"
        onclick="page('${x[0]}',this)">

/* =====================================================
   CLASS NORMALIZATION
===================================================== */

function normalizeClassBase(value){

  let v=String(value??'')
    .trim()
    .replace(/\s+/g,' ');


  /*
     Remove repeated trailing
     section letters.
  */

  while(
    /\s+(A|B|C)$/i.test(v)
  ){

    v=v
      .replace(
        /\s+(A|B|C)$/i,
        ''
      )
      .trim();

  }


  return v;

}


function normalizeSection(value){

  const v=
    String(value??'')
      .trim()
      .toUpperCase();

  return ['A','B','C'].includes(v)
    ?v
    :'';

}


function formatClassName(
  className,
  section
){

  const base=
    normalizeClassBase(className);

  const sec=
    normalizeSection(section);

  return sec
    ?base+' '+sec
    :base;

}


function classDisplay(c){

  return formatClassName(
    c.name||c.className,
    c.section
  );

}


/* =====================================================
   NORMALIZE OLD DATA
===================================================== */

function normalizeAllClasses(){

  const d=db();

  let changed=false;


  d.classes=
    (d.classes||[])
    .map(c=>{

      let oldName=
        String(
          c.name||c.className||''
        )
        .trim();


      let oldSection=
        normalizeSection(
          c.section
        );


      let embeddedMatches=
        oldName.match(
          /\s+(A|B|C)(?:\s+(A|B|C))*$/i
        );


      let embeddedSection='';


      if(embeddedMatches){

        const parts=
          embeddedMatches[0]
            .trim()
            .split(/\s+/);

        embeddedSection=
          normalizeSection(
            parts[parts.length-1]
          );

      }


      const sec=
        oldSection||
        embeddedSection||
        'A';


      const name=
        normalizeClassBase(
          oldName
        );


      const display=
        formatClassName(
          name,
          sec
        );


      if(
        c.name!==name||
        c.section!==sec||
        c.displayName!==display
      ){

        changed=true;

        c={

          ...c,

          name:name,

          section:sec,

          displayName:display

        };

      }


      return c;

    });


  /* Clean student classes */

  (d.students||[])
  .forEach(st=>{

    if(!st.className)return;


    let section=
      normalizeSection(
        st.section
      );


    const match=
      String(st.className)
      .match(
        /\s+(A|B|C)(?:\s+(A|B|C))*$/i
      );


    if(!section&&match){

      const parts=
        match[0]
          .trim()
          .split(/\s+/);

      section=
        normalizeSection(
          parts[parts.length-1]
        );

    }


    const clean=
      normalizeClassBase(
        st.className
      );


    if(st.className!==clean){

      st.className=clean;

      changed=true;

    }


    if(
      section&&
      st.section!==section
    ){

      st.section=section;

      changed=true;

    }

  });


  /* Clean teacher class assignments */

  (d.users||[])
  .filter(u=>u.role==='teacher')
  .forEach(t=>{

    if(!Array.isArray(t.classes))
      t.classes=[];


    t.classes=t.classes
      .map(x=>{

        const value=
          String(x||'')
            .trim()
            .replace(/\s+/g,' ');


        const match=
          value.match(
            /\s+(A|B|C)$/i
          );


        if(match){

          const sec=
            normalizeSection(
              match[1]
            );

          return formatClassName(
            value,
            sec
          );

        }


        return value;

      })
      .filter(Boolean);

  });


  if(changed)
    save(d);


  return d;

}

function addClass(){

  const n=prompt(
    'Class name (example: SS1, SS1 A or SS1 B)'
  );


  if(!n)return;


  const raw=n
    .trim()
    .replace(/\s+/g,' ');


  if(!raw){

    toast('Enter a valid class');

    return;

  }


  const matches=
    raw.match(
      /(?:^|\s)(A|B|C)(?:\s+(A|B|C))*$/i
    );


  let sec='A';


  if(matches){

    const pieces=
      matches[0]
        .trim()
        .split(/\s+/);

    sec=
      normalizeSection(
        pieces[pieces.length-1]
      );

  }


  const base=
    normalizeClassBase(raw);


  if(!base){

    toast('Enter a valid class');

    return;

  }


  const display=
    formatClassName(
      base,
      sec
    );


  const d=
    normalizeAllClasses();


  const exists=
    d.classes.some(c=>

      formatClassName(
        c.name,
        c.section
      )
      .toLowerCase()
      ===
      display.toLowerCase()

    );


  if(exists){

    toast(
      'That class already exists'
    );

    return;

  }


  d.classes.push({

    id:id('c'),

    name:base,

    section:sec,

    displayName:display,

    session:'2026/2027'

  });


  save(d);

  toast(
    'Class '+display+' created'
  );

  log(
    'Created class '+display
  );

  classes(
    d.users.find(
      x=>x.id===me().id
    )
  );

}

}

function loadAtt(){

  const d=db();

  const cl=
    document.getElementById('ac')
      .value;

  const date=
    document.getElementById('ad')
      .value;


  const ss=
    d.students.filter(s=>

      formatClassName(
        s.className,
        s.section
      ).toLowerCase()
      ===
      cl.toLowerCase()

    );


  const old=
    d.attendance.filter(a=>

      formatClassName(
        a.className,
        a.section
      ).toLowerCase()
      ===
      cl.toLowerCase()

      &&

      a.date===date

    );


  const dt=
    new Date(date+'T00:00:00');


  const days=[
    'SUN',
    'MON',
    'TUE',
    'WED',
    'THU',
    'FRI',
    'SAT'
  ];


  const dayName=
    days[dt.getDay()];


  document.getElementById(
    'attSheet'
  ).innerHTML=`

    <div style="
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      align-items:center">

      <div>

        <h3 style="margin:0">
          ${esc(cl)}
        </h3>

        <small>

          ${dayName}
          ${dt.getDate()}
          ·
          ${dt.toLocaleDateString()}

        </small>

      </div>


      <button
        class="btn"
        onclick="
          saveAtt(
            '${esc(cl)}',
            '${esc(date)}'
          )
        ">

        Save Register

      </button>

    </div>


    <div
      class="table"
      style="margin-top:12px">

      <table>

        <tr>

          <th>NO.</th>

          <th>Student Name</th>

          <th>Status</th>

        </tr>

        ${
          ss.map((s,i)=>{

            const q=
              old.find(
                a=>a.studentId===s.id
              );


            const status=
              q?.status||'';


            return `

              <tr data-s="${s.id}">

                <td>
                  ${i+1}
                </td>

                <td>
                  ${esc(s.name)}
                </td>

                <td>

                  <select
                    class="att-status">

                    <option
                      value=""
                      ${
                        status===''
                        ?'selected'
                        :''
                      }>

                      Blank

                    </option>

                    <option
                      value="present"
                      ${
                        status==='present'
                        ?'selected'
                        :''
                      }>

                      P — Present

                    </option>

                    <option
                      value="absent"
                      ${
                        status==='absent'
                        ?'selected'
                        :''
                      }>

                      A — Absent

                    </option>

                  </select>

                </td>

              </tr>

            `;

          }).join('')

          ||

          `
          <tr>
            <td colspan="3"
                class="empty">

              No students registered
              in this class.

            </td>
          </tr>
          `
        }

      </table>

    </div>


    <p style="
      font-size:12px;
      color:#64748b">

      Attendance uses:
      Blank = not marked,
      P = Present,
      A = Absent.

    </p>

  `;

}


function saveAtt(cl,date){

  const d=db();


  d.attendance=
    d.attendance.filter(a=>

      !(
        formatClassName(
          a.className,
          a.section
        ).toLowerCase()
        ===
        cl.toLowerCase()

        &&

        a.date===date
      )

    );


  document
  .querySelectorAll(
    '#attSheet tr[data-s]'
  )
  .forEach(r=>{

    const q=
      r.querySelector(
        '.att-status'
      );


    if(!q||!q.value)return;


    const student=
      d.students.find(
        s=>s.id===r.dataset.s
      );


    if(!student)return;


    d.attendance.push({

      id:id('a'),

      studentId:r.dataset.s,

      className:
        normalizeClassBase(cl),

      section:
        normalizeSection(
          student.section
        ),

      date:date,

      status:q.value,

      term:
        document.getElementById('at')
          .value,

      markedBy:me().id

    });

  });


  save(d);

  toast(
    'Attendance saved'
  );

  log(
    'Saved attendance'
  );

  loadAtt();

}

      <table>

        <tr>

          <th>Type</th>
          <th>Subject</th>
          <th>Class</th>
          <th>Teacher</th>
          <th>Status</th>
          <th>Action</th>

        </tr>

        ${
          a.map(x=>`

            <tr>

              <td>
                ${esc(x.type)}
              </td>

              <td>
                ${esc(x.subject)}
              </td>

              <td>
                ${esc(x.className)}
              </td>

              <td>
                ${esc(
                  x.teacherName||''
                )}
              </td>

              <td>
                <span class="badge">
                  ${esc(x.status)}
                </span>
              </td>

              <td>

                ${
                  u.hod&&
                  x.status==='submitted'

                  ?

                  `

                  <button
                    class="btn"
                    onclick="
                      advance(
                        '${x.id}',
                        'hod-approved'
                      )
                    ">

                    Approve

                  </button>

                  <button
                    class="btn danger"
                    onclick="
                      advance(
                        '${x.id}',
                        'rejected'
                      )
                    ">

                    Reject

                  </button>

                  `

                  :

                  u.examOfficer&&
                  x.status==='hod-approved'

                  ?

                  `

                  <button
                    class="btn"
                    onclick="
                      advance(
                        '${x.id}',
                        'approved'
                      )
                    ">

                    Finalize

                  </button>

                  `

                  :

                  '—'

                }

              </td>

            </tr>

          `).join('')

          ||

          `
          <tr>
            <td colspan="6"
                class="empty">

              No submissions.

            </td>
          </tr>
          `
        }

      </table>

    </div>

  `;

}


function advance(i,s){

  const d=db();

  const x=
    d.submissions.find(
      q=>q.id===i
    );


  if(!x)return;


  x.status=s;

  x.reviewedBy=me().id;

  x.reviewedAt=
    new Date().toISOString();


  save(d);

  toast(
    'Submission updated'
  );

  log(
    'Reviewed submission'
  );


  submissions(
    d.users.find(
      q=>q.id===me().id
    )
  );

}


/* =====================================================
   RESULTS
   CA1 = 15
   CA2 = 15
   EXAM = 70
   TOTAL = 100
===================================================== */

function results(u){

  const d=db();


  let r=
    d.results.filter(
      x=>x.published!==false
    );


  if(u.role==='student'){

    const s=
      d.students.find(
        x=>x.userId===u.id

      x=>x.studentId===s?.id
    );

  if(u.role==='parent'){

      x=>
        (u.children||[])
          .includes(x.studentId)
    );

  }


  document.getElementById(
    'results'
  ).innerHTML=`

    <h2>Results</h2>

    ${
      u.role==='admin'||
      u.role==='teacher'

      ?

      `
      <div class="panel">

        <button
          class="btn"
          onclick="resultModal()">

          Enter Result

        </button>

      </div>
      `

      :''
    }


    <div class="panel table">

      <table>

        <tr>

          <th>Student</th>
          <th>Subject</th>
          <th>CA1 / 15</th>
          <th>CA2 / 15</th>
          <th>Exam / 70</th>
          <th>Total / 100</th>
          <th>Grade</th>

        </tr>

        ${
          r.map(x=>{

            const s=
              d.students.find(
                q=>q.id===x.studentId
              );


            return `

              <tr>

                <td>
                  ${esc(s?.name||'')}
                </td>

                <td>
                  ${esc(x.subject)}
                </td>

                <td>
                  ${x.ca1??0}
                </td>

                <td>
                  ${x.ca2??0}
                </td>

                <td>
                  ${x.exam??0}
                </td>

                <td>
                  <b>${x.total}</b>
                </td>

                <td>

                  <span class="badge">
                    ${esc(x.grade)}
                  </span>

                </td>

              </tr>

            `;

          }).join('')

          ||

          <tr>
            <td colspan="7"

              No published results.

            </td>
          </tr>
          `
        }

      </table>

      CA2 (15) +

    <label>Student</label>

    <select id="rs">

      ${
        d.students.map(s=>`

                s.section
              )
            )}

        `).join('')
      }

        </label>

          value="0">

      </div>


      <div>

        <label>
          CA2 / 15
        </label>

        <input
          id="rca2"
          type="number"
          min="0"
          max="15"
          step="1"
          value="0">

      </div>


      <div>

        <label>
          Exam / 70
        </label>

        <input
          id="rex"

          max="70"
          step="1"
          value="0">

      </div>

    </div>


    <button

      style="margin-top:12px"

      Publish Result

    </button>


    <button
      class="secondary"

  document

function saveResult(){

  const ca1=
    Number(
      document.getElementById('rca1')
        .value
    );


  const ca2=
    Number(
      document.getElementById('rca2')
        .value
    );


  const ex=
    Number(
      document.getElementById('rex')
        .value
    );


  if(
    !Number.isFinite(ca1)||
    !Number.isFinite(ca2)||
    !Number.isFinite(ex)
  ){

    toast(
      'Enter valid marks'
    );

    return;

  }


  if(
    ca1<0||
    ca1>15||
    ca2<0||
    ca2>15||
    ex<0||
    ex>70
  ){

    toast(
      'Maximum marks: CA1 15, CA2 15, Exam 70'
    );

    return;

  }


  const total=
    ca1+ca2+ex;


  const grade=

    total>=75?'A':

    total>=65?'B':

    total>=55?'C':

    total>=45?'D':

    total>=40?'E':

    'F';


  const d=db();


  d.results.push({

    id:id('r'),

    studentId:
      document.getElementById('rs')
        .value,

    subject:
      document.getElementById('rsub')
        .value,

    ca1:ca1,

    ca2:ca2,

    exam:ex,

    total:total,

    grade:grade,

    published:true,

    createdAt:
      new Date().toISOString(),

    enteredBy:me().id

  });


  save(d);

  closeModal();

  toast(
    'Result published'
  );

  log(
    'Published result'
  );


  results(
    d.users.find(
      x=>x.id===me().id
    )
  );

}

function backup(){

  const data=
    JSON.stringify(
      db(),
      null,
      2
    );


  const blob=
    new Blob(
      [data],
      {
        type:'application/json'
      }
    );


  const url=
    URL.createObjectURL(blob);


  const a=
    document.createElement('a');


  a.href=url;

  a.download=
    'GLOBAL-KIDS-ACADEMY-SOKOTO-backup.json';


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );

  toast(
    'Backup downloaded'
  );

}


function restoreBackup(){

  const input=
    document.getElementById(
      'restoreFile'
    );


  const file=
    input?.files?.[0];


  if(!file){

    toast(
      'Select a backup JSON file'
    );

    return;

  }


  const reader=
    new FileReader();


  reader.onload=function(){

    try{

      const data=
        JSON.parse(
          reader.result
        );


      if(
        !data||
        !Array.isArray(data.users)
      ){

        toast(
          'Invalid backup file'
        );

        return;

      }


      /*
         Always preserve the required
         Administrator account.
      */

      let admin=
        data.users.find(
          u=>
            u.role==='admin'||
            String(u.username||'')
              .toLowerCase()==='admin'
        );


      if(!admin){

        data.users.unshift({

          id:'a1',

          role:'admin',

          name:'Administrator',

          username:'Admin',

          email:'admin@gka.local',

          password:'Admin@2026!',

          status:'approved'

        });

      }else{

        admin.role='admin';

        admin.username='Admin';

        admin.password='Admin@2026!';

        admin.status='approved';

      }


      localStorage.setItem(
        DB,
        JSON.stringify(data)
      );


      localStorage.removeItem(SES);


      alert(
        'Backup restored successfully. The application will reload.'
      );


      location.reload();

    }catch(e){

      toast(
        'Could not read backup file'
      );

    }

  };


  reader.readAsText(file);

}
