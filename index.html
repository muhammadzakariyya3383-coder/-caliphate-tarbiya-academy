<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#166534">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Global Kids Academy Sokoto</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  min-width:0;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  width:100%;
  min-width:0;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5f9;
  color:#172033;
}

button,input,select,textarea{
  font:inherit;
  max-width:100%;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

input,select,textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#16a34a;
  box-shadow:0 0 0 2px rgba(22,163,74,.10);
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#14532d,#166534,#15803d);
}

.login-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 50px rgba(0,0,0,.22);
}

.logo{
  width:82px;
  height:82px;
  border-radius:50%;
  background:#166534;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 16px;
  font-size:32px;
  font-weight:800;
  border:5px solid #dcfce7;
}

.login-card h1{
  text-align:center;
  color:#166534;
  font-size:24px;
  margin-bottom:5px;
}

.login-card .school-subtitle{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
  color:#334155;
}

.login-btn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:9px;
  background:#166534;
  color:white;
  font-weight:700;
  font-size:15px;
}

.login-btn:hover{
  background:#14532d;
}

.login-message{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
  font-size:13px;
  display:none;
}

.login-message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.login-message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

/* APP */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:255px;
  flex:0 0 255px;
  background:#14532d;
  color:#fff;
  min-height:100vh;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.sidebar-header{
  padding:20px 16px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.sidebar-logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.sidebar-logo-icon{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#fff;
  color:#166534;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.sidebar-title{
  font-size:15px;
  font-weight:800;
  line-height:1.2;
}

.sidebar-subtitle{
  font-size:10px;
  opacity:.75;
  margin-top:3px;
}

.nav{
  padding:12px 10px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#dcfce7;
  padding:11px 12px;
  border-radius:8px;
  text-align:left;
  margin-bottom:3px;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:10px;
}

.nav button:hover,
.nav button.active{
  background:#166534;
  color:#fff;
}

.logout-btn{
  margin:10px;
  width:calc(100% - 20px);
  padding:11px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:8px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
}

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.mobile-menu{
  display:none;
  border:0;
  background:#166534;
  color:#fff;
  border-radius:7px;
  padding:9px 11px;
}

.top-title{
  font-weight:800;
  color:#14532d;
  font-size:16px;
}

.user-info{
  font-size:12px;
  color:#64748b;
}

.content{
  padding:20px;
  max-width:1600px;
  margin:auto;
}

.page-title{
  font-size:25px;
  color:#14532d;
  margin-bottom:4px;
}

.page-subtitle{
  color:#64748b;
  font-size:13px;
  margin-bottom:20px;
}

/* CARDS */

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 7px rgba(15,23,42,.04);
}

.card-title{
  color:#14532d;
  font-size:16px;
  font-weight:800;
  margin-bottom:14px;
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}

.grid-4{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}

.field{
  min-width:0;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#475569;
  margin-bottom:6px;
}

/* BUTTONS */

.btn{
  border:0;
  padding:10px 14px;
  border-radius:8px;
  font-weight:700;
  font-size:13px;
}

.btn-primary{
  background:#166534;
  color:#fff;
}

.btn-primary:hover{
  background:#14532d;
}

.btn-secondary{
  background:#e2e8f0;
  color:#334155;
}

.btn-success{
  background:#15803d;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-warning{
  background:#d97706;
  color:#fff;
}

.btn-info{
  background:#0369a1;
  color:#fff;
}

.btn-small{
  padding:7px 9px;
  font-size:11px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.toolbar select,
.toolbar input{
  width:auto;
  min-width:150px;
}

/* DASHBOARD */

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:18px;
}

.stat-label{
  color:#64748b;
  font-size:12px;
  font-weight:700;
}

.stat-value{
  color:#14532d;
  font-size:27px;
  font-weight:900;
  margin-top:8px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.quick button{
  border:1px solid #bbf7d0;
  background:#f0fdf4;
  color:#166534;
  padding:18px 10px;
  border-radius:10px;
  font-weight:800;
}

.quick button:hover{
  background:#dcfce7;
}

/* TABLE */

.table-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}

table{
  width:100%;
  border-collapse:collapse;
}

table th,
table td{
  border:1px solid #e2e8f0;
  padding:9px 8px;
  font-size:12px;
}

table th{
  background:#f1f5f9;
  color:#334155;
  font-weight:800;
  white-space:nowrap;
}

table td{
  background:#fff;
}

.register-table{
  min-width:max-content;
}

.register-table .student-name{
  min-width:180px;
  max-width:240px;
  position:sticky;
  left:0;
  z-index:3;
  background:#fff;
}

.register-table th.student-name{
  z-index:5;
  background:#e2e8f0;
}

.day-head{
  min-width:36px;
  width:36px;
  text-align:center;
}

.weekend-head{
  background:#f8fafc!important;
  color:#94a3b8!important;
}

.holiday-head{
  background:#dbeafe!important;
  color:#1e40af!important;
}

.mark{
  min-width:30px;
  width:30px;
  height:30px;
  border:1px solid #cbd5e1;
  border-radius:5px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
  background:#fff;
  user-select:none;
  -webkit-user-select:none;
}

.mark.P{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac;
}

.mark.A{
  background:#fee2e2;
  color:#991b1b;
  border-color:#fca5a5;
}

.mark.PH{
  background:#dbeafe;
  color:#1e40af;
  border-color:#93c5fd;
  cursor:not-allowed;
}

.mark.NA{
  background:#f1f5f9;
  color:#94a3b8;
  border-color:#cbd5e1;
  cursor:not-allowed;
}

.total-col{
  background:#f8fafc!important;
  font-weight:800;
  text-align:center;
}

/* REGISTER */

.register-meta{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  border:1px solid #cbd5e1;
  background:#f8fafc;
  margin-bottom:15px;
}

.register-meta div{
  padding:11px;
  border-right:1px solid #cbd5e1;
}

.register-meta div:last-child{
  border-right:0;
}

.register-meta strong{
  display:block;
  font-size:10px;
  color:#64748b;
  text-transform:uppercase;
  margin-bottom:3px;
}

.register-meta span{
  font-size:13px;
  font-weight:800;
  color:#14532d;
}

.register-summary{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  margin-top:15px;
}

.summary-box{
  border:1px solid #dbeafe;
  background:#f8fafc;
  border-radius:8px;
  padding:12px;
  text-align:center;
}

.summary-box strong{
  display:block;
  font-size:20px;
  color:#14532d;
}

.summary-box span{
  font-size:10px;
  color:#64748b;
  font-weight:700;
  text-transform:uppercase;
}

.register-help{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
  padding:10px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:15px;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:12px;
  font-size:11px;
  color:#475569;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-box{
  width:18px;
  height:18px;
  border:1px solid #cbd5e1;
  border-radius:4px;
}

.legend-p{
  background:#dcfce7;
}

.legend-a{
  background:#fee2e2;
}

.legend-ph{
  background:#dbeafe;
}

.legend-w{
  background:#f8fafc;
}

/* SIGNATURE / VERIFICATION */

.verification-card{
  margin-top:18px;
  border:2px solid #166534;
  border-radius:12px;
  overflow:hidden;
}

.verification-header{
  background:#166534;
  color:#fff;
  padding:13px 15px;
  font-weight:800;
}

.verification-body{
  padding:16px;
}

.verification-person{
  border:1px solid #e2e8f0;
  border-radius:9px;
  padding:14px;
  background:#f8fafc;
}

.verification-person h4{
  color:#14532d;
  font-size:14px;
  margin-bottom:12px;
}

.verification-grid{
  display:grid;
  grid-template-columns:1.3fr 1fr 1fr;
  gap:10px;
}

.verify-check{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:10px;
  font-size:12px;
  font-weight:700;
  color:#334155;
}

.verify-check input{
  width:auto;
}

.status-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#f1f5f9;
}

.status-badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.status-draft{
  background:#e2e8f0;
  color:#475569;
}

.status-verified{
  background:#dcfce7;
  color:#166534;
}

.status-approved{
  background:#dbeafe;
  color:#1e40af;
}

.signature-preview{
  margin-top:12px;
  padding:10px;
  background:#fff;
  border:1px dashed #94a3b8;
  border-radius:7px;
  font-size:11px;
  color:#475569;
}

/* EMPTY */

.empty{
  padding:30px 15px;
  text-align:center;
  color:#64748b;
  font-size:13px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:20px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.modal-header h3{
  color:#14532d;
}

.close{
  border:0;
  background:#fee2e2;
  color:#991b1b;
  width:32px;
  height:32px;
  border-radius:50%;
  font-weight:900;
}

/* TOAST */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  background:#14532d;
  color:#fff;
  padding:12px 16px;
  border-radius:8px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  display:none;
  font-size:13px;
  max-width:320px;
}

.toast.show{
  display:block;
}

/* MOBILE */

@media(max-width:900px){

  .sidebar{
    position:fixed;
    left:-270px;
    top:0;
    z-index:80;
    transition:left .2s ease;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
  }

  .grid-4{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .quick{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .register-meta{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .register-meta div:nth-child(2){
    border-right:0;
  }

  .register-meta div:nth-child(-n+2){
    border-bottom:1px solid #cbd5e1;
  }

  .verification-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  .topbar{
    padding:9px 10px;
  }

  .content{
    padding:10px;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .quick{
    grid-template-columns:1fr;
  }

  .page-title{
    font-size:21px;
  }

  .card{
    padding:13px;
  }

  .toolbar{
    width:100%;
  }

  .toolbar .btn,
  .toolbar select,
  .toolbar input{
    width:100%;
  }

  .register-meta{
    grid-template-columns:1fr;
  }

  .register-meta div{
    border-right:0!important;
    border-bottom:1px solid #cbd5e1;
  }

  .register-meta div:last-child{
    border-bottom:0;
  }

  .register-summary{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .register-summary .summary-box:last-child{
    grid-column:1/-1;
  }

  .user-info{
    display:none;
  }

  .login-card{
    padding:22px 16px;
  }
}

@media(max-width:360px){

  .login-page{
    padding:10px;
  }

  .login-card{
    padding:18px 14px;
    border-radius:15px;
  }

  .login-card h1{
    font-size:20px;
  }

  .logo{
    width:62px;
    height:62px;
    font-size:25px;
  }

  .content{
    padding:8px;
  }

  .card{
    padding:12px;
    border-radius:10px;
  }

  .page-title{
    font-size:20px;
  }

  .page-subtitle{
    font-size:12px;
  }

  .top-title{
    font-size:12px;
  }

  .btn{
    padding:9px 10px;
    font-size:12px;
  }

  input,
  select,
  textarea{
    font-size:14px;
    padding:10px;
  }

  .quick{
    grid-template-columns:1fr;
  }

  .register-meta{
    grid-template-columns:1fr;
  }

  .register-summary{
    grid-template-columns:1fr;
  }

  .register-summary .summary-box:last-child{
    grid-column:auto;
  }
}

@supports(padding:max(0px)){

  .topbar{
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right));
  }

  .content{
    padding-bottom:max(12px,env(safe-area-inset-bottom));
  }
}

button,
.mark,
select{
  touch-action:manipulation;
}

img,
video,
iframe{
  max-width:100%;
}

/* PRINT */

@media print{

  body{
    background:#fff;
  }

  .sidebar,
  .topbar,
  .no-print,
  .toast,
  .toolbar,
  .register-help,
  .legend,
  .login-page{
    display:none!important;
  }

  .main{
    width:100%;
  }

  .content{
    padding:0;
    max-width:none;
  }

  .card{
    border:0;
    box-shadow:none;
    padding:0;
  }

  .register-table{
    font-size:8px;
  }

  .register-table th,
  .register-table td{
    padding:4px;
    font-size:8px;
  }

  .register-table .student-name{
    position:static;
  }

  .verification-card{
    border:1px solid #000;
    margin-top:15px;
  }

  .verification-header{
    background:#fff;
    color:#000;
    border-bottom:1px solid #000;
  }

  .verification-person{
    background:#fff;
    border:1px solid #000;
  }

  .status-box{
    background:#fff;
    border:1px solid #000;
  }

  @page{
    size:A4 landscape;
    margin:8mm;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">

  <div class="login-card">

    <div class="logo">GKA</div>

    <h1>Global Kids Academy</h1>

    <div class="school-subtitle">
      Sokoto • Academic Management System
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label>Login Type</label>
        <select id="loginRole" required>
          <option value="Admin">Administrator</option>
          <option value="Teacher">Teacher</option>
          <option value="Student">Student</option>
          <option value="Parent">Parent</option>
        </select>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input id="loginUsername" type="text" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </div>

      <button class="login-btn" type="submit">
        Sign In
      </button>

      <div id="loginMessage" class="login-message"></div>

    </form>

  </div>

</div>


<!-- APPLICATION -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">

    <div class="sidebar-header">

      <div class="sidebar-logo">

        <div class="sidebar-logo-icon">
          GKA
        </div>

        <div>
          <div class="sidebar-title">
            Global Kids Academy
          </div>

          <div class="sidebar-subtitle">
            Sokoto Academic System
          </div>
        </div>

      </div>

    </div>

    <nav class="nav">

      <button data-page="dashboard" onclick="showPage('dashboard')">
        🏠 Dashboard
      </button>

      <button data-page="teachers" onclick="showPage('teachers')">
        👨‍🏫 Teachers
      </button>

function loadDB(){

  try{

    const saved =
      localStorage.getItem(DB_KEY);

    if(!saved){

      localStorage.setItem(
        DB_KEY,
        JSON.stringify(defaultDB)
      );

      return JSON.parse(
        JSON.stringify(defaultDB)
      );
    }

    const db = JSON.parse(saved);

    return normalizeDB(db);

  }catch(error){

    console.error(error);

    return normalizeDB(
      JSON.parse(JSON.stringify(defaultDB))
    );
  }
}


function normalizeDB(db){

  db.school = db.school || defaultDB.school;
  db.users = db.users || [];
  db.teachers = db.teachers || [];
  db.students = db.students || [];
  db.parents = db.parents || [];
  db.classes = db.classes || defaultDB.classes;
  db.subjects = db.subjects || defaultDB.subjects;
  db.attendance = db.attendance || {};
  db.registerHolidays = db.registerHolidays || {};
  db.registerSignatures = db.registerSignatures || {};
  db.results = db.results || [];
  db.documents = db.documents || [];
  db.settings = db.settings || defaultDB.settings;

  return db;
}

function saveDB(){

  localStorage.setItem(
    DB_KEY,

  );
}

document
  .getElementById("loginForm")
  .addEventListener("submit",function(event){

    event.preventDefault();

    const role =
      document.getElementById("loginRole").value;

    const username =
      document.getElementById("loginUsername").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    let found = null;

    if(
      role === "Admin" &&
      username === ADMIN_USERNAME &&
      password === ADMIN_PASSWORD
    ){

      found = db.users.find(
        u =>
          u.username === ADMIN_USERNAME &&
          u.role === "Admin"
      );

      if(!found){

        found = {
          id:"ADMIN-001",
          username:ADMIN_USERNAME,
          password:ADMIN_PASSWORD,
          role:"Admin",
          name:"School Administrator",
          active:true
        };

        db.users.push(found);

        saveDB();
      }
    }else{

      found = db.users.find(
        u =>
          u.username === username &&
          u.password === password &&
          u.role === role &&
          u.active !== false
      );
    }


    const message =
      document.getElementById("loginMessage");


    if(!found){

      message.className =
        "login-message error";

      message.textContent =
        "Invalid login details.";

      return;
    }


    session = {
      id:found.id,
      username:found.username,
      role:found.role,
      name:found.name
    };


    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify(session)
    );


    message.className =
      "login-message success";

    message.textContent =
      "Login successful.";


    setTimeout(
      startApplication,
      300
    );

  });

    .getElementById("loginPage")

  const name =
    document
      .getElementById("newClassName")
      .value
      .trim();

  if(
    db.classes.some(
      c=>c.name.toLowerCase() === name.toLowerCase()
    )
  ){

    alert("Class already exists.");
    return;
  }


  db.classes.push({
    id:"CLASS-" + Date.now(),
    name
  });


  saveDB();

  closeModal();

  showToast("Class added.");

  renderClasses();
}

function daysInMonth(month){

  const monthNumber =
    new Date(
      `${month} 1, 2026`
    ).getMonth();


  return new Date(
    2026,
    monthNumber + 1,
    0
  ).getDate();
}


function getMonthNumber(month){

  return new Date(
    `${month} 1, 2026`
  ).getMonth();
}


function isWeekend(month,day){

  const date =
    new Date(
      2026,
      getMonthNumber(month),
      day
    );

  const weekday =
    date.getDay();

  return weekday === 0 || weekday === 6;
}


function holidayKey(className,month){

  return className + "___" + month;
}


function attendanceKey(
  className,
  month,
  studentId,
  day
){

  return [
    className,
    month,
    studentId,
    day
  ].join("___");
}


function getHolidayDays(
  className,
  month
){

  return db.registerHolidays[
    holidayKey(className,month)
  ] || [];
}


function renderRegisterWorkspace(
  className,
  month
){

  const workspace =
    document.getElementById(
      "registerWorkspace"
    );


  const students =
    db.students.filter(
      s=>s.className === className
    );


  const totalDays =
    daysInMonth(month);


  const holidays =
    getHolidayDays(
      className,
      month
    );


  let officialSchoolDays = 0;

  for(
    let day=1;
    day<=totalDays;
    day++
  ){

    if(
      !isWeekend(month,day) &&
      !holidays.includes(day)
    ){

      officialSchoolDays++;

    }
  }


  let grandPresent = 0;
  let grandAbsent = 0;


  let rows = "";


  students.forEach(
    (student,index)=>{

      let P = 0;
      let A = 0;


      let cells = "";


      for(
        let day=1;
        day<=totalDays;
        day++
      ){

        const weekend =
          isWeekend(month,day);

        const holiday =
          holidays.includes(day);


        if(weekend){

          cells += `
            <td>
              <span class="mark NA">
                -
              </span>
            </td>
          `;

          continue;
        }


        if(holiday){

          cells += `
            <td>
              <span class="mark PH">
                PH
              </span>
            </td>
          `;

          continue;
        }


        const key =
          attendanceKey(
            className,
            month,
            student.id,
            day
          );


        const status =
          db.attendance[key] || "";


        if(status === "P")
          P++;

        if(status === "A")
          A++;


        cells += `

          <td style="text-align:center">

            <button
              class="mark ${status}"
              onclick="cycleRegisterMark(
                '${escapeJS(className)}',
                '${escapeJS(month)}',
                '${escapeJS(student.id)}',
                ${day}
              )">

              ${status || ""}

            </button>

          </td>

        `;

      }


      grandPresent += P;
      grandAbsent += A;


      const percentage =
        officialSchoolDays > 0
        ?
        Math.round(
          (P / officialSchoolDays) * 100
        )
        :
        0;


      rows += `

        <tr>

          <td class="student-name">
            ${index+1}. ${escapeHTML(student.name)}
          </td>

          ${cells}

          <td class="total-col">
            ${officialSchoolDays}
          </td>

          <td class="total-col">
            ${P}
          </td>

          <td class="total-col">
            ${A}
          </td>

          <td class="total-col">
            ${holidays.length}
          </td>

          <td class="total-col">
            ${percentage}%
          </td>

        </tr>

      `;

    }
  );


  const totalAttendance =
    grandPresent + grandAbsent;


  const classPercentage =
    totalAttendance > 0
    ?
    Math.round(
      grandPresent /
      totalAttendance *
      100
    )

function cycleRegisterMark(
  className,
  month,
  studentId,
  day
){

  const key =
    attendanceKey(
      className,
      month,
      studentId,
      day
    );


  const current =
    db.attendance[key] || "";


  /*
    IMPORTANT:
    Attendance cycle is exactly:
    Blank → P → A → Blank
  */

  const order = [
    "",
    "P",
    "A"
  ];


  const index =
    order.indexOf(current);


  const next =
    order[
      (index + 1) % order.length
    ];


  if(next){

    db.attendance[key] = next;

  }else{

    delete db.attendance[key];

  }


  saveDB();


  renderRegisterWorkspace(
    className,
    month
  );
}


function addPublicHoliday(
  className,
  month
){

  const dayText =
    prompt(
      `Enter the day number(s) for public holiday in ${month}.
Example: 1 or 1,15`
    );


  if(!dayText)
    return;


  const days =
    dayText
      .split(",")
      .map(x=>parseInt(x.trim()))
      .filter(
        x=>
          Number.isInteger(x) &&
          x>=1 &&
          x<=daysInMonth(month)
      );


  if(!days.length){

    alert("No valid day was entered.");
    return;
  }


  const key =
    holidayKey(
      className,
      month
    );


  db.registerHolidays[key] =
    Array.from(
      new Set([
        ...(db.registerHolidays[key] || []),
        ...days
      ])
    ).sort(
      (a,b)=>a-b
    );


  saveDB();


  renderRegisterWorkspace(
    className,
    month
  );


  showToast(
    "Public holiday added."
  );
}


function clearRegisterMonth(
  className,
  month
){

  if(
    !confirm(
      `Clear all attendance marks for ${className} in ${month}?`
    )
  )
    return;


  Object.keys(db.attendance)
    .forEach(key=>{

      if(
        key.startsWith(
          className + "___" + month + "___"
        )
      ){

        delete db.attendance[key];

      }

    });


  saveDB();


  renderRegisterWorkspace(
    className,
    month
  );


  showToast(
    "Attendance marks cleared."
  );
}


/* =========================================================
   REGISTER VERIFICATION
   ========================================================= */

function getRegisterStatusClass(data){

  if(
    data &&
    data.classTeacherVerified &&
    data.hodVerified &&
    data.principalVerified
  ){

    return "status-approved";

  }


  if(
    data &&
    (
      data.classTeacherVerified ||
      data.hodVerified
    )
  ){

    return "status-verified";

  }


  return "status-draft";
}


function getRegisterStatusText(data){

  if(
    data &&
    data.classTeacherVerified &&
    data.hodVerified &&
    data.principalVerified
  ){

    return "Approved";

  }


  if(
    data &&
    (
      data.classTeacherVerified ||
      data.hodVerified
    )
  ){

    return "Verified";

  }


  return "Draft";
}


function saveRegisterVerification(
  className,
  month
){

  const key =
    holidayKey(
      className,
      month
    );


  db.registerSignatures[key] = {

    classTeacherName:
      document.getElementById(
        "classTeacherName"
      )?.value.trim() || "",

    classTeacherSignature:
      document.getElementById(
        "classTeacherSignature"
      )?.value.trim() || "",

    classTeacherDate:
      document.getElementById(
        "classTeacherDate"
      )?.value || "",

    classTeacherVerified:
      document.getElementById(
        "classTeacherVerified"
      )?.checked || false,


    hodName:
      document.getElementById(
        "hodName"
      )?.value.trim() || "",

    hodSignature:
      document.getElementById(
        "hodSignature"
      )?.value.trim() || "",

    hodDate:
      document.getElementById(
        "hodDate"
      )?.value || "",

    hodVerified:
      document.getElementById(
        "hodVerified"
      )?.checked || false,


    principalName:
      document.getElementById(
        "principalName"
      )?.value.trim() || "",

    principalSignature:
      document.getElementById(
        "principalSignature"
      )?.value.trim() || "",

    principalDate:
      document.getElementById(
        "principalDate"
      )?.value || "",

    principalVerified:
      document.getElementById(
        "principalVerified"
      )?.checked || false,


    savedAt:
      new Date().toISOString()

  };


  saveDB();


  renderRegisterWorkspace(
    className,
    month
  );


  showToast(
    "Register verification saved successfully."
  );
}


function clearRegisterVerification(
  className,
  month
){

  if(
    !confirm(
      "Clear the names, signatures and verification status for this register?"
    )
  )
    return;


  delete db.registerSignatures[
    holidayKey(
      className,
      month
    )
  ];


  saveDB();


  renderRegisterWorkspace(
    className,
    month
  );


  showToast(
    "Verification cleared."
  );
}

          <input id="resultCA2" type="number"
            min="0" max="15" required>
        </div>

        <div class="field">

          <input id="resultExam" type="number"
            min="0" max="70" required>

function saveResult(event){

  event.preventDefault();


  const student =
    db.students.find(
      s=>
        s.id ===
        document.getElementById(
          "resultStudent"
        ).value
    );


  const subject =
    document.getElementById(
      "resultSubject"
    ).value;


  const ca1 =
    Number(
      document.getElementById(
        "resultCA1"
      ).value
    );


  const ca2 =
    Number(
      document.getElementById(
        "resultCA2"
      ).value
    );


  const exam =
    Number(
      document.getElementById(
        "resultExam"
      ).value
    );


  const total =
    ca1 + ca2 + exam;


  let grade = "F";

  if(total >= 70)
    grade = "A";

  else if(total >= 60)
    grade = "B";

  else if(total >= 50)
    grade = "C";

  else if(total >= 45)
    grade = "D";

  else if(total >= 40)
    grade = "E";


  db.results.push({

    id:"RES-" + Date.now(),

    studentId:student.id,

    studentName:student.name,

    className:student.className,

    subject,

    ca1,

    ca2,

    exam,

    total,

    grade,

    published:false

  });


  saveDB();

  closeModal();

  renderResults();

  showToast(
    "Result saved successfully."
  );
}

function approveDocument(id){

  const doc =
    db.documents.find(
      d=>d.id === id
    );


  if(!doc)
    return;


  doc.status =
    "Approved";


  doc.approvedAt =
    new Date().toISOString();


  saveDB();

  renderApproval();

  showToast(
    "Document approved and archived."
  );
}


function rejectDocument(id){

  const doc =
    db.documents.find(
      d=>d.id === id
    );


  if(!doc)
    return;


  doc.status =
    "Rejected";


  saveDB();

  renderApproval();

  showToast(
    "Document rejected."
  );
}

function renderArchive(){

  content.innerHTML = `

  `;
}


function archiveTable(items){

  if(!items.length){

    return `
      <div class="empty">
        No approved work in the archive.
      </div>
    `;

  }


  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Title</th>
            <th>Type</th>
            <th>Class</th>
            <th>Subject</th>
            <th>Approved</th>
          </tr>

        </thead>

        <tbody>

          ${
            items.map(d=>`

              <tr>

                <td>
                  ${escapeHTML(d.title)}
                </td>

                <td>
                  ${escapeHTML(d.type)}
                </td>

                <td>
                  ${escapeHTML(d.className)}
                </td>

                <td>
                  ${escapeHTML(d.subject)}
                </td>

                <td>
                  ${d.approvedAt
                    ?
                    new Date(
                      d.approvedAt
                    ).toLocaleDateString()
                    :
                    ""
                  }
                </td>

              </tr>

            `).join("")
          }

        </tbody>

      </table>

    </div>

  `;
}


function filterArchive(){

  const search =
    document
      .getElementById("archiveSearch")
      .value
      .toLowerCase();


  const items =
    db.documents.filter(
      d=>
        d.status === "Approved" &&
        (
          d.title.toLowerCase().includes(search) ||
          d.type.toLowerCase().includes(search) ||
          d.className.toLowerCase().includes(search) ||
          d.subject.toLowerCase().includes(search)
        )
    );


  document.getElementById(
    "archiveTable"
  ).innerHTML =
    archiveTable(items);
}

/* =========================================================
   BACKUP / RESTORE
   ========================================================= */

function backupDatabase(){

  const data =
    JSON.stringify(
      db,
      null,
      2
    );


  const blob =
    new Blob(
      [data],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "Global-Kids-Academy-Backup-" +
    new Date()
      .toISOString()
      .slice(0,10) +
    ".json";


  a.click();


  URL.revokeObjectURL(url);


  showToast(
    "Database backup downloaded."
  );
}


function restoreDatabase(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        const restored =
          normalizeDB(
            JSON.parse(
              e.target.result
            )
          );


        if(
          !confirm(
            "Restore this database? Current local data will be replaced."
          )
        )
          return;


        db = restored;

        saveDB();

        showToast(
          "Database restored successfully."
        );


        setTimeout(
          ()=>location.reload(),
          700
        );


      }catch(error){

        alert(
          "Invalid backup file."
        );

      }

    };


  reader.readAsText(file);
}

/* =========================================================

   ========================================================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    ()=>{
      toast.classList.remove(
        "show"
      );
    },
    2500
  );
}


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}


function escapeAttr(value){

  return escapeHTML(value);
}


function escapeJS(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );
}


function accessDenied(){

  return `

    <div class="card">

      <div class="empty">

        <h3 style="color:#991b1b;margin-bottom:8px">
          Access Restricted
        </h3>

        This section is available to the
        Administrator only.

      </div>

    </div>

  `;
}
