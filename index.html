<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<title>Caliphate Tarbiya Academy Sokoto</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f7f4;color:#172018}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
--green:#166534;--dark:#064e3b;--light:#ecfdf5;
--border:#d9e4dc;--red:#b91c1c;--orange:#b45309;
--blue:#1d4ed8;--gray:#64748b
}

#loginScreen{
min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:20px;background:linear-gradient(135deg,#064e3b,#166534,#15803d)
}
.login-card{
width:100%;max-width:430px;background:#fff;border-radius:20px;
padding:28px;box-shadow:0 15px 50px rgba(0,0,0,.25)
}
.logo{
width:70px;height:70px;border-radius:50%;background:var(--green);color:#fff;
display:flex;align-items:center;justify-content:center;font-size:24px;
font-weight:bold;margin:auto auto 15px
}
.login-card h1{text-align:center;color:var(--green);font-size:23px;margin:0}
.login-card p{text-align:center;color:#64748b;margin:8px 0 22px}

label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.form-group{margin-bottom:14px}
input,select,textarea{
width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;
background:#fff;outline:none
}
input:focus,select:focus,textarea:focus{
border-color:var(--green);box-shadow:0 0 0 3px #dcfce7
}

.btn{
border:0;border-radius:8px;padding:10px 14px;font-weight:700;
background:var(--green);color:#fff
}
.btn.small{padding:6px 9px;font-size:12px}
.btn.success{background:#15803d}
.btn.danger{background:#b91c1c}
.btn.warning{background:#b45309}
.btn.blue{background:#1d4ed8}
.btn.secondary{background:#475569}
.btn.light{background:#dcfce7;color:#166534}

.sidebar{
position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--dark);
color:#fff;overflow-y:auto;z-index:50
}
.brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.15)}
.brand h2{margin:0;font-size:18px}
.brand small{display:block;margin-top:5px;opacity:.75}
.nav{padding:12px}
.nav button{
width:100%;border:0;background:transparent;color:#fff;text-align:left;
padding:11px 13px;margin:2px 0;border-radius:8px
}
.nav button:hover,.nav button.active{background:#166534}

.main{margin-left:260px;min-height:100vh}
.topbar{
position:sticky;top:0;z-index:30;background:#fff;
border-bottom:1px solid var(--border);padding:14px 20px;
display:flex;align-items:center;justify-content:space-between
}
.topbar h1{font-size:21px;margin:0;color:#14532d}
.user-info{font-size:13px;color:#475569}
.content{padding:20px;max-width:1800px;margin:auto}

.cards{
display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px
}
.card{
background:#fff;border:1px solid var(--border);border-radius:13px;
padding:17px;box-shadow:0 4px 18px rgba(0,0,0,.08)
}
.card h3{margin:0 0 8px;font-size:14px;color:#64748b}
.card .number{font-size:27px;font-weight:bold;color:var(--green)}

.panel{
background:#fff;border:1px solid var(--border);border-radius:13px;
margin-bottom:20px;box-shadow:0 4px 18px rgba(0,0,0,.06);overflow:hidden
}
.panel-head{
padding:15px 17px;border-bottom:1px solid var(--border);
display:flex;justify-content:space-between;align-items:center;gap:10px
}
.panel-head h2{font-size:17px;margin:0;color:#14532d}
.panel-body{padding:17px}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}

.table-wrap{
overflow:auto;border:1px solid #dbe4dd;border-radius:8px
}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{
padding:9px;border-bottom:1px solid #e2e8f0;
text-align:left;font-size:13px
}
th{background:#f0fdf4;color:#14532d}

.badge{
display:inline-block;padding:4px 8px;border-radius:20px;
font-size:11px;font-weight:bold;background:#e2e8f0;color:#334155
}
.badge.green{background:#dcfce7;color:#166534}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.yellow{background:#fef3c7;color:#92400e}
.badge.blue{background:#dbeafe;color:#1e40af}

.notice{
padding:12px 14px;background:#ecfdf5;border-left:4px solid var(--green);
border-radius:7px;margin-bottom:15px;font-size:13px
}
.stat-box{
background:#f8fafc;border:1px solid var(--border);
border-radius:9px;padding:12px
}
.stat-box strong{
font-size:20px;color:var(--green);display:block
}

.modal{
position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
align-items:center;justify-content:center;z-index:100;padding:15px
}
.modal.show{display:flex}
.modal-box{
background:#fff;border-radius:15px;width:100%;max-width:700px;
max-height:92vh;overflow:auto
}
.modal-head{
padding:15px 18px;border-bottom:1px solid var(--border);
display:flex;justify-content:space-between;align-items:center
}
.modal-body{padding:18px}
.close{
border:0;background:#f1f5f9;border-radius:50%;width:32px;height:32px
}
.mobile-menu{
display:none;border:0;background:var(--green);color:#fff;
border-radius:7px;padding:8px 12px
}

/* ================= REGISTER ================= */

.register-title{text-align:center;margin-bottom:14px}
.register-title h2{
margin:0;font-size:21px;text-transform:uppercase;color:#14532d
}
.register-title h3{margin:6px 0;font-size:16px}

.register-meta{
display:grid;grid-template-columns:repeat(4,1fr);
gap:10px;margin-bottom:12px
}
.register-meta div{
border:1px solid #cbd5e1;padding:7px;background:#fff
}
.register-meta b{
display:block;font-size:10px;color:#64748b;
text-transform:uppercase;margin-bottom:3px
}

.register-table{
min-width:1450px;
border-collapse:collapse
}
.register-table th,
.register-table td{
border:1px solid #9ca3af;
padding:5px;
text-align:center
}
.register-table th{
background:#dcfce7;font-size:11px
}
.register-table td{
font-size:11px;height:38px
}
.register-table .student-name{
text-align:left;
min-width:240px;
font-weight:700
}
.register-table .admission{min-width:105px}

.date-head{
min-width:42px;
height:78px;
vertical-align:bottom
}
.date-number{
font-weight:bold;
font-size:12px
}
.day-small{
font-size:9px;
color:#475569;
display:block;
margin-top:2px
}

.weekend-head{
background:#f1f5f9!important;
color:#64748b!important
}
.weekend-cell{
background:#f8fafc!important;
color:#94a3b8
}
.weekend-cell .mark{
background:#f1f5f9;
color:#94a3b8;
border-color:#cbd5e1;
cursor:not-allowed
}

.holiday-head{
background:#dbeafe!important;
color:#1e40af!important
}

.mark{
display:inline-flex;
width:27px;
height:27px;
border:1px solid #cbd5e1;
border-radius:4px;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:11px;
cursor:pointer;
background:#fff;
user-select:none;
-webkit-user-select:none
}
.mark.P{
background:#dcfce7;color:#166534;border-color:#86efac
}
.mark.A{
background:#fee2e2;color:#991b1b;border-color:#fca5a5
}
.mark.S{
background:#fef3c7;color:#92400e;border-color:#fcd34d
}
.mark.PH{
background:#dbeafe;color:#1e40af;border-color:#93c5fd;
cursor:not-allowed
}
.mark.NA{
background:#f1f5f9;color:#94a3b8;border-color:#cbd5e1;
cursor:not-allowed
}

.total-col{
background:#f8fafc!important;
font-weight:bold
}

.register-summary{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:10px;
margin-top:15px
}
.register-summary .stat-box{text-align:center}

.register-footer{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px
}

.signature-card{
border:1px solid #cbd5e1;
border-radius:10px;
padding:12px;
background:#f8fafc;
text-align:center
}
.signature-card h4{
margin:0 0 8px;
color:#14532d
}
.signature-image{
width:100%;
height:90px;
object-fit:contain;
background:#fff;
border-bottom:1px solid #334155;
margin:8px auto
}
.signature-meta{
font-size:11px;
color:#475569;
line-height:1.5
}
.signature-actions{
display:flex;
gap:5px;
justify-content:center;
flex-wrap:wrap;
margin-top:8px
}
.signature-pad-wrap{
border:2px dashed #94a3b8;
border-radius:10px;
background:#fff;
overflow:hidden
}
#signatureCanvas{
width:100%;
height:220px;
display:block;
touch-action:none;
background:#fff
}
.signature-help{
text-align:center;
color:#64748b;
font-size:12px
}
.verify-banner{
padding:12px;
border-radius:8px;
margin-top:15px;
font-weight:bold;
text-align:center
}
.verify-banner.ok{
background:#dcfce7;color:#166534
}
.verify-banner.wait{
background:#fef3c7;color:#92400e
}

.legend{
display:flex;
flex-wrap:wrap;
gap:8px;
align-items:center;
margin:10px 0
}
.legend-item{
display:flex;
align-items:center;
gap:5px;
font-size:12px
}

.register-live-help{
background:#eff6ff;
border:1px solid #bfdbfe;
color:#1e40af;
padding:12px;
border-radius:8px;
font-size:13px;
margin-bottom:15px
}

/* ================= ARCHIVE ================= */

.archive-card{
border:1px solid #d9e4dc;
border-radius:10px;
padding:16px;
margin-bottom:12px;
background:#fff
}
.archive-card h3{
margin:0 0 7px;
color:#14532d
}
.archive-meta{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:8px 0 12px
}
.archive-meta span{
background:#f1f5f9;
padding:5px 8px;
border-radius:5px;
font-size:11px
}
.archive-content{
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:8px;
padding:14px;
white-space:pre-wrap;
line-height:1.6;
max-height:220px;
overflow:auto
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){
.cards{grid-template-columns:repeat(2,1fr)}
.grid4{grid-template-columns:repeat(2,1fr)}
.register-summary{grid-template-columns:repeat(3,1fr)}
.register-meta{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:800px){
.sidebar{
transform:translateX(-100%);
transition:.25s
}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.mobile-menu{display:block}
.grid2,.grid3{grid-template-columns:1fr}
.content{padding:12px}
.topbar{padding:11px 12px}
.topbar h1{font-size:17px}
.register-summary{grid-template-columns:repeat(2,1fr)}

.register-table{
min-width:1450px
}
}

@media(max-width:550px){
.cards,.grid4{grid-template-columns:1fr}
.register-meta,.register-summary{grid-template-columns:1fr}
.login-card{padding:20px}
.register-footer{grid-template-columns:1fr}
}

/* ================= PRINT ================= */

@media print{
body{
background:#fff!important;
color:#000
}

.sidebar,
.topbar,
.no-print,
#loginScreen,
.signature-actions,
.verify-actions{
display:none!important
}

.main{
margin:0!important
}

.content{
padding:0!important;
max-width:none
}

.panel{
box-shadow:none!important;
border:0!important;
margin:0!important
}

.panel-body{
padding:0!important
}

.register-table{
min-width:0!important;
width:100%!important
}

.register-table th,
.register-table td{
font-size:7px!important;
padding:3px!important
}

.mark{
width:20px!important;
height:20px!important;
font-size:7px!important
}

.weekend-cell{
background:#f8fafc!important
}

.signature-card{
background:#fff!important;
border:0!important;
break-inside:avoid
}

.signature-image{
height:70px;
max-width:180px
}

.register-footer{
display:grid!important;
grid-template-columns:repeat(3,1fr)!important;
gap:20px!important
}

@page{
size:A4 landscape;
margin:8mm
}
}
</style>
</head>

<body>

<section id="loginScreen">
<div class="login-card">
<div class="logo">CTA</div>
<h1>Caliphate Tarbiya Academy</h1>
<p>Sokoto • Academic Management System</p>

<div class="form-group">
<label>Login Type</label>
<select id="loginRole">
<option value="admin">Administrator</option>
<option value="teacher">Teacher</option>
<option value="student">Student</option>
<option value="parent">Parent</option>
</select>
</div>

<div class="form-group">
<label>Username / Admission No.</label>
<input id="loginUsername">
</div>

<div class="form-group">
<label>Password</label>
<input id="loginPassword" type="password">
</div>

<button class="btn" style="width:100%" onclick="login()">Login</button>

<div class="notice" style="margin-top:15px">
<b>Administrator:</b> Admin<br>
<b>Password:</b> Admin@2026!
</div>
</div>
</section>

<div id="app">
<aside class="sidebar" id="sidebar">
<div class="brand">
<h2>Caliphate Tarbiya Academy</h2>
<small>Academic Management System</small>
</div>
<nav class="nav" id="nav"></nav>
</aside>

<main class="main">
<header class="topbar">
<div style="display:flex;align-items:center;gap:10px">
<button class="mobile-menu" onclick="toggleSidebar()">☰</button>
<h1 id="pageTitle">Dashboard</h1>
</div>
<div class="user-info" id="userInfo"></div>
</header>

<section class="content" id="content"></section>
</main>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<div class="modal-head">
<b id="modalTitle">Form</b>
<button class="close" onclick="closeModal()">×</button>
</div>
<div class="modal-body" id="modalBody"></div>
</div>
</div>

<script>
"use strict";

const DB_KEY="CTA_ACADEMY_ARCHIVE_FINAL_V3";
const SESSION_KEY="CTA_ACADEMY_ARCHIVE_SESSION_V3";

const DEFAULT_CLASSES=[
"Nursery 1","Nursery 2","Nursery 3",
"Basic 1","Basic 2","Basic 3","Basic 4","Basic 5","Basic 6",
"JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"
];

const DEFAULT_SUBJECTS=[
"Mathematics","English Language","Physics","Chemistry","Biology",
"Economics","Hausa","Arabic","French","Computer Studies",
"Basic Science","Basic Technology","Social Studies","Civic Education",
"Agricultural Science","Geography","Government","Literature in English",
"Islamic Religious Studies","Christian Religious Studies","Home Economics",
"Commerce","Financial Accounting","Further Mathematics"
];

function emptyDB(){
return{
accounts:[],
teachers:[],
students:[],
parents:[],
classes:[],
subjects:[],
hodAssignments:[],
documents:[],
approvals:[],
archive:[],
results:[],
attendance:{},
holidays:{},
registerSignatures:{},
settings:{
schoolName:"Caliphate Tarbiya Academy",
location:"Sokoto State",
phone:"",
email:"",
currentSession:"2026/2027",
currentTerm:"First Term"
}
};
}

function loadDB(){
let d=null;

try{
d=JSON.parse(localStorage.getItem(DB_KEY)||"null")
}catch(e){
d=null
}

if(!d)d=emptyDB();

const base=emptyDB();

Object.keys(base).forEach(k=>{
if(d[k]===undefined)d[k]=base[k]
});

d.archive=Array.isArray(d.archive)?d.archive:[];
d.accounts=Array.isArray(d.accounts)?d.accounts:[];
d.teachers=Array.isArray(d.teachers)?d.teachers:[];
d.students=Array.isArray(d.students)?d.students:[];
d.parents=Array.isArray(d.parents)?d.parents:[];
d.classes=Array.isArray(d.classes)?d.classes:[];
d.subjects=Array.isArray(d.subjects)?d.subjects:[];
d.hodAssignments=Array.isArray(d.hodAssignments)?d.hodAssignments:[];
d.documents=Array.isArray(d.documents)?d.documents:[];
d.approvals=Array.isArray(d.approvals)?d.approvals:[];
d.results=Array.isArray(d.results)?d.results:[];
d.attendance=d.attendance||{};
d.holidays=d.holidays||{};
d.registerSignatures=d.registerSignatures||{};
d.settings=d.settings||base.settings;

return d;
}

let db=loadDB();

function uid(p){
return p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
}

function saveDB(){
localStorage.setItem(DB_KEY,JSON.stringify(db))
}

function v(id){
return document.getElementById(id)?.value?.trim()||""
}

function esc(x){
return String(x??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function escAttr(x){
return esc(x)
}

function ensureSetup(){

if(!db.accounts.some(x=>x.role==="admin")){
db.accounts.push({
id:"admin-001",
role:"admin",
username:"Admin",
password:"Admin@2026!",
name:"System Administrator",
active:true
});
}

DEFAULT_CLASSES.forEach(name=>{
if(!db.classes.some(x=>x.name===name)){
db.classes.push({
id:uid("class"),
name,
sections:["A","B"]
});
}
});

DEFAULT_SUBJECTS.forEach(name=>{
if(!db.subjects.some(x=>x.name===name)){
db.subjects.push({
id:uid("subject"),
name
});
}
});

saveDB();
}

ensureSetup();

let session=null;

try{
session=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")
}catch(e){
session=null
}

function currentUser(){

if(!session)return null;

if(session.role==="admin")
return db.accounts.find(x=>x.id===session.id)||null;

if(session.role==="teacher")
return db.teachers.find(x=>x.id===session.id)||null;

if(session.role==="student")
return db.students.find(x=>x.id===session.id)||null;

if(session.role==="parent")
return db.parents.find(x=>x.id===session.id)||null;

return null;
}

function isAdmin(){return session?.role==="admin"}
function isTeacher(){return session?.role==="teacher"}
function isStudent(){return session?.role==="student"}
function isParent(){return session?.role==="parent"}

function login(){

const role=v("loginRole");
const username=v("loginUsername");
const password=document.getElementById("loginPassword").value;

let found=null;

if(role==="admin"){
found=db.accounts.find(x=>
x.role==="admin"&&
String(x.username).toLowerCase()===username.toLowerCase()&&
x.password===password&&
x.active!==false
);
}

if(role==="teacher"){
found=db.teachers.find(x=>
String(x.username||"").toLowerCase()===username.toLowerCase()&&
x.password===password&&
x.active!==false
);
}

if(role==="student"){
found=db.students.find(x=>
String(x.admissionNo||"").toLowerCase()===username.toLowerCase()&&
x.password===password&&
x.active!==false
);
}

if(role==="parent"){
found=db.parents.find(x=>
String(x.username||"").toLowerCase()===username.toLowerCase()&&
x.password===password&&
x.active!==false
);
}

if(!found){
alert("Invalid login details.");
return;
}

session={
id:found.id,
role
};

localStorage.setItem(SESSION_KEY,JSON.stringify(session));
showApp();
}

function logout(){
localStorage.removeItem(SESSION_KEY);
session=null;

document.getElementById("app").style.display="none";
document.getElementById("loginScreen").style.display="flex";
}

function navItem(page,text){
return`<button id="nav-${page}" onclick="go('${page}')">${text}</button>`
}

function buildNav(){

let html=navItem("dashboard","🏠 Dashboard");

if(isAdmin()){
html+=navItem("accounts","👤 Administrator Accounts");
html+=navItem("teachers","👨‍🏫 Teachers");
html+=navItem("students","🎓 Students");
html+=navItem("parents","👪 Parents");
html+=navItem("classes","🏫 Classes & Subjects");
html+=navItem("hod","📚 HOD Assignments");
}

if(isAdmin()||isTeacher()){
html+=navItem("register","📋 School Register");
html+=navItem("results","📊 Results");
html+=navItem("documents","📝 Academic Documents");
html+=navItem("approvals","✅ Approval Centre");
html+=navItem("archive","📁 Approved Work Archive");
html+=navItem("assistant","🤖 Teacher Assistant");
}

if(isStudent()||isParent()){
html+=navItem("results","📊 My Results");
html+=navItem("register","📋 My Attendance");
}

if(isAdmin()){
html+=navItem("settings","⚙️ School Settings");
html+=navItem("backup","💾 Backup & Restore");
}

html+=navItem("profile","👤 My Profile");
html+=`<button onclick="logout()">🚪 Logout</button>`;

document.getElementById("nav").innerHTML=html;
}

function showApp(){

document.getElementById("loginScreen").style.display="none";
document.getElementById("app").style.display="block";

buildNav();

const u=currentUser();

document.getElementById("userInfo").textContent=
(u?.name||u?.username||"User")+" • "+session.role;

go("dashboard");
}

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("open")
}

function go(page){

document.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

document.getElementById("nav-"+page)?.classList.add("active");

document.getElementById("sidebar").classList.remove("open");

const titles={
dashboard:"Dashboard",

/* =========================================================
LIVE SCHOOL REGISTER + DIGITAL SIGNATURE
========================================================= */

let registerState={
session:"",
term:"",
className:"",
section:"A",
month:"",
year:""
};

function initialiseRegisterState(){

const now=new Date();

if(!registerState.session)
registerState.session=db.settings.currentSession;

if(!registerState.term)
registerState.term=db.settings.currentTerm;

if(!registerState.className)
registerState.className=db.classes[0]?.name||"";

if(!registerState.month)
registerState.month=String(now.getMonth()+1);

if(!registerState.year)
registerState.year=String(now.getFullYear());
}

function getRegisterKey(){

return[
registerState.session,
registerState.term,
registerState.className,
registerState.section,
registerState.month,
registerState.year
].join("|");
}

function getRegisterSignatureRecord(){

const key=getRegisterKey();

if(!db.registerSignatures[key]){

db.registerSignatures[key]={
classTeacher:null,
hod:null,
principal:null,
locked:false,
verifiedAt:null,
verifiedBy:null
};

}

return db.registerSignatures[key];
}

function registerIsLocked(){

return getRegisterSignatureRecord().locked===true;
}

function canSignRegisterRole(role){

if(isAdmin())return true;

if(!isTeacher())return false;

const u=currentUser();

if(role==="classTeacher")
return true;

if(role==="hod"){

return u?.roleTitle==="HOD" ||
db.hodAssignments.some(
a=>a.teacherId===u?.id
);

}

return false;
}

function signatureLabel(role){

if(role==="classTeacher")
return"Class Teacher";

if(role==="hod")
return"Head of Department";

return"Principal / Head Teacher";
}

let signatureRole=null;
let signatureCanvas=null;
let signatureCtx=null;
let signatureDrawing=false;

function openSignaturePad(role){

if(registerIsLocked()){

alert(
"This register is verified and locked. An Administrator must unlock it before signing again."
);

return;
}

if(!canSignRegisterRole(role)){

alert(
"You are not authorised to sign this register in this role."
);

return;
}

signatureRole=role;

openModal(
"Digital Signature — "+signatureLabel(role),
`

<div class="notice">

<b>${signatureLabel(role)}</b><br>

Sign directly on the screen using your finger or stylus.

</div>

<div class="signature-pad-wrap">

<canvas id="signatureCanvas"></canvas>

</div>

<p class="signature-help">
Use your finger or stylus inside the box above.
</p>

<div class="toolbar">

<button class="btn secondary"
onclick="clearSignatureCanvas()">
Clear
</button>

<button class="btn"
onclick="saveSignaturePad('${role}')">
Save Signature
</button>

</div>
`);

setTimeout(initSignatureCanvas,80);
}

function initSignatureCanvas(){

signatureCanvas=
document.getElementById("signatureCanvas");

if(!signatureCanvas)return;

const rect=
signatureCanvas.getBoundingClientRect();

const ratio=
Math.max(window.devicePixelRatio||1,1);

signatureCanvas.width=
rect.width*ratio;

signatureCanvas.height=
rect.height*ratio;

signatureCtx=
signatureCanvas.getContext("2d");

signatureCtx.scale(ratio,ratio);

signatureCtx.strokeStyle="#111827";
signatureCtx.lineWidth=3;
signatureCtx.lineCap="round";
signatureCtx.lineJoin="round";

signatureCanvas.addEventListener(
"pointerdown",
startSignature
);

signatureCanvas.addEventListener(
"pointermove",
drawSignature
);

signatureCanvas.addEventListener(
"pointerup",
endSignature
);

signatureCanvas.addEventListener(
"pointercancel",
endSignature
);
}

function signaturePoint(e){

const r=
signatureCanvas.getBoundingClientRect();

return{
x:e.clientX-r.left,
y:e.clientY-r.top
};
}

function startSignature(e){

e.preventDefault();

signatureDrawing=true;

const p=signaturePoint(e);

signatureCtx.beginPath();

signatureCtx.moveTo(p.x,p.y);
}

function drawSignature(e){

if(!signatureDrawing)return;

e.preventDefault();

const p=signaturePoint(e);

signatureCtx.lineTo(p.x,p.y);

signatureCtx.stroke();
}

function endSignature(e){

signatureDrawing=false;

if(e)e.preventDefault();
}

function clearSignatureCanvas(){

if(!signatureCanvas||!signatureCtx)return;

const r=
signatureCanvas.getBoundingClientRect();

signatureCtx.clearRect(
0,
0,
r.width,
r.height
);
}

function saveSignaturePad(role){

if(!signatureCanvas)return;

const dataUrl=
signatureCanvas.toDataURL("image/png");

const blank=
document.createElement("canvas");

blank.width=signatureCanvas.width;
blank.height=signatureCanvas.height;

if(
signatureCanvas.toDataURL()===
blank.toDataURL()
){

alert("Please sign before saving.");
return;
}

const u=currentUser();

const rec=getRegisterSignatureRecord();

rec[role]={
dataUrl,
name:u?.name||u?.username||"Authorized Signatory",
userId:u?.id||"",
signedAt:new Date().toISOString()
};

rec.locked=false;
rec.verifiedAt=null;
rec.verifiedBy=null;

saveDB();
closeModal();
renderRegister();
}

/* ================= LIVE ATTENDANCE MARKING ================= */

function cycleRegisterMark(studentId,date){

if(registerIsLocked()){

alert(
"This register is verified and locked. An Administrator must unlock it before changes can be made."
);

return;
}

if(isPublicHoliday(date)){

alert(
"This date is a Public Holiday."
);

return;
}

const d=new Date(date+"T00:00:00");

const dow=d.getDay();

if(dow===0||dow===6){

alert(
"This is a weekend. It is not a school day."
);

return;
}

const key=
attendanceKey(
registerState.session,
registerState.term,
studentId,
date
);

const order=[
"",
"P",
"A",
"S"
];

const current=
db.attendance[key]||"";

const index=
order.indexOf(current);

const next=
order[(index+1)%order.length];

if(next)
db.attendance[key]=next;
else
delete db.attendance[key];

saveDB();
renderRegister();
}

/* ================= BULK MARKING ================= */

function markAllRegister(status){

if(registerIsLocked()){

alert(
"This register is verified and locked. An Administrator must unlock it before changes can be made."
);

return;
}

const students=
getRegisterStudents();

const days=
schoolDaysForMonth(
Number(registerState.year),
Number(registerState.month)
);

if(!students.length)
return alert("No students found.");

if(!confirm(
"Mark all students as "+status+
" for all official school days in this month?"
))
return;

students.forEach(student=>{

days.forEach(day=>{

const date=dateKey(day);

if(isPublicHoliday(date))
return;

db.attendance[
attendanceKey(
registerState.session,
registerState.term,
student.id,
date
)
]=status;

});

});

saveDB();
renderRegister();
}

function approveDocument(id){

if(!isAdmin())return;

const a=
db.approvals.find(
x=>x.id===id
);

if(!a)return;

const d=
db.documents.find(
x=>x.id===a.documentId
);

if(!d)return;

const comment=
prompt(
"Approval comment:",
"Approved"
);

a.status="approved";
a.comment=comment||"Approved";
a.reviewedBy=currentUser().id;
a.reviewedAt=
new Date().toISOString();

d.status="approved";
d.approvedAt=a.reviewedAt;
d.approvedBy=currentUser().id;

let archiveRecord=
db.archive.find(
x=>x.documentId===d.id
);

if(!archiveRecord){

db.archive.push({

id:uid("archive"),
documentId:d.id,
type:d.type,
title:d.title,
subject:d.subject||"",
className:d.className||"",
term:d.term||"",
week:d.week||"",
content:d.content,
createdBy:d.createdBy||"",
createdAt:d.createdAt||
new Date().toISOString(),
approvedBy:currentUser().id,
approvedAt:d.approvedAt,
approvalComment:a.comment

});

}else{

Object.assign(
archiveRecord,
{
content:d.content,
approvedBy:currentUser().id,
approvedAt:d.approvedAt,
approvalComment:a.comment
}
);

}

saveDB();

alert(
"Document approved and added to the Approved Work Archive."
);

renderApprovals();
}

function rejectDocument(id){

if(!isAdmin())return;

const a=
db.approvals.find(
x=>x.id===id
);

if(!a)return;

const comment=
prompt("Reason for rejection:");

if(comment===null)return;

a.status="rejected";
a.comment=comment;
a.reviewedBy=currentUser().id;
a.reviewedAt=
new Date().toISOString();

const d=
db.documents.find(
x=>x.id===a.documentId
);

if(d)d.status="rejected";

saveDB();
renderApprovals();
}

function filterArchive(){

const records=
db.archive.filter(a=>{

const text=[
a.title,
a.type,
a.subject,
a.className,
a.term,
a.week,
a.content
].join(" ").toLowerCase();

return(
(!search||text.includes(search))&&
(!type||a.type===type)&&
(!subject||a.subject===subject)&&
(!className||a.className===className)
);

});

const container=
document.getElementById("archiveList");

container.innerHTML=`

function saveResult(id){

const ca1=Number(v("rCA1"));
const ca2=Number(v("rCA2"));
const exam=Number(v("rExam"));

if(
ca1<0||ca1>15||
ca2<0||ca2>15||
exam<0||exam>70
)
return alert("Invalid marks.");

const total=
ca1+ca2+exam;

const old=
id
?db.results.find(x=>x.id===id)
:null;

const data={
studentId:v("rStudent"),
subjectId:v("rSubject"),
session:v("rSession"),
term:v("rTerm"),
ca1,
ca2,
exam,
total,
grade:getGrade(total),
status:old?.status||"draft",
updatedAt:new Date().toISOString()
};

if(id)
Object.assign(old,data);
else
db.results.push({
id:uid("result"),
...data
});

saveDB();
closeModal();
renderResults();
}

function downloadBackup(){

const blob=
new Blob(
[JSON.stringify(db,null,2)],
{type:"application/json"}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"CTA-Academy-Complete-Backup-"+
new Date().toISOString().slice(0,10)+
".json";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);
}

function restoreBackup(){

const file=
document.getElementById(
"restoreFile"
).files[0];

if(!file)
return alert(
"Select a backup file."
);

const reader=
new FileReader();

reader.onload=function(){

try{

const restored=
JSON.parse(reader.result);

if(
!restored.accounts||
!restored.students||
!restored.teachers
)
throw new Error();

if(!confirm(
"Restore this backup? Current data will be replaced."
))
return;

db=restored;

if(!Array.isArray(db.archive))
db.archive=[];

if(!db.registerSignatures)
db.registerSignatures={};

ensureSetup();

saveDB();

alert(
"Backup restored successfully."
);

showApp();

}catch(e){

alert(
"Invalid backup file."
);

}

};

reader.readAsText(file);
}

function termOptions(selected="First Term"){

return[
"First Term",
"Second Term",
"Third Term"
].map(x=>`

${x===selected?"selected":""}>

</option>

function sessionOptions(selected){

const year=
new Date().getFullYear();

const result=[];

for(let i=-2;i<=3;i++){

const a=year+i;

result.push(
`${a}/${a+1}`
);

}

if(
selected&&!result.includes(selected)
)
result.unshift(selected);

return[
...new Set(result)
].map(x=>`

<option
${x===selected?"selected":""}>

${x}

</option>

`).join("");
}

function monthOptions(selected){

return Array.from(
{length:12},
(_,i)=>{

const m=
String(i+1);

return`

<option
value="${m}"
${m===String(selected)?"selected":""}>

${monthName(m)}

</option>`;

}
).join("");
}

function monthName(m){

return new Date(
2000,
Number(m)-1,
1
).toLocaleString(
"en-US",
{month:"long"}
);
}

/* ================= DATE / ATTENDANCE ================= */

function allCalendarDays(year,month){

const result=[];

const total=
new Date(
year,
month,
0
).getDate();

for(
let day=1;
day<=total;
day++
){

result.push(
new Date(
year,
month-1,
day
)
);

}

return result;
}

function schoolDaysForMonth(year,month){

return allCalendarDays(
year,
month
).filter(d=>{

const day=
d.getDay();

return(
day!==0&&
day!==6&&
!isPublicHoliday(
dateKey(d)
)
);

});
}

function attendanceKey(
session,
term,
studentId,
date
){

return[
session,
term,
studentId,
date
].join("|");
}

function dateKey(d){

const y=
d.getFullYear();

const m=
String(
d.getMonth()+1
).padStart(2,"0");

const day=
String(
d.getDate()
).padStart(2,"0");

return`${y}-${m}-${day}`;
}

/* ================= STUDENT/PARENT ATTENDANCE ================= */

function renderMyAttendance(){

let students=[];

if(isStudent()){

const s=currentUser();

if(s)
students=[s];

}else{

students=
(currentUser()?.children||[])
.map(id=>
db.students.find(
s=>s.id===id
)
)
.filter(Boolean);

}

let html="";

students.forEach(s=>{

let P=0;
let A=0;
let S=0;

Object.keys(
db.attendance
).forEach(key=>{

const parts=
key.split("|");

if(parts[2]===s.id){

const status=
db.attendance[key];

if(status==="P")P++;
if(status==="A")A++;
if(status==="S")S++;

}

});

const total=
P+A+S;

const pct=
total
?(P/total*100).toFixed(1)
:"0.0";

html+=`

<div class="panel">

<div class="panel-head">
<h2>${esc(s.name)}</h2>
</div>

<div class="panel-body">

<p>

<b>Class:</b>
${esc(s.className)}
${esc(s.section||"A")}

&nbsp; | &nbsp;

<b>Admission:</b>
${esc(s.admissionNo)}

</p>

<div class="grid4">

<div class="stat-box">
<strong>${P}</strong>
Present
</div>

<div class="stat-box">
<strong>${A}</strong>
Absent
</div>

<div class="stat-box">
<strong>${S}</strong>
Sick
</div>

<div class="stat-box">
<strong>${pct}%</strong>
Attendance
</div>

</div>

</div>
</div>`;

});

document.getElementById(
"content"
).innerHTML=
html||
`<div class="notice">
No attendance information available.
</div>`;
}

function formatDate(date){

if(!date)return"";

return new Date(date)
.toLocaleString(
"en-NG",
{
day:"2-digit",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);
}
