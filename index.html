<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>Global Kids Academy Sokoto | School Academic Management System</title>

<style>
:root{
  --g:#14532d;
  --g2:#166534;
  --bg:#f5f7f6;
  --card:#fff;
  --line:#dbe3df;
  --txt:#172033;
  --mut:#64748b;
  --red:#b91c1c;
  --gold:#a16207;
}

*{box-sizing:border-box}

body{
  margin:0;
  font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--txt);
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
  background:linear-gradient(135deg,#052e16,#166534);
}

.box{
  background:#fff;
  border-radius:20px;
  padding:24px;
  box-shadow:0 20px 60px #0004;
  width:min(500px,100%);
}

.logo{
  width:60px;
  height:60px;
  background:var(--g);
  color:#fff;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:20px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:16px 0;
}

.tabs button,.secondary{
  border:0;
  background:#e8eeeb;
  color:#173024;
  border-radius:9px;
  padding:10px;
}

.tabs .on{
  background:var(--g);
  color:#fff;
}

.btn{
  border:0;
  background:var(--g);
  color:#fff;
  border-radius:9px;
  padding:10px 14px;
  font-weight:700;
}

.btn:hover{background:var(--g2)}
.danger{background:var(--red)}

label{
  display:block;
  font-weight:700;
  font-size:12px;
  margin:10px 0 5px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  background:#fff;
}

textarea{min-height:110px}

.top{
  height:62px;
  background:var(--g);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:10;
}

.layout{
  display:grid;
  grid-template-columns:245px 1fr;
  min-height:calc(100vh - 62px);
}

aside{
  background:#052e16;
  color:#fff;
  padding:14px;
  position:sticky;
  top:62px;
  height:calc(100vh - 62px);
  overflow:auto;
}

.nav button{
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  color:#d9f5e2;
  border:0;
  padding:11px;
  border-radius:8px;
  margin:2px 0;
}

.nav button:hover,
.nav .on{
  background:#166534;
  color:#fff;
}

main{
  padding:20px;
  max-width:1500px;
  width:100%;
  margin:auto;
}

.page{display:none}
.page.on{display:block}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card,.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:0 5px 18px #0f172a0a;
}

.panel{margin-top:14px}

.num{
  font-size:28px;
  font-weight:800;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.table{overflow:auto}

table{
  border-collapse:collapse;
  width:100%;
  min-width:650px;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

th{background:#f8faf9}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#dcfce7;
  color:#166534;
  font-size:11px;
  font-weight:700;
}

.warn{
  background:#fef3c7;
  color:#92400e;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  place-items:center;
  padding:16px;
  z-index:50;
}

.modal.on{display:grid}

.modal>div{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#111827;
  color:#fff;
  padding:12px 15px;
  border-radius:9px;
  display:none;
  z-index:99;
}

.toast.on{display:block}

.hamb{
  display:none;
  background:none;
  border:0;
  color:#fff;
  font-size:24px;
}

.class-card{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin:8px 0;
  background:#fafcfb;
}

.signature-box{
  border:1px dashed #94a3b8;
  border-radius:10px;
  min-height:130px;
  background:#fff;
}

@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}

  .layout{
    grid-template-columns:1fr;
  }

  aside{
    position:fixed;
    left:-260px;
    width:245px;
    z-index:20;
    transition:.2s;
  }

  .layout.open aside{left:0}

  .hamb{display:inline-block}

  .grid3{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .cards,
  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  main{padding:12px}

  .tabs{
    grid-template-columns:repeat(2,1fr);
  }

  .top{
    padding:0 10px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login" class="login">

<div class="box">

<div class="logo">GKA</div>

<h1>Global Kids Academy Sokoto</h1>

<p style="color:#64748b">
School Academic Management System
</p>

<div class="tabs" id="roleTabs">
<button class="on" data-role="admin">Admin</button>
<button data-role="teacher">Teacher</button>
<button data-role="student">Student</button>
<button data-role="parent">Parent</button>

<div id="signin">

<input id="lid" autocomplete="username">

<label>Password</label>

<button
class="btn"
style="width:100%;margin-top:12px"

class="secondary"
style="width:100%;margin-top:8px"
onclick="registerBox()">

<label>Account type</label>

<select id="rr">
<option value="teacher">Teacher</option>
<option value="student">Student</option>
<option value="parent">Parent</option>
</select>

<label>Full name</label>
<input id="rn">

<label>Email</label>
<input id="re">

<label>Phone</label>
<input id="rp">

<label>Password</label>
<input id="r1" type="password">

<label>Confirm password</label>
<input id="r2" type="password">

<label>Staff / Student ID</label>

class="btn"
style="width:100%;margin-top:12px"

</section>


<!-- APPLICATION -->
<section id="app" class="hidden">

<header class="top">

<div>
<button
class="hamb"
onclick="document.getElementById('layout').classList.toggle('open')">
☰
</button>

<b>Global Kids Academy Sokoto</b>
</div>

<div>
<span id="who"></span>

<button
class="secondary"
onclick="logout()">
Logout
</button>
</div>

</header>


<div id="layout" class="layout">

<aside>
<div id="nav" class="nav"></div>
</aside>


<main>

<section id="dashboard" class="page on"></section>

<section id="attendance" class="page"></section>

<section id="students" class="page"></section>

<section id="teachers" class="page"></section>

<section id="classes" class="page"></section>

<section id="docs" class="page"></section>

<section id="assistant" class="page"></section>

<section id="submissions" class="page"></section>

<section id="results" class="page"></section>

<section id="portal" class="page"></section>

</main>

</section>


<div id="modal" class="modal">
<div id="mb"></div>
</div>

<script>

const DB='GLOBAL_KIDS_ACADEMY_SOKOTO_DATABASE_V1';
const SES='GLOBAL_KIDS_ACADEMY_SOKOTO_SESSION_V1';


/* =========================
   INITIAL DATABASE
========================= */

const seed={

users:[

{
id:'a1',
role:'admin',
name:'Administrator',
username:'Admin',
email:'admin@gka.local',
password:'Admin@2026!',
status:'approved'
},

{
id:'t1',
role:'teacher',
name:'Demo Mathematics Teacher',
email:'teacher@gka.local',
password:'demo-teacher',
status:'approved',
staffId:'T001',
subjects:['Mathematics'],
classes:['JSS1'],
hod:'Mathematics',
examOfficer:false
},

{
id:'t2',
role:'teacher',
name:'Demo English Teacher',
email:'english@gka.local',
password:'demo-teacher',
status:'approved',
staffId:'T002',
subjects:['English'],
classes:['JSS1'],
hod:'',
examOfficer:true
},

{
id:'suser',
role:'student',
name:'Demo Student',
email:'student@gka.local',
password:'demo-student',
status:'approved',
studentId:'GKA/001'
},

{
id:'p1',
role:'parent',
name:'Demo Parent',
email:'parent@gka.local',
password:'demo-parent',
status:'approved',
children:['s1']
}

],

classes:[

{
id:'c1',
name:'JSS1',
section:'A',
displayName:'JSS1 A',
session:'2026/2027'
},

{
id:'c2',
name:'JSS1',
section:'B',
displayName:'JSS1 B',
session:'2026/2027'
}

],

subjects:[
'Mathematics',
'English Language',
'Physics',
'Chemistry',
'Biology',
'Economics',
'Hausa',
'Arabic',
'French',
'Computer Studies',
'Basic Science',
'Basic Technology',
'Social Studies',
'Civic Education',
'Agricultural Science',
'Geography',
'Government',
'Literature in English',
'Islamic Religious Studies',
'Christian Religious Studies',
'Home Economics',
'Commerce',
'Financial Accounting',
'Further Mathematics'
],

students:[

{
id:'s1',
userId:'suser',
name:'Demo Student',
studentId:'GKA/001',
className:'JSS1',
section:'A',
gender:'Male',
session:'2026/2027',
parents:['p1']
}

],

attendance:[],
documents:[],
submissions:[],
results:[],
activity:[]

};


/* =========================
   DATABASE HELPERS
========================= */

function db(){

let x=localStorage.getItem(DB);

if(!x){

localStorage.setItem(
DB,
JSON.stringify(seed)
);

return structuredClone(seed);

}

let d=JSON.parse(x);

d.users=d.users||[];
d.classes=d.classes||[];
d.subjects=d.subjects||[];
d.students=d.students||[];
d.attendance=d.attendance||[];
d.documents=d.documents||[];
d.submissions=d.submissions||[];
d.results=d.results||[];
d.activity=d.activity||[];

return d;

}


function save(x){

localStorage.setItem(
DB,
JSON.stringify(x)
);

}


function me(){

return JSON.parse(
localStorage.getItem(SES)||'null'
);

}


function id(p){

return p+'_'+Date.now()+'_'+
Math.random().toString(36).slice(2,7);

}


function esc(x){

return String(x??'')
.replace(/[&<>'"]/g,m=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'

}[m]));

}


function toast(x){

let e=document.getElementById('toast');

e.textContent=x;

e.classList.add('on');

setTimeout(
()=>e.classList.remove('on'),
2500
);

}


function log(x){

let d=db();

d.activity.unshift({

action:x,

user:me()?.name||'System',

at:new Date().toISOString()

});

d.activity=d.activity.slice(0,200);

save(d);

}


/* =========================
   LOGIN
========================= */

document
.querySelectorAll('#roleTabs button')
.forEach(b=>{

b.onclick=()=>{

document
.querySelectorAll('#roleTabs button')
.forEach(x=>x.classList.remove('on'));

b.classList.add('on');

};

});


function signinBox(){

document
.getElementById('signin')
.classList.remove('hidden');

document
.getElementById('signup')
.classList.add('hidden');

}


function registerBox(){

document
.getElementById('signin')
.classList.add('hidden');

document
.getElementById('signup')
.classList.remove('hidden');

}


function login(){

let d=db();

let v=document
.getElementById('lid')
.value
.trim()
.toLowerCase();

let password=document
.getElementById('lpw')
.value;

let u=d.users.find(x=>

String(x.username||'')
.toLowerCase()===v ||

String(x.email||'')
.toLowerCase()===v ||

String(x.staffId||'')
.toLowerCase()===v ||

String(x.studentId||'')
.toLowerCase()===v

);

if(!u||u.password!==password){

toast('Invalid login details');

return;

}

if(u.status!=='approved'){

toast('Account awaiting approval');

return;

}

localStorage.setItem(
SES,
JSON.stringify({
id:u.id,
role:u.role,
name:u.name
})
);

log('Signed in');

boot();

}


function register(){

let d=db();

let role=document.getElementById('rr').value;

let n=document.getElementById('rn').value.trim();

let e=document.getElementById('re').value.trim().toLowerCase();

let p=document.getElementById('r1').value;

let p2=document.getElementById('r2').value;

if(!n||!e||!p||p!==p2){

toast('Complete the form and match passwords');

return;

}

if(d.users.some(x=>
String(x.email||'').toLowerCase()===e
)){

toast('Email already exists');

return;

}

let u={

id:id('u'),

role:role,

name:n,

email:e,

phone:document.getElementById('rp').value,

password:p,

status:'pending'

};

if(role==='teacher')
u.staffId=document.getElementById('rid').value;

if(role==='student')
u.studentId=document.getElementById('rid').value;

d.users.push(u);

save(d);

toast('Registration submitted for approval');

signinBox();

}


/* =========================
   SESSION
========================= */

function logout(){

localStorage.removeItem(SES);

location.reload();

}


function boot(){

let s=me();

if(!s){

logout();

return;

}

let d=db();

let u=d.users.find(x=>x.id===s.id);

if(!u){

logout();

return;

}

document
.getElementById('login')
.classList.add('hidden');

document
.getElementById('app')
.classList.remove('hidden');

document
.getElementById('who')
.textContent=
u.name+' · '+u.role;

navBuild(u);

page('dashboard');

}


/* =========================
   NAVIGATION
========================= */

function navBuild(u){

let a=[
['dashboard','📊 Dashboard']
];

if(u.role==='admin'){

a.push(
['teachers','👨‍🏫 Teachers'],
['students','🎓 Students'],
['classes','🏫 Classes & Subjects'],
['attendance','📝 Attendance'],
['docs','📚 Academic Documents'],
['submissions','✅ Approval Centre'],
['results','📈 Results'],
['settings','⚙️ Settings']
);

}

if(u.role==='teacher'){

a.push(
['attendance','📝 Attendance Register'],
['docs','📚 My Documents'],
['assistant','🤖 Teacher Assistant'],
['submissions','📤 My Submissions'],
['results','📈 Results']
);

}

if(
u.role==='teacher' &&
(u.hod||u.examOfficer)
){

a.push([
'submissions',
'🛡️ HOD / Exam Centre'
]);

}

if(
u.role==='student'||
u.role==='parent'
){

a.push(
['portal','🎓 My Portal'],
['attendance','📝 Attendance'],
['results','📈 Results']
);

}

a.push([
'dashboard',
'🏠 Dashboard'
]);

/* remove duplicates */

let seen=new Set();

a=a.filter(x=>{

if(seen.has(x[0]))return false;

seen.add(x[0]);

return true;

});

document
.getElementById('nav')
.innerHTML=
a.map((x,i)=>`

<button
class="${i===0?'on':''}"
onclick="page('${x[0]}',this)">
${x[1]}
</button>

`).join('');

}


function page(n,b){

document
.querySelectorAll('.page')
.forEach(x=>x.classList.remove('on'));

let target=document.getElementById(n);

if(!target)return;

target.classList.add('on');

document
.querySelectorAll('.nav button')
.forEach(x=>x.classList.remove('on'));

if(b)b.classList.add('on');

let d=db();

let u=d.users.find(
x=>x.id===me().id
);

const pages={

dashboard:dash,

attendance:attendance,

students:students,

teachers:teachers,

classes:classes,

docs:docs,

assistant:assistant,

submissions:submissions,

results:results,

portal:portal,

settings:settings

};

if(pages[n])
pages[n](u);

document
.getElementById('layout')
.classList.remove('open');

}


/* =========================
   DASHBOARD
========================= */

function dash(u){

let d=db();

let st=d.students.length;

let tr=d.users.filter(
x=>x.role==='teacher'

let pending=d.submissions.filter(

).length;

dashboard.innerHTML=`

</p>

<div class="cards">

</div>

<div class="card">

</div>

</div>

</div>

<div class="grid2">

${
u.role==='teacher'

?

`

class="btn"
onclick="page('attendance')">
Take Attendance
</button>

<button

`

:

`

onclick="page('students')">

`
}

</div>


<div class="panel">

<h3>Recent Activity</h3>

${
d.activity
.slice(0,8)
.map(x=>`

<p>

<br>
<small>
${esc(x.user)}
·
${new Date(x.at).toLocaleString()}

</div>

</div>

`;

}


/* =====================================================
   IMPORTANT CLASS NORMALIZATION FIX
===================================================== */

/*
This function removes a section already attached
to the class name.

Examples:

SS1 + A
= SS1 A

SS1 A + A
= SS1 A

SS1 A A + A
= SS1 A

JSS2 B + B
= JSS2 B
*/

function normalizeClassBase(value){

let v=String(value??'')
.trim()
.replace(/\s+/g,' ');

/*
Remove repeated trailing A/B/C sections.
*/

while(
/\s+(A|B|C)$/i.test(v)
){

v=v
.replace(/\s+(A|B|C)$/i,'')
.trim();

}

return v;

}


function normalizeSection(value){

const v=String(value??'')
.trim()
.toUpperCase();

return ['A','B','C'].includes(v)
?v
:'';

}


function formatClassName(className,section){

const base=normalizeClassBase(className);

const sec=normalizeSection(section);

return sec
?base+' '+sec
:base;

}


function classDisplay(c){

return formatClassName(
c.name||c.className,
c.section
);

}


/*
Clean existing old class records.
This also fixes existing A A records.
*/

function normalizeAllClasses(){

const d=db();

let changed=false;


/* CLEAN CLASSES */

d.classes=(d.classes||[]).map(c=>{

let oldName=
String(c.name||'')
.trim();

let oldSection=
normalizeSection(c.section);


/*
If the section is already inside the name,
extract it.
*/

let embeddedMatches=
oldName.match(
/\s+(A|B|C)(?:\s+(A|B|C))*$/i
);

let embeddedSection='';

if(embeddedMatches){

let parts=
embeddedMatches[0]
.trim()
.split(/\s+/);

embeddedSection=
normalizeSection(
parts[parts.length-1]
);

}


/*
Prefer explicit section.
Otherwise use embedded section.
*/

let sec=
oldSection||
embeddedSection||
'A';

let name=
normalizeClassBase(oldName);

let display=
formatClassName(name,sec);

if(
c.name!==name||
c.section!==sec||
c.displayName!==display
){

changed=true;

c={

...c,

name:name,

section:sec,

displayName:display

};

}

return c;

});


/* CLEAN STUDENT CLASS NAMES */

(d.students||[]).forEach(st=>{

if(!st.className)return;

let original=st.className;

let section=normalizeSection(
st.section
);

let match=
String(st.className)
.match(
/\s+(A|B|C)(?:\s+(A|B|C))*$/i
);

if(!section&&match){

let parts=
match[0]
.trim()
.split(/\s+/);

section=
normalizeSection(
parts[parts.length-1]
);

}

let clean=
formatClassName(
st.className,
section
);

if(st.className!==clean){

/*
Add Class accepts:

SS1
SS1 A
SS1 A A

and always saves:

name = SS1
section = A
displayName = SS1 A
*/

function addClass(){

let n=prompt(
'Class name (example: SS1, SS1 A or SS1 B)'
);

if(!n)return;

let raw=n
.trim()
.replace(/\s+/g,' ');


/*
Find the final section.
*/

let matches=
raw.match(
/(?:^|\s)(A|B|C)(?:\s+(A|B|C))*$/i
);

let sec='A';

if(matches){

let pieces=
matches[0]
.trim()
.split(/\s+/);

sec=
normalizeSection(
pieces[pieces.length-1]
);

}

let base=
normalizeClassBase(raw);

if(!base){

toast('Enter a valid class');

return;

}

let display=
formatClassName(
base,
sec
);

let d=
normalizeAllClasses();


let exists=
d.classes.some(c=>

formatClassName(
c.name,
c.section
).toLowerCase()
===
display.toLowerCase()

);


if(exists){

toast(
'That class already exists'
);

return;

}


d.classes.push({

id:id('c'),

name:base,

section:sec,

displayName:display,

session:'2026/2027'

});


save(d);

toast(
'Class '+display+' created'
);

classes(
d.users.find(x=>x.id===me().id)
);

log(
'Created class '+display
);

}


function addSubject(){

let n=prompt('Subject');

if(!n)return;

n=n.trim();

if(!n)return;

let d=db();

if(
!d.subjects.some(
x=>x.toLowerCase()===n.toLowerCase()
)
){

d.subjects.push(n);

save(d);

toast('Subject added');

classes(
d.users.find(x=>x.id===me().id)
);

}

}

let d=db();

let x=d.submissions.find(

new Date().toISOString();

save(d);

toast('Submission updated');

log('Reviewed submission');

submissions(
d.users.find(
q=>q.id===me().id
)
);

}

function saveResult(){

let ca1=
Number(
document.getElementById('rca1').value
)||0;

let ca2=
Number(
document.getElementById('rca2').value
)||0;

let ex=
Number(
document.getElementById('rex').value
)||0;


if(ca1>15||ca2>15||ex>70){

toast(
'Maximum marks: CA1 15, CA2 15, Exam 70'
);

return;

}

let total=ca1+ca2+ex;

let grade=

total>=75?'A':

total>=65?'B':

total>=55?'C':

total>=45?'D':

total>=40?'E':

'F';


let d=db();

d.results.push({

id:id('r'),

studentId:
document.getElementById('rs').value,

subject:
document.getElementById('rsub').value,

ca1:ca1,

ca2:ca2,

exam:ex,

total:total,

grade:grade,

published:true,

createdAt:
new Date().toISOString()

});


save(d);

modal.classList.remove('on');

toast('Result published');

log('Published result');

results(
d.users.find(
x=>x.id===me().id
)
);

}
