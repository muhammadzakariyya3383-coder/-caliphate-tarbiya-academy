<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Global Kids Academy Sokoto</title>

<style>
*{box-sizing:border-box}

html{
  width:100%;
  min-width:0;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  margin:0;
  width:100%;
  min-width:0;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5f9;
  color:#172033;
}

button,input,select,textarea{
  font:inherit;
  max-width:100%;
}

button{cursor:pointer}

.hidden{display:none!important}

:root{
  --green:#166534;
  --green2:#15803d;
  --green3:#22c55e;
  --dark:#14532d;
  --light:#f0fdf4;
  --border:#dbe3ea;
  --muted:#64748b;
  --danger:#b91c1c;
  --warning:#b45309;
  --blue:#1d4ed8;
}

/* LOGIN */
.login-page{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#14532d,#166534,#22c55e);
}

.login-card{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:30px;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
  width:82px;
  height:82px;
  border-radius:50%;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#166534;
  color:#fff;
  font-size:34px;
  font-weight:900;
  border:5px solid #dcfce7;
}

.login-card h1{
  text-align:center;
  margin:0;
  font-size:25px;
  color:#14532d;
}

.login-card p{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin:8px 0 22px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-weight:700;
  font-size:12px;
  margin-bottom:6px;
}

input,select,textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  background:#fff;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,.12);
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700;
  font-size:12px;
  background:#166534;
  color:#fff;
}

.btn:hover{opacity:.92}

.btn-green{background:#166534}
.btn-blue{background:#1d4ed8}
.btn-orange{background:#b45309}
.btn-red{background:#b91c1c}
.btn-gray{background:#475569}
.btn-light{
  background:#f1f5f9;
  color:#172033;
  border:1px solid #cbd5e1;
}

.full{width:100%}

.login-error{
  color:#b91c1c;
  background:#fee2e2;
  border:1px solid #fecaca;
  padding:9px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:12px;
  display:none;
}

/* APP */
.app{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
}

.sidebar{
  width:250px;
  flex:0 0 250px;
  background:#14532d;
  color:#fff;
  min-height:100vh;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  z-index:20;
}

.brand{
  padding:20px 16px;
  border-bottom:1px solid rgba(255,255,255,.15);
}

.brand strong{
  display:block;
  font-size:16px;
}

.brand small{
  opacity:.75;
  font-size:10px;
}

.nav{
  padding:12px 9px;
}

.nav button{
  display:block;
  width:100%;
  text-align:left;
  color:#fff;
  background:transparent;
  border:0;
  padding:11px 12px;
  border-radius:8px;
  margin-bottom:3px;
  font-size:12px;
}

.nav button:hover,
.nav button.active{
  background:rgba(255,255,255,.14);
}

.main{
  min-width:0;
  flex:1;
}

.topbar{
  min-height:62px;
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 18px;
  position:sticky;
  top:0;
  z-index:15;
}

.top-title{
  font-weight:900;
  color:#14532d;
}

.user-pill{
  background:#dcfce7;
  color:#14532d;
  padding:8px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.content{
  padding:18px;
  min-width:0;
}

.page-title{
  margin:0;
  font-size:24px;
  color:#14532d;
}

.page-subtitle{
  color:#64748b;
  font-size:12px;
  margin:5px 0 18px;
}

/* CARDS */
.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 7px rgba(15,23,42,.04);
}

.card h3{
  margin:0 0 13px;
  color:#14532d;
  font-size:15px;
}

.grid-2,
.grid-3,
.grid-4{
  display:grid;
  gap:13px;
}

.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.stat{
  padding:17px;
  border-radius:12px;
  background:#fff;
  border:1px solid #e2e8f0;
}

.stat .num{
  font-size:26px;
  font-weight:900;
  color:#166534;
}

.stat .label{
  color:#64748b;
  font-size:11px;
  margin-top:4px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}

.toolbar>*{
  flex:0 0 auto;
}

/* TABLE */
.table-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #e2e8f0;
  padding:8px;
  font-size:11px;
  text-align:left;
  vertical-align:middle;
}

th{
  background:#f0fdf4;
  color:#14532d;
  font-weight:900;
}

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

/* REGISTER */
.register-meta{
  display:grid;
  grid-template-columns:repeat(4,minmax(130px,1fr));
  background:#14532d;
  color:#fff;
  border-radius:9px 9px 0 0;
  overflow:hidden;
}

.register-meta div{
  padding:10px;
  border-right:1px solid rgba(255,255,255,.25);
}

.register-meta div:last-child{
  border-right:0;
}

.register-meta strong{
  display:block;
  font-size:10px;
  opacity:.75;
  text-transform:uppercase;
}

.register-meta span{
  display:block;
  font-weight:900;
  margin-top:3px;
  font-size:12px;
}

.register-table{
  min-width:max-content;
}

.register-table th,
.register-table td{
  text-align:center;
  padding:5px;
}

.register-table .student-name{
  min-width:170px;
  max-width:220px;
  text-align:left;
  position:sticky;
  left:0;
  z-index:3;
  background:#fff;
}

.register-table th.student-name{
  background:#14532d;
  color:#fff;
}

.day-head{
  min-width:39px;
  width:39px;
}

.weekend-head{
  background:#f8fafc!important;
}

.holiday-head{
  background:#fef3c7!important;
  color:#92400e!important;
}

.mark{
  min-width:29px;
  min-height:29px;
  width:29px;
  height:29px;
  padding:0;
  border-radius:6px;
  border:1px solid #cbd5e1;
  background:#fff;
  font-size:11px;
  font-weight:900;
}

.mark.present{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac;
}

.mark.absent{
  background:#fee2e2;
  color:#b91c1c;
  border-color:#fca5a5;
}

.summary-box{
  display:grid;
  grid-template-columns:repeat(4,minmax(120px,1fr));
  gap:10px;
  margin-top:14px;
}

.summary-item{
  padding:12px;
  border:1px solid #e2e8f0;
  border-radius:9px;
  background:#f8fafc;
}

.summary-item strong{
  display:block;
  font-size:19px;
  color:#166534;
}

.summary-item span{
  color:#64748b;
  font-size:10px;
}

/* SIGNATURES */
.signature-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}

.signature-box{
  border:1px solid #cbd5e1;
  border-radius:11px;
  padding:12px;
  background:#fff;
}

.signature-box h4{
  margin:0 0 10px;
  color:#14532d;
  font-size:13px;
}

.signature-pad-wrap{
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  padding:8px;
}

.signature-canvas{
  display:block;
  width:100%;
  height:150px;
  background:#fff;
  border:1px dashed #94a3b8;
  border-radius:8px;
  touch-action:none;
  cursor:crosshair;
}

.signature-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:8px;
}

.signature-note{
  font-size:10px;
  color:#64748b;
  margin-top:6px;
}

.signature-print-image{
  display:none;
  width:100%;
  height:100px;
  object-fit:contain;
  object-position:left bottom;
  border-bottom:1px solid #334155;
}

.check-line{
  display:flex;
  gap:6px;
  align-items:center;
  font-size:11px;
  font-weight:700;
  margin-top:9px;
}

.check-line input{
  width:auto;
}

/* BADGES */
.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:12px;
  font-size:9px;
  font-weight:900;
}

.badge-green{
  background:#dcfce7;
  color:#166534;
}

.badge-orange{
  background:#fef3c7;
  color:#92400e;
}

.badge-red{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-blue{
  background:#dbeafe;
  color:#1d4ed8;
}

/* EMPTY */
.empty{
  text-align:center;
  color:#64748b;
  padding:30px 10px;
  font-size:12px;
}

/* MOBILE */
@media(max-width:900px){
  .sidebar{
    width:210px;
    flex-basis:210px;
  }

  .grid-4{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .signature-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){
  .app{
    display:block;
  }

  .sidebar{
    width:100%;
    height:auto;
    min-height:auto;
    position:relative;
  }

  .brand{
    padding:13px;
  }

  .nav{
    display:flex;
    overflow-x:auto;
    gap:4px;
    padding:7px;
    -webkit-overflow-scrolling:touch;
  }

  .nav button{
    width:auto;
    white-space:nowrap;
    margin:0;
    padding:9px 10px;
  }

  .topbar{
    position:relative;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .register-meta{
    grid-template-columns:1fr 1fr;
  }

  .summary-box{
    grid-template-columns:1fr 1fr;
  }

  .content{
    padding:10px;
  }
}

@media(max-width:360px){
  .login-page{padding:10px}

  .login-card{
    padding:18px 13px;
    border-radius:15px;
  }

  .login-card h1{
    font-size:20px;
  }

  .logo{
    width:62px;
    height:62px;
    font-size:25px;
  }

  .content{
    padding:8px;
  }

  .card{
    padding:12px;
    border-radius:10px;
  }

  .page-title{
    font-size:19px;
  }

  .page-subtitle{
    font-size:11px;
  }

  .topbar{
    padding:8px;
  }

  .top-title{
    font-size:11px;
  }

  .btn{
    padding:9px 10px;
    font-size:11px;
  }

  input,select,textarea{
    font-size:14px;
    padding:10px;
  }

  .register-meta{
    grid-template-columns:1fr;
  }

  .summary-box{
    grid-template-columns:1fr;
  }
}

/* PRINT */
@media print{
  body{
    background:#fff;
  }

  .sidebar,
  .topbar,
  .toolbar,
  .no-print,
  .signature-actions,
  .signature-note{
    display:none!important;
  }

  .main{
    width:100%;
  }

  .content{
    padding:0;
  }

  .card{
    border:0;
    box-shadow:none;
  }

  .signature-canvas{
    display:none!important;
  }

  .signature-print-image{
    display:block!important;
  }

  .register-table{
    min-width:0;
  }

  @page{
    size:A4 landscape;
    margin:8mm;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="logo">GKA</div>

    <h1>Global Kids Academy Sokoto</h1>
    <p>School Academic Management System</p>

    <div id="loginError" class="login-error">
      Invalid username or password.
    </div>

    <div class="form-group">
      <label>Login Type</label>
      <select id="loginRole">
        <option value="Administrator">Administrator</option>
        <option value="Teacher">Teacher</option>
        <option value="Student">Student</option>
        <option value="Parent">Parent</option>
      </select>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input id="loginUsername" autocomplete="username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
    </div>

    <button class="btn btn-green full" onclick="login()">
      Login
    </button>

    <p style="font-size:10px;margin-top:15px">
      Administrator default: Admin / Admin@2026!
    </p>
  </div>
</div>


<!-- APPLICATION -->
<div id="app" class="app hidden">

  <aside class="sidebar">

    <div class="brand">
      <strong>Global Kids Academy</strong>
      <small>Sokoto • Academic Management System</small>
    </div>

    <nav class="nav" id="nav"></nav>

  </aside>

  <main class="main">

    <header class="topbar">
      <div class="top-title" id="topTitle">
        Global Kids Academy Sokoto
      </div>

      <div style="display:flex;align-items:center;gap:7px">
        <span class="user-pill" id="userPill"></span>
        <button class="btn btn-red" onclick="logout()">Logout</button>
      </div>
    </header>

    <section class="content" id="content"></section>

  </main>
</div>


<script>
"use strict";

/* =========================================================
   DATABASE
========================================================= */

const DB_KEY =
  "GLOBAL_KIDS_ACADEMY_SOKOTO_DATABASE_V1";

const SESSION_KEY =
  "GLOBAL_KIDS_ACADEMY_SOKOTO_SESSION_V1";

const MONTHS = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const CLASSES = [
  "Nursery 1","Nursery 2","Nursery 3",
  "Basic 1","Basic 2","Basic 3","Basic 4","Basic 5","Basic 6",
  "JSS1","JSS2","JSS3",
  "SS1","SS2","SS3"
];

const SECTIONS = ["A","B"];

const SUBJECTS = [
  "Mathematics",
  "English Language",
  "Physics",
  "Chemistry",
  "Biology",
  "Economics",
  "Hausa",
  "Arabic",
  "French",
  "Computer Studies",
  "Basic Science",
  "Basic Technology",
  "Social Studies",
  "Civic Education",
  "Agricultural Science",
  "Geography",
  "Government",
  "Literature in English",
  "Islamic Religious Studies",
  "Christian Religious Studies",
  "Home Economics",
  "Commerce",
  "Financial Accounting",
  "Further Mathematics"
];

function defaultDB(){

  return {
    school:{
      name:"Global Kids Academy Sokoto",
      address:"Sokoto State, Nigeria",
      phone:"",
      email:"",
      session:"2026/2027",
      term:"First Term"
    },

    users:[
      {
        id:"admin-1",
        username:"Admin",
        password:"Admin@2026!",
        role:"Administrator",
        name:"System Administrator"
      }
    ],

    teachers:[],
    students:[],
    parents:[],
    classes:[],
    results:[],
    documents:[],
    approvals:[],
    archive:[],
    attendance:{},
    registerSignatures:{},
    settings:{
      currentPage:"dashboard"
    }
  };
}

let db = loadDB();
let session = loadSession();
let signaturePads = {};

function loadDB(){

  try{
    const raw = localStorage.getItem(DB_KEY);

    if(raw){
      const data = JSON.parse(raw);

      const base = defaultDB();

      return Object.assign(base,data,{
        school:Object.assign(base.school,data.school||{}),
        users:data.users||base.users,
        teachers:data.teachers||[],
        students:data.students||[],
        parents:data.parents||[],
        classes:data.classes||[],
        results:data.results||[],
        documents:data.documents||[],
        approvals:data.approvals||[],
        archive:data.archive||[],
        attendance:data.attendance||{},
        registerSignatures:data.registerSignatures||{},
        settings:Object.assign(base.settings,data.settings||{})
      });
    }

  }catch(e){
    console.error(e);
  }

  return defaultDB();
}

function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function loadSession(){

  try{
    const raw=localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

function saveSession(){
  localStorage.setItem(SESSION_KEY,JSON.stringify(session));
}

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){
  return escapeHTML(value);
}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const role =
    document.getElementById("loginRole").value;

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const user=db.users.find(u=>
    u.username===username &&
    u.password===password &&
    u.role===role
  );

  if(!user){

    const error=document.getElementById("loginError");

    error.style.display="block";
    error.textContent="Invalid username, password or login type.";

    return;
  }

  session={
    id:user.id,
    username:user.username,
    role:user.role,
    name:user.name
  };

  saveSession();

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  buildNav();
  openPage("dashboard");
}

function logout(){

  localStorage.removeItem(SESSION_KEY);
  session=null;

  location.reload();
}

function boot(){

  if(session){

    document.getElementById("loginPage")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

    buildNav();
    openPage("dashboard");

  }
}

function isAdmin(){
  return session && session.role==="Administrator";
}


/* =========================================================
   NAVIGATION
========================================================= */

function buildNav(){

  const nav=document.getElementById("nav");

  let items=[];

  if(isAdmin()){

    items=[
      ["dashboard","🏠 Dashboard"],
      ["teachers","👨‍🏫 Teachers"],
      ["students","🎓 Students"],
      ["parents","👪 Parents"],
      ["classes","🏫 Classes & Subjects"],
      ["register","📋 School Register"],
      ["results","📊 Results"],
      ["documents","📚 Academic Documents"],
      ["approval","✅ Approval Centre"],
      ["archive","🗄️ Approved Work Archive"],
      ["assistant","🤖 Teacher Assistant"],
      ["settings","⚙️ School Settings"],
      ["backup","💾 Backup & Restore"]
    ];

  }else{

    items=[
      ["dashboard","🏠 Dashboard"],
      ["register","📋 School Register"],
      ["results","📊 Results"],
      ["documents","📚 Academic Documents"],
      ["assistant","🤖 Teacher Assistant"]
    ];
  }

  nav.innerHTML=items.map(item=>`
    <button
      id="nav-${item[0]}"
      onclick="openPage('${item[0]}')">
      ${item[1]}
    </button>
  `).join("");
}

function setActiveNav(page){

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  const el=document.getElementById("nav-"+page);

  if(el) el.classList.add("active");
}

function openPage(page){

  db.settings.currentPage=page;
  saveDB();

  setActiveNav(page);

  const content=document.getElementById("content");

  if(page==="dashboard") renderDashboard();
  else if(page==="teachers") renderTeachers();
  else if(page==="students") renderStudents();
  else if(page==="parents") renderParents();
  else if(page==="classes") renderClasses();
  else if(page==="register") renderRegister();
  else if(page==="results") renderResults();
  else if(page==="documents") renderDocuments();
  else if(page==="approval") renderApproval();
  else if(page==="archive") renderArchive();

}

function registerKey(className,section,month){
  return `${className}__${section}__${month}`;
}

function getDaysInMonth(monthIndex){

  return new Date(
    new Date().getFullYear(),
    Number(monthIndex)+1,
    0
  ).getDate();
}

function openRegisterWorkspace(){

  const className=document.getElementById("registerClass").value;
  const section=document.getElementById("registerSection").value;
  const month=Number(document.getElementById("registerMonth").value);

  renderRegisterWorkspace(
    className,
    section,
    month
  );
}

function renderRegisterWorkspace(
  className,
  section,
  month
){

  const box=document.getElementById("registerWorkspace");

  if(!box)return;

  const key=registerKey(
    className,
    section,
    month
  );

  if(!db.attendance[key]){
    db.attendance[key]={};
  }

  const records=db.attendance[key];

  const students=db.students.filter(s=>
    s.className===className &&
    s.section===section
  );

  const days=getDaysInMonth(month);

  let dayHeaders="";

  for(let day=1;day<=days;day++){

    const date=new Date(
      new Date().getFullYear(),
      month,
      day
    );

    const dayName=date
      .toLocaleDateString(
        "en-US",
        {weekday:"short"}
      )
      .toUpperCase();

    const weekend=
      date.getDay()===0 ||
      date.getDay()===6;

    dayHeaders+=`

      <th
        class="day-head ${
          weekend ? "weekend-head" : ""
        }">

        <div style="
          font-size:9px;
          font-weight:900;">
          ${dayName}
        </div>

        <div style="
          font-size:11px;
          margin-top:2px;">
          ${day}
        </div>

      </th>
    `;
  }

  const rows=students.length
    ?
    students.map((student,index)=>{

      const studentId=student.id;

      let cells="";

      for(let day=1;day<=days;day++){

        const status=
          records[studentId]?.[day] || "";

        cells+=`

          <td>

            <button
              class="mark ${
                status==="P"
                ? "present"
                : status==="A"
                ? "absent"
                : ""

              onclick="cycleAttendance(
                '${escapeAttr(key)}',
                '${escapeAttr(studentId)}',
                ${day},
                '${escapeAttr(className)}',
                '${escapeAttr(section)}',

/* =========================================================
   DIGITAL SIGNATURE PAD
========================================================= */

function setupSignaturePad(
  canvasId,
  existingData=""
){

  const canvas=document.getElementById(canvasId);

  if(!canvas)return null;

  const ctx=canvas.getContext("2d");

  let drawing=false;
  let hasSignature=false;

  function resizeCanvas(){

    const rect=canvas.getBoundingClientRect();

    const ratio=Math.max(
      window.devicePixelRatio || 1,
      1
    );

    canvas.width=Math.max(
      1,
      Math.floor(rect.width*ratio)
    );

    canvas.height=Math.max(
      1,
      Math.floor(rect.height*ratio)
    );

    ctx.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );

    ctx.lineWidth=2.2;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.strokeStyle="#111827";

    if(existingData){

      const img=new Image();

      img.onload=()=>{

        ctx.drawImage(
          img,
          0,
          0,
          rect.width,
          rect.height
        );

        hasSignature=true;
      };

      img.src=existingData;
    }
  }

  resizeCanvas();

  function position(event){

    const rect=
      canvas.getBoundingClientRect();

    return {
      x:event.clientX-rect.left,
      y:event.clientY-rect.top
    };
  }

  canvas.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      drawing=true;
      hasSignature=true;

      try{
        canvas.setPointerCapture(
          event.pointerId
        );
      }catch(e){}

      const p=position(event);

      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
    },
    {passive:false}
  );

  canvas.addEventListener(
    "pointermove",
    event=>{

      if(!drawing)return;

      event.preventDefault();

      const p=position(event);

      ctx.lineTo(p.x,p.y);
      ctx.stroke();

    },
    {passive:false}
  );

  function stopDrawing(event){

    if(!drawing)return;

    drawing=false;

    try{
      canvas.releasePointerCapture(
        event.pointerId
      );
    }catch(e){}

    ctx.closePath();
  }

  canvas.addEventListener(
    "pointerup",
    stopDrawing
  );

  canvas.addEventListener(
    "pointercancel",
    stopDrawing
  );

  return {

    clear(){

      const rect=
        canvas.getBoundingClientRect();

      ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
      );

      hasSignature=false;

      const imageId=
        canvasId==="sigCanvasTeacher"
        ? "printSigTeacher"
        : canvasId==="sigCanvasHod"
        ? "printSigHod"
        : "printSigPrincipal";

      const image=document.getElementById(imageId);

      if(image)image.removeAttribute("src");
    },

    data(){

      if(!hasSignature)return "";

      return canvas.toDataURL(
        "image/png"
      );
    }

  };
}

function initRegisterSignaturePads(sig){

  signaturePads={};

  signaturePads.teacher=
    setupSignaturePad(
      "sigCanvasTeacher",
      sig.teacherSignature || ""
    );

  signaturePads.hod=
    setupSignaturePad(
      "sigCanvasHod",
      sig.hodSignature || ""
    );

  signaturePads.principal=
    setupSignaturePad(
      "sigCanvasPrincipal",
      sig.principalSignature || ""
    );

  setTimeout(()=>{
    updatePrintSignatureImages();
  },100);
}

function clearSignaturePad(role){

  if(signaturePads[role]){
    signaturePads[role].clear();
  }
}

function updatePrintSignatureImages(){

  const pairs=[
    ["teacher","printSigTeacher"],
    ["hod","printSigHod"],
    ["principal","printSigPrincipal"]
  ];

  pairs.forEach(pair=>{

    const role=pair[0];
    const image=document.getElementById(pair[1]);

    if(!image)return;

    if(signaturePads[role]){

      const data=
        signaturePads[role].data();

      if(data){
        image.src=data;
      }else{
        image.removeAttribute("src");
      }
    }
  });
}

function cycleAttendance(
  key,
  studentId,
  day,
  className,
  section,
  month
){

  if(!db.attendance[key]){
    db.attendance[key]={};
  }

  if(!db.attendance[key][studentId]){
    db.attendance[key][studentId]={};
  }

  const current=
    db.attendance[key][studentId][day] || "";

  let next="";

  if(current===""){
    next="P";
  }else if(current==="P"){
    next="A";
  }else{
    next="";
  }

  db.attendance[key][studentId][day]=next;

  saveDB();

  renderRegisterWorkspace(
    className,
    section,
    month
  );
}

function updateRegisterTotals(
  className,
  section,
  month
){

  const key=registerKey(
    className,
    section,
    month
  );

  const records=db.attendance[key]||{};

  let totalP=0;
  let totalA=0;

  Object.keys(records).forEach(studentId=>{

    let p=0;
    let a=0;

    Object.values(records[studentId]||{})
      .forEach(value=>{

        if(value==="P"){
          p++;
          totalP++;
        }

        if(value==="A"){
          a++;
          totalA++;
        }

      });

    const days=p+a;
    const percentage=
      days
      ? Math.round((p/days)*100)
      : 0;

    const pEl=document.getElementById(
      "present-"+studentId
    );

    const aEl=document.getElementById(
      "absent-"+studentId
    );

    const percentEl=document.getElementById(
      "percent-"+studentId
    );

    if(pEl)pEl.textContent=p;
    if(aEl)aEl.textContent=a;
    if(percentEl)percentEl.textContent=
      percentage+"%";
  });

  const totalPElement=
    document.getElementById("totalPresentCount");

  const totalAElement=
    document.getElementById("totalAbsentCount");

  const overallElement=
    document.getElementById("overallPercentage");

  if(totalPElement)
    totalPElement.textContent=totalP;

  if(totalAElement)
    totalAElement.textContent=totalA;

  const overall=totalP+totalA
    ? Math.round(
        (totalP/(totalP+totalA))*100
      )
    : 0;

  if(overallElement)
    overallElement.textContent=
      overall+"%";

}

function clearMonthRegister(
  className,
  section,
  month
){

  if(!confirm(

  const key=registerKey(

  db.attendance[key]={};

}

  const teacherSignature=
    signaturePads.teacher
    ? signaturePads.teacher.data()

    ? signaturePads.hod.data()

    : old.principalSignature || "";

  db.registerSignatures[key]={

    teacherName:
      document.getElementById(

function gradeFromTotal(total){

  if(total>=75)return"A";
  if(total>=65)return"B";
  if(total>=55)return"C";
  if(total>=45)return"D";
  if(total>=40)return"E";
  return"F";
}

}

      <h3>School Profile</h3>

      <div class="grid-2">

        <div class="form-group">
          <label>School Name</label>
          <input
            id="schoolName"
            value="${escapeAttr(db.school.name)}">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input
            id="schoolPhone"
            value="${escapeAttr(db.school.phone)}">
        </div>

        <div class="form-group">
          <label>Address</label>
          <input
            id="schoolAddress"
            value="${escapeAttr(db.school.address)}">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            id="schoolEmail"
            value="${escapeAttr(db.school.email)}">
        </div>

        <div class="form-group">
          <label>Academic Session</label>
          <input
            id="schoolSession"
            value="${escapeAttr(db.school.session)}">
        </div>

        <div class="form-group">
          <label>Current Term</label>
          <select id="schoolTerm">

            ${[
              "First Term",
              "Second Term",
              "Third Term"
            ].map(t=>`
              <option
                ${db.school.term===t?"selected":""}>
                ${t}
              </option>
            `).join("")}

          </select>
        </div>

      </div>

      <button
        class="btn btn-green"
        onclick="saveSettings()">
        Save Settings
      </button>

    </div>
  `;
}

function saveSettings(){

  db.school.name=
    document.getElementById(
      "schoolName"
    ).value.trim();

  db.school.phone=
    document.getElementById(
      "schoolPhone"
    ).value.trim();

  db.school.address=
    document.getElementById(
      "schoolAddress"
    ).value.trim();

  db.school.email=
    document.getElementById(
      "schoolEmail"
    ).value.trim();

  db.school.session=
    document.getElementById(
      "schoolSession"
    ).value.trim();

  db.school.term=
    document.getElementById(
      "schoolTerm"
    ).value;

  saveDB();

  alert("School settings saved.");
}


/* =========================================================
   BACKUP / RESTORE
========================================================= */

function renderBackup(){

  if(!isAdmin())return;

  document.getElementById("content").innerHTML=`

    <h1 class="page-title">
      Backup & Restore
    </h1>

    <div class="card">

      <h3>Backup Database</h3>

      <p style="
        font-size:12px;
        color:#64748b;">
        Download a complete copy of the school database.
      </p>

      <button
        class="btn btn-green"
        onclick="downloadBackup()">
        Download Backup
      </button>

    </div>

    <div class="card">

      <h3>Restore Database</h3>

      <input
        type="file"
        id="restoreFile"
        accept=".json">

      <button
        class="btn btn-blue"
        style="margin-top:10px"
        onclick="restoreBackup()">
        Restore Backup
      </button>

    </div>

    <div class="card">

      <h3>Database Information</h3>

      <p style="font-size:12px">
        Teachers: ${db.teachers.length}<br>
        Students: ${db.students.length}<br>
        Parents: ${db.parents.length}<br>
        Results: ${db.results.length}<br>
        Documents: ${db.documents.length}<br>
        Approved Archive: ${db.archive.length}
      </p>

    </div>
  `;
}

function downloadBackup(){

  const data=JSON.stringify(
    db,
    null,
    2
  );

  const blob=new Blob(
    [data],
    {type:"application/json"}
  );

  const url=
    URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;

  a.download=
    "global-kids-academy-backup-"+
    new Date()
      .toISOString()
      .slice(0,10)+
    ".json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}

function restoreBackup(){

  const input=
    document.getElementById(
      "restoreFile"
    );

  if(!input.files.length){
    alert("Select a backup file first.");
    return;
  }

  const file=input.files[0];

  const reader=new FileReader();

  reader.onload=function(){

    try{

      const restored=
        JSON.parse(reader.result);

      if(
        !restored.school ||
        !restored.users
      ){

        throw new Error(
          "Invalid database"
        );
      }

      if(!confirm(
        "Restore this database? Current data will be replaced."
      ))return;

      db=restored;

      saveDB();

      alert(
        "Database restored successfully."
      );

      location.reload();

    }catch(e){

      alert(
        "Unable to restore this backup."
      );
    }
  };

  reader.readAsText(file);
}


/* =========================================================
   INITIALIZE
========================================================= */

boot();

</script>
